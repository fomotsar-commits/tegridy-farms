<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" />
    <!-- R077: point at the W3C-spec manifest filename. `manifest.webmanifest`
         is the canonical extension for Web App Manifests; `manifest.json`
         can confuse some PWA tooling. -->
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <!-- F30/F8: black-translucent lets content (and the safe-area-inset-top
         header padding) sit under the status bar on a notched standalone launch. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#060c1a">
    <!--
      AUDIT THEME-FOUC: pre-hydration theme script runs synchronously before
      CSS parses. Served externally from /theme-init.js so vercel.json CSP can
      drop 'unsafe-inline' from script-src. Keep the storage key
      (`tegridy-theme`) and default (`dark`) in lock-step with
      frontend/src/contexts/ThemeContext.tsx.
    -->
    <link rel="preload" as="script" href="/theme-init.js" />
    <script src="/theme-init.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Tegridy Farms — DeFi protocol for swapping, staking, farming, and NFT finance on Ethereum">
    <!-- R077: serve a purpose-built 192px PNG, not a JPG of the logo. iOS
         home-screen icons render best when the image is a square PNG with
         the correct sizes attribute; JPG works but lacks transparency. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="192x192">
    <!-- CSP enforced via Vercel headers in vercel.json (not meta tag — avoids mobile Safari issues) -->
    <link rel="canonical" href="https://memetic.fun/" />
    <title>Tegridy Farms | TOWELI Yield Farm</title>
    <meta property="og:title" content="Tegridy Farms | TOWELI Yield Farm" />
    <!-- F69: align with the 2026-06-11 honesty pass — every protocol fee flows
         on-chain to stakers, the liquidity engine, and operations (the rendered
         hero no longer claims a fixed "100% to stakers"; crawlers read this
         static HTML, so it must match). -->
    <meta property="og:description" content="Art-first yield farming on Ethereum. Stake TOWELI & earn rewards. Every protocol fee flows on-chain to stakers, the liquidity engine, and operations." />
    <!-- Purpose-built social preview — see docs/SOCIAL_PREVIEW_SPEC.md.
         PNG is the primary for crawler compatibility (Discord/Slack/
         Facebook image proxies only accept raster). SVG is served as
         secure_url for modern crawlers that want sharpness. Both are
         regenerated via `node scripts/render-og-png.mjs`. -->
    <meta property="og:image" content="https://memetic.fun/og.png" />
    <!-- R077: secure_url must declare a raster URL so Facebook/Discord
         crawlers don't reject the SVG fallback for failing to match
         og:image:type. Both are functionally identical PNGs. -->
    <meta property="og:image:secure_url" content="https://memetic.fun/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta property="og:image:alt" content="Tegridy Farms — DeFi yield protocol on Ethereum where protocol fees flow on-chain to stakers" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://memetic.fun/" />
    <meta property="og:site_name" content="Tegridy Farms" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tegridy Farms | TOWELI Yield Farm" />
    <meta name="twitter:description" content="Art-first yield farming on Ethereum. Stake TOWELI & earn rewards." />
    <meta name="twitter:image" content="https://memetic.fun/og.png" />
    <meta name="twitter:image:alt" content="Tegridy Farms — DeFi yield protocol on Ethereum" />
    <meta name="twitter:url" content="https://memetic.fun/" />
    <!-- Preconnect to NFT image CDNs for faster loading -->
    <link rel="preconnect" href="https://assets.mgxs.co" crossorigin>
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
    <!-- Alchemy's NFT API now serves media from nft2-cdn; the legacy nft-cdn host is
         still hardcoded in src/nakamigos/constants.js + middleware.js, so warm both.
         Keep BOTH in lock-step with img-src in vercel.json — a host missing there is a
         broken placeholder in production and invisible locally. -->
    <link rel="preconnect" href="https://nft2-cdn.alchemy.com" crossorigin>
    <link rel="preconnect" href="https://nft-cdn.alchemy.com" crossorigin>
    <!-- DNS prefetch for API endpoints used by aggregator/swap routing -->
    <link rel="dns-prefetch" href="https://api.geckoterminal.com">
    <link rel="dns-prefetch" href="https://api.odos.xyz">
    <link rel="dns-prefetch" href="https://api.cow.fi">
    <link rel="dns-prefetch" href="https://li.quest">
    <link rel="dns-prefetch" href="https://assets.coingecko.com">
    <!-- Self-hosted fonts — no third-party requests (#71) -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/playfair-display-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/fonts/fonts.css">
    <!-- F19: the splash picks 4 random art pieces from a 41-entry pool, so
         preloading specific splash JPGs was <10% likely to be used (and repeat
         visitors skip the splash entirely yet still paid the bytes). Keep only
         bobowelie — it's the TopNav replay button and the Towelie avatar, so
         it's genuinely warmed on every page. -->
    <link rel="preload" as="image" href="/art/bobowelie.jpg">
    <!-- F66: the home hero (home:0 → /art/iphone/IMG_0148.jpg) is the LCP image,
         rendered full-viewport. Preload it at high priority so the browser
         fetches it ahead of below-the-fold art instead of discovering it late.
         Keep this in lock-step with the home:0 override in src/lib/artOverrides.ts. -->
    <link rel="preload" as="image" href="/art/iphone/IMG_0148.jpg" fetchpriority="high">
    <script type="application/ld+json">
    {"@context":"https://schema.org","@type":"WebApplication","name":"Tegridy Farms","description":"Art-first yield farming protocol on Ethereum","url":"https://memetic.fun","applicationCategory":"DeFi","operatingSystem":"Web"}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- F30: JS-disabled visitors otherwise get a blank #root. -->
    <noscript>
      <div style="max-width:640px;margin:48px auto;padding:24px;font-family:system-ui,sans-serif;color:#ede9fe;text-align:center;line-height:1.5">
        <h1 style="font-size:20px;margin:0 0 12px">Tegridy Farms requires JavaScript</h1>
        <p style="font-size:14px;color:#a599c9;margin:0">
          This DeFi app needs JavaScript enabled to connect your wallet and read on-chain data.
          Please enable JavaScript and reload the page.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
