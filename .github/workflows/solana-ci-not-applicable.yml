name: solana-ci

# COMPANION WORKFLOW. See contracts-ci-not-applicable.yml for the full
# reasoning — same bug, same recipe, same rule about finish order.
#
# solana-ci.yml is filtered by `paths: ["solana/**", …]`. Its new
# all-checks-pass aggregator is the check branch protection should require;
# without this companion that check never reports on a PR that touches no
# Solana code, and the requirement would hang every other PR in the repo.
#
# Only the aggregator is mirrored, not all six underlying jobs — requiring the
# aggregate is the point of adding it, and mirroring six names would re-create
# the maintenance burden it removes.
#
# solana-ci.yml's triggers carry no `branches:` filter, so it runs on pushes to
# any branch. This companion is pull_request-only on purpose: a check context
# only has to exist where a merge is gated on it.
#
# `name:` above and the job name below are the wire format for the check
# context. Renaming either silently unsolders this.

on:
  pull_request:
    paths-ignore:
      - "solana/**"
      - ".github/workflows/solana-ci.yml"

permissions:
  contents: read

jobs:
  all-checks-pass:
    name: all-checks-pass
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: No Solana surface in this diff
        run: echo "solana-ci.yml does not apply to this change set; reporting its required check as satisfied."
