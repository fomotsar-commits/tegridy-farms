name: CI

on:
  push:
    branches: [main, mvp-launch]
  pull_request:
    branches: [main, mvp-launch]

# Least-privilege default — jobs may not write to the repo, PRs, issues, or
# publish anything. Any job that needs more scope must opt in explicitly.
permissions:
  contents: read

concurrency:
  # PRs CANCEL THEIR SUPERSEDED RUNS; TRUNK RUNS MUST FINISH.
  #
  # The group is per-ref, so every push to main/mvp-launch lands in the SAME
  # group. With cancel-in-progress:true that meant each merge killed the run
  # started by the merge before it -- on the one branch that deploys to
  # production.
  #
  # Measured on trunk 2026-09-04, immediately after a burst of dependabot
  # merges:
  #     9b128dc2 (#389)  9 checks, 9 cancelled, 0 success
  #     83b69ad6 (#388)  5 checks, 5 cancelled, 0 success
  #     3 dependabot bumps   9 checks, 5 cancelled each
  # Six consecutive commits reached production without a completed trunk run.
  # Each had been green as a PR, so what went unverified was the COMBINATION,
  # which is precisely what a trunk run is for.
  #
  # Cancelled is not red. The branch protection UI shows no failures and the
  # commit list looks clean, which is why this survived several rounds of
  # "trunk is green".
  #
  # The saving that cancel-in-progress exists for is real but belongs to PRs,
  # where pushing a fixup should abandon the previous run. `github.event_name`
  # is 'pull_request' there and 'push' on trunk, and the expression yields a
  # literal true/false -- never the empty string that silently invalidates a
  # workflow file.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-typecheck-test:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      # AUDIT R056: SHA-pinned (was floating @v4) — supply-chain hardening.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # FRESH-EYES CI: --ignore-scripts blocks supply-chain code execution via
      # postinstall hooks on untrusted PRs. No native modules in this project.
      - run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      # `-b` is load-bearing. frontend/tsconfig.json is a SOLUTION file —
      # `{"files": [], "references": [tsconfig.app.json, tsconfig.node.json]}`.
      # Plain `tsc --noEmit` reads it, finds an empty `files` and no `include`,
      # follows NO references (that only happens in build mode), and type-checks
      # exactly zero files in ~0.4s. This step has been reporting a green
      # "Type Check" over nothing.
      #
      # Not a hole in coverage — the Build job below runs `npm run build`
      # (`tsc -b && vite build`) with no continue-on-error, so types WERE
      # actually checked, just later and under a different step name. This
      # makes the cheap early gate real again. Same bug in package.json's
      # `precommit`, fixed alongside.
      - name: Type Check
        run: npx tsc -b --noEmit

      - name: Unit Tests
        # `continue-on-error: true` REMOVED 2026-07-28 — its premise expired.
        #
        # It was added 2026-05-18 for 79 vitest failures that pre-existed ON
        # MAIN (missing WagmiProvider/ThemeProvider wrappers), to keep merges
        # unblocked while the test-infra repair landed. That repair has landed
        # on this branch: run 30419320649 on mvp-launch reports
        # `Test Files 138 passed (138)` with the step green on its own merits.
        #
        # Leaving the hatch open past its premise is how a suite stops being a
        # gate without anyone deciding that: every regression in the 138 files
        # — including the 44 serverless-API security tests — would have gone
        # green. The vitest baseline is branch-specific (main still carries
        # pre-existing failures); this flip is correct for mvp-launch and must
        # be re-checked before porting to main.
        run: npm test

      # indexer-solana/ is a separate Node service, so its tests cannot be
      # collected by the step above: vitest's `root` is frontend/ and include
      # globs are resolved under it — nothing above frontend/ is reachable,
      # whatever the glob says (src/test/vitestCollection.test.ts asserts that
      # boundary and lists this step as the runner for these files).
      #
      # It reuses the vitest installed here rather than a second node_modules:
      # the service itself has one runtime dependency and no dev tree, and a
      # test runner it does not ship is a runner that never drifts from this one.
      - name: Solana indexer unit tests
        run: npx vitest run --root ../indexer-solana --environment node

      # bot/ is the same shape as indexer-solana above — a long-running service
      # outside frontend/, unreachable by this project's include glob — so it gets
      # its own root and is listed as the runner for `bot/` in
      # src/test/vitestCollection.test.ts.
      #
      # It ships ZERO npm dependencies (the Telegram transport is plain fetch), so
      # there is nothing to install here and nothing that could reach the bot's
      # secret through a postinstall. The non-custodial guard itself is NOT in this
      # step: api/__tests__/bot-noncustodial.test.js runs in the frontend suite so
      # that an edit to the API or the migration cannot skip it.
      - name: Telegram bot unit tests
        run: npx vitest run --root ../bot --environment node

      # Every protocol address, decoded rather than eyeballed.
      #
      # 2026-08-08: an operator wallet was recorded in notes only as a truncated
      # "5hNA2MXk…927v", and a later session INVENTED a full address to fit that
      # pattern — 45 characters decoding to 33 bytes, which is not a Solana pubkey
      # at all. It looked completely plausible sitting next to the real one. Nobody
      # funded it, so nothing was lost; that was luck.
      #
      # A wrong address is visually indistinguishable from a right one, so review
      # cannot catch this class of error and a markdown table would not have
      # helped. Decoding catches it every time. This step also fails when a new
      # contract lands in constants.ts without being registered, so an address can
      # never enter the codebase unexplained.
      - name: Address registry
        run: node scripts/verify-addresses.mjs

      # The registry's drift guard used to be ONE-DIRECTIONAL: it walked
      # constants.ts and asked the registry about each address it found, so its
      # reach was "addresses the frontend already imports, in one syntax". Seven
      # live mainnet contracts were invisible to it — four DELEGATECALL libraries,
      # the JBAC escrow vault, and the two retired staking deployments that still
      # custody user positions (an ARRAY literal the regex could not match). The
      # step above was green the whole time.
      #
      # It is bidirectional now (check 6 starts from the Foundry broadcast
      # receipts), and this proves it can still FAIL: each case forces the failure
      # condition against a synthetic input and asserts a failure comes back, with
      # a control that the same shape passes when it should. A green gate is not
      # evidence a gate works — it is equally consistent with a gate that cannot
      # see anything.
      - name: Address-registry drift guard self-test
        run: node scripts/verify-addresses.mjs --self-test

      # Which pubkeys are baked into the deployed Solana programs.
      #
      # A `pubkey!()` constant cannot be read from an account or an explorer, and
      # a reproducible build of a WRONG constant still reproduces and still hashes
      # correctly — so neither `solana-verify` nor reading lib.rs answers the
      # question. (The mainnet authority constants are hand-patched at build time
      # per MAINNET_RUNBOOK §2 and never committed, so trunk's source shows
      # placeholders.) Searching the binary for each key's raw 32 bytes is the only
      # check that works, and getting it wrong once already cost a program upgrade:
      # cp-swap shipped with admin::ID set to the Squads multisig account, which
      # can neither sign nor pay, leaving graduation permanently on
      # AmmNotConfigured.
      #
      # This runs the decision table, including the two cases that would make the
      # tool confidently wrong: the ProgramData header (bytes 13..45 hold the
      # UPGRADE AUTHORITY, which must not be reported as a baked-in constant) and
      # low-entropy keys (the System sentinel is 32 zero bytes, which "match"
      # anything). It also cross-checks every roster key against addresses.json.
      - name: Solana program-constant verifier self-test
        working-directory: .
        run: node scripts/verify-program-constants.mjs --self-test

      # The pre-deploy guard is the only control on the Vercel CLI path, and it
      # runs on an operator's laptop where nothing verifies it still works. Its
      # decision table is pure, so prove it here on every push instead of
      # discovering it is broken during an incident. `working-directory` is
      # overridden because the script lives at the repo root, not in frontend/.
      - name: Pre-deploy guard self-test
        working-directory: .
        run: node scripts/predeploy-check.mjs --self-test

      # Same reasoning: the ownership verifier runs on an operator's laptop
      # during the custody sprint, so its decision table is proven here.
      - name: Ownership verifier self-test
        working-directory: .
        run: node scripts/verify-ownership.mjs --self-test

      # Guards an IRREVERSIBLE broadcast. Its decision table has to be right the
      # first time — there is no second call to fix a wrong one.
      - name: One-shot guard self-test
        working-directory: .
        run: node scripts/oneshot-guard.mjs --self-test

      # THE PULL-REQUEST GATE FOR THE MONITORING RULES.
      #
      # contracts/monitoring/lib/arbLinkage.mjs decides whether the arb-linkage
      # safety condition gating every TWAP-dependent feature holds;
      # scripts/monitoring/lib/pausePlan.mjs decides what the privileged pause
      # call would be. Their 48 tests used to execute in exactly one place —
      # arb-linkage-monitor.yml — which triggers on `schedule` and
      # `workflow_dispatch` and NOTHING ELSE. Two consequences, both real:
      #
      #   * a pull request breaking either rule merged green. The break first
      #     appeared at the next */15 cron run, detached from the change that
      #     caused it and attributed to whatever landed most recently.
      #   * GitHub disables schedules after 60 days of repository inactivity. If
      #     that fires, those 48 tests stop executing ANYWHERE — and the
      #     collection guard in frontend/src/test/vitestCollection.test.ts stayed
      #     green throughout, because it checked the files were NAMED in a
      #     workflow, not that the workflow ever RUNS.
      #
      # These tests are PURE: no chain read, no secrets, no network, no frontend
      # toolchain — which is why they can sit here and could never have justified
      # putting `pull_request` on the monitor instead. That workflow's first step
      # is a live RPC read that opens GitHub issues on HALT/ERROR; triggering it
      # per-PR would fire live reads and file incidents on every push.
      #
      # The monitor still re-runs this same command on its cron (see the comment
      # on its "Verify the rule that produced the verdict" step). THIS step is the
      # one vitestCollection.test.ts names as the runner for
      # contracts/monitoring/ and scripts/monitoring/, because this is the one
      # that cannot switch itself off.
      #
      # `working-directory: .` — these live at the repo root, not in frontend/.
      - name: Monitoring rule unit tests
        working-directory: .
        run: node --test contracts/monitoring/lib/arbLinkage.test.mjs scripts/monitoring/lib/pausePlan.test.mjs

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --ignore-scripts

      # AUDIT R056 HIGH: gate WC secret injection on the PR not coming from a
      # fork. GitHub already withholds secrets on fork PRs, but this is
      # defense-in-depth: a parallel build path runs without the secret on
      # fork PRs so the build still verifies non-wallet flows cleanly.
      - name: Build (with WalletConnect, trusted context)
        if: |
          github.event_name == 'push' ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name == github.repository)
        run: npm run build
        env:
          VITE_WALLETCONNECT_PROJECT_ID: ${{ secrets.VITE_WALLETCONNECT_PROJECT_ID }}

      - name: Build (no WalletConnect, fork PR)
        if: |
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: dist
          path: frontend/dist
          retention-days: 7

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --ignore-scripts

      # webkit is required by the iphone-safari / ipad-safari projects in
      # playwright.config.ts — the iOS device descriptors run on WebKit because
      # that is the only engine iOS ships. Omitting it here does not shrink the
      # matrix, it fails the run with "browser not installed".
      #
      # The anvil job below stays chromium-only on purpose: it passes
      # --project=chromium, so webkit would be a download it never opens.
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: frontend/dist

      - name: Run E2E Tests
        # `continue-on-error: true` REMOVED 2026-07-30. It was added 2026-05-18
        # for pre-existing failures that were guessed at ("selector drift",
        # "provider setup", "the broken mint flow") and never actually triaged.
        # They were selector drift, all six of them, fixed in #137:
        #   a11y-smoke:26   expected 4 tabs; TAB_LABELS now has 5 (TWAP added)
        #   trade-page:34   asserted titleByTab headings, not TAB_LABELS tab text
        #   smoke:103       hit the /lending redirect + unscoped [role=tablist]
        #   trust-pages:82  wanted /lending in a sitemap; it is a redirect
        #   gauge-voting:74 asserted a ConnectPrompt removed on purpose (a8b985d)
        #   gauge-voting:89 aria-label grew; the link itself was never broken
        #
        # Verified before flipping, under CI-EQUIVALENT conditions:
        #   full suite, --workers=1 (matches `workers: CI ? 1` above),
        #   retries 0 (STRICTER than CI's 2):
        #     98 passed / 44 skipped / 0 failed
        #
        # One flake exists — smoke.spec.ts:85 "community tabs scroll on mobile" —
        # but it is a PARALLEL-load artifact: it passes 3/3 in isolation and did
        # not fail in the serial run. CI runs serial, so it should not surface
        # here; if it ever does, `retries: 2` is the backstop.
        #
        # The 40 money-path skips this comment used to describe are FIXED
        # (2026-08-12), and they were worse than recorded: each
        # `test.skip(!onAnvil, …)` sat in DESCRIBE scope, where Playwright
        # applies it to the whole group — so all 20 tests in
        # claim-rewards/lending/liquidity/stake/swap.spec.ts were skipped, not
        # just the 5 that need a chain. 15 of them need no chain at all and now
        # run right here; the 5 state-changing ones are gated per-test and run
        # in the e2e-anvil job below.
        run: npx playwright test

      - name: Upload E2E Report
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────
  # THE MONEY PATHS, ON A REAL CHAIN.
  #
  # Every state-changing E2E test — stake, swap, add/remove liquidity,
  # borrow/repay, claim — was skipped in every pipeline. Not by policy: the
  # harness that runs them (frontend/scripts/run-e2e-with-anvil.mjs) was
  # already committed, complete, and unreachable, because its usage line
  # pointed at `pnpm e2e` and no `e2e` script existed in package.json. One
  # missing line kept the entire money-path surface out of CI.
  #
  # Three things had to be true for this job to mean anything, and none were:
  #   1. an `e2e` script that reaches the harness              (package.json)
  #   2. the wallet mock announcing itself over EIP-6963, or the app never
  #      calls it and every "connected" assertion is really an assertion
  #      about the disconnected surface                        (fixtures/wallet.ts)
  #   3. the app's OWN rpc transports pointed at the fork — wagmi answers
  #      reads from src/lib/wagmi.ts's public endpoints, never from the
  #      connector, so funding an account on anvil funded an account the app
  #      never asks about                                      (fixtures/wallet.ts)
  #
  # ⚠ FIRST EXECUTION. The five state-changing specs have never run against a
  # chain in any pipeline. This job is their first verdict. If one is red it
  # is red for a reason — fix the spec or the app. Do NOT re-add a skip.
  # ─────────────────────────────────────────────────────────────────────
  e2e-anvil:
    name: E2E Tests (Anvil fork — money paths)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --ignore-scripts

      # anvil ships with Foundry; nothing else here needs forge.
      - name: Install Foundry (anvil)
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          # PINNED 2026-08-27 (was `stable`, which FLOATS) — see the build job in
          # contracts-ci.yml for the incident. Bump ALL 7 sites together, never one.
          version: v1.7.1

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: frontend/dist

      # chromium only. These specs assert transaction flow, not layout — the
      # mobile-chrome projection of the same DOM is already covered by the
      # mock-mode e2e job above, and a fork run costs real wall-clock.
      #
      # E2E_REQUIRE_ANVIL makes a runner without Foundry a hard failure. The
      # harness otherwise falls back to mock-mode, which would quietly restore
      # exactly the all-skipped run this job exists to replace.
      - name: Money-path E2E against an Anvil mainnet fork
        env:
          E2E_REQUIRE_ANVIL: "1"
          ANVIL_FORK_URL: https://ethereum-rpc.publicnode.com
          PLAYWRIGHT_JSON_OUTPUT_NAME: anvil-report.json
        run: |
          npm run e2e -- --project=chromium --reporter=list,json \
            e2e/swap.spec.ts \
            e2e/stake.spec.ts \
            e2e/liquidity.spec.ts \
            e2e/lending.spec.ts \
            e2e/claim-rewards.spec.ts

      # THE GUARD THAT MAKES THIS A GATE.
      #
      # Playwright exits 0 on a run where every test SKIPPED. If ANVIL_RPC_URL
      # failed to reach the specs — harness change, env rename, anything — the
      # five state-changing tests would skip themselves and this job would go
      # green having proved nothing, which is the precise failure mode that hid
      # them for months. So the skip count is asserted separately from the exit
      # code, and any skip at all fails.
      - name: Assert the money paths actually executed
        run: |
          set -euo pipefail
          test -f anvil-report.json || { echo "::error::no anvil-report.json — the run produced no report"; exit 1; }
          # Playwright's stats bucket tests by OUTCOME: `expected` = passed
          # clean, `flaky` = failed then passed on retry, `unexpected` =
          # failed, `skipped` = never ran. A flaky-but-passing test is NOT in
          # `expected`, so the ran-count must sum expected+flaky or a single
          # fork-RPC flake reads as "selection shrank" and reds trunk for a
          # test that ran and passed (it did exactly that on 2026-08-27:
          # 19/0/0/1 across three commits, misattributed to an unrelated
          # frontend change). Flakiness on a MONEY path still deserves eyes —
          # retries can mask state-dependence — so it warns loudly, it just
          # doesn't impersonate a coverage loss.
          EXPECTED="$(jq '.stats.expected // 0' anvil-report.json)"
          SKIPPED="$(jq '.stats.skipped // 0' anvil-report.json)"
          FLAKY="$(jq '.stats.flaky // 0' anvil-report.json)"
          RAN=$((EXPECTED + FLAKY))
          echo "ran=$RAN (clean=$EXPECTED flaky=$FLAKY) skipped=$SKIPPED"
          if [ "$SKIPPED" -ne 0 ]; then
            echo "::error title=Money-path E2E skipped::${SKIPPED} test(s) skipped in the Anvil job. This job exists because these tests were skipped everywhere; a skip here is a green report over an unexecuted money path. Check that ANVIL_RPC_URL reaches the specs."
            if ! jq -r '.. | objects | select(has("tests")) | select(any(.tests[]?; .status == "skipped")) | .title' anvil-report.json; then
              echo "(could not enumerate the skipped titles from the report)"
            fi
            exit 1
          fi
          if [ "$FLAKY" -ne 0 ]; then
            FLAKY_TITLES="$(jq -r '[.. | objects | select(has("tests")) | select(any(.tests[]?; .status == "flaky")) | .title] | join("; ")' anvil-report.json || echo "unknown")"
            echo "::warning title=Money-path E2E flaky::${FLAKY} test(s) passed only on retry: ${FLAKY_TITLES}. Passing, but a flaky money path deserves a look."
          fi
          if [ "$RAN" -lt 20 ]; then
            echo "::error title=Money-path E2E selection shrank::only ${RAN} tests ran; expected the full 20 across the five money-path specs. A spec file that stops matching is a silent coverage loss."
            exit 1
          fi

      - name: Upload Anvil E2E Report
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-anvil
          path: |
            frontend/playwright-report
            frontend/anvil-report.json
          retention-days: 7
