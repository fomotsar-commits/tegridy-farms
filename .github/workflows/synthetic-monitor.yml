name: Synthetic Monitor

# Prod health watch: the deploy pipeline has failed silently twice (Vercel
# function-cap rejections; an expired-CLI-auth deploy that never aliased).
# This catches "prod is down/stale/broken" within 30 minutes instead of at
# the next product review. On failure it opens (or comments on) a single
# deduplicated issue labeled `prod-incident`.
#
# 2026-09-09 — these probes cover the Vercel functions and both apex domains,
# and they DID catch the 4 Sep outage: this workflow went red at 20:55 and
# opened #385. What they do not reach is the venue's own plumbing. The Alchemy
# probe exercises the NFT floor-price endpoint, not the JSON-RPC path the app
# reads chain state through; /api/solrpc is not probed; and the Railway indexer
# has never been probed by anything, which is why the second half of the 4 Sep
# incident (nginx caching a stale upstream IP) went unseen. Step 6 closes those
# gaps by calling venueHealth.mjs, which validates the BODY — a block number, a
# slot, rows — because those surfaces fail by answering 200 with a JSON-RPC
# `error` object, which any grep-for-a-string probe would call healthy.
# Its checks live in a script, not in this file, so they can be self-tested —
# see the step above the probe.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  issues: write
  contents: read

concurrency:
  group: synthetic-monitor
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    # 8, not 5: step 6 adds four requests with a 20s per-request ceiling, and
    # the token files, asked together, at most two more. A total upstream stall
    # costs ~120s on top of checkout and setup-node.
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # PROVE THE CHECKS CAN FAIL before trusting them to say the venue is fine.
      # Every case here feeds a check a recorded broken response and asserts it
      # reports DOWN — including the exact 4 Sep shape, a 200 whose body carries
      # a JSON-RPC error. A check that cannot fail is a check that reports
      # healthy forever, which is worse than no check at all.
      #
      # This step FAILS THE JOB and opens no incident, on purpose: a broken
      # probe is an engineering bug, not a production outage, and filing it as
      # `prod-incident` would send the operator to look at a healthy venue.
      # Because `if:` on the later steps implies success(), a red self-test
      # stops the run here rather than reporting a green venue it never checked.
      - name: Self-test the venue checks
        shell: bash
        run: node scripts/monitoring/venueHealth.mjs --self-test

      - name: Probe production
        id: probe
        shell: bash
        env:
          # Optional. The script already defaults to the live venue and the
          # current indexer host; these exist only so a host move is a repo-var
          # edit rather than a code change. Unset resolves to "" — falsy, so the
          # default still wins.
          VENUE_SITE_URL: ${{ vars.VENUE_SITE_URL }}
          VENUE_INDEXER_URL: ${{ vars.VENUE_INDEXER_URL }}
        run: |
          set -u
          # THE CANONICAL HOST, not the deploy alias. Until 2026-09-20 this probed
          # https://tegridyfarms.vercel.app, which served the whole venue under a
          # second name — the leak answer thirteen ruled on. That host now
          # redirects (vercel.json), so probing it for 200 would fail by design;
          # it moves into ALIASES below and is checked for a permanent redirect
          # instead. The API probes follow the app to the canonical origin.
          BASE="https://memetics.finance"
          FAILS=""

          probe() { # name url grep_pattern
            local name="$1" url="$2" pattern="$3"
            local body code
            body="$(curl -sS --max-time 20 -w '\n%{http_code}' "$url" 2>&1)" || { FAILS="$FAILS\n- $name: curl failed"; return; }
            code="${body##*$'\n'}"
            body="${body%$'\n'*}"
            if [ "$code" != "200" ]; then FAILS="$FAILS\n- $name: HTTP $code"; return; fi
            if [ -n "$pattern" ] && ! grep -q "$pattern" <<<"$body"; then
              FAILS="$FAILS\n- $name: 200 but expected content missing ($pattern)"
            fi
          }

          # 1. App shell serves and references hashed assets (SPA alive)
          probe "app shell" "$BASE/" "/assets/"
          # 2. Alchemy proxy + rate limiter path (floor price is the hottest read)
          probe "alchemy proxy" "$BASE/api/alchemy?endpoint=getFloorPrice&contractAddress=0xd774557b647330C91Bf44cfEAB205095f7E6c367" "floorPrice"
          # 3. Native orderbook (Supabase-backed; degraded:true still proves the function runs)
          probe "orderbook" "$BASE/api/orderbook?action=query&contract=0xd774557b647330C91Bf44cfEAB205095f7E6c367&limit=1" "orders"
          # 4. Trades endpoint (graceful pre-migration shape counts as healthy)
          probe "trades" "$BASE/api/orderbook?action=trade-query&wallet=0x0000000000000000000000000000000000000001" "trades"

          # 5. THE REAL PRODUCTION DOMAINS.
          # Everything above probes the vercel alias, which is NOT where users go.
          # A domain can break independently of the deployment behind it — expired
          # TLS, a DNS edit, a lapsed registration — and the alias would stay green
          # through all of it. memetics.finance was registered 2026-08-02 for one
          # year, so its expiry lands inside the plan window.
          #
          # ONE CANONICAL HOST (frontend/src/lib/constants.ts SITE_URL). Only it may
          # answer 200; memetic.fun is a redirect alias and this loop used to demand
          # 200 from it too — the moment vercel.json started 301ing it, that probe
          # would have paged every 15 minutes about a host behaving exactly as
          # designed. The alias is still monitored, just against the right contract:
          # it must REDIRECT, and it must land on the canonical host. That is the
          # stronger check anyway — a 200 on the alias is now itself the outage,
          # because it means the redirect silently stopped shipping.
          CANONICAL="memetics.finance"
          # tegridyfarms.vercel.app joined 2026-09-20 (answer thirteen, ruling 2):
          # it was serving the entire venue under a second name, which the
          # canonical-host law (#478) forbids. It is the project's own .vercel.app
          # domain, so vercel.json's redirect governs it.
          #
          # tegridyfarms-three.vercel.app is deliberately NOT here, and the reason
          # matters: it is a DIFFERENT Vercel project serving a stale build (its
          # bundle hash differs from production's and it has no /llms.txt — that
          # path SPA-falls-back to 200 text/html). This repo's vercel.json never
          # executes for it, so vercel.json:119 has never fired and no edit here
          # can make it redirect. Listing it would page every 30 minutes about
          # something no commit can fix. It needs an operator action in the Vercel
          # dashboard; until then llms.txt correctly omits it, because that rule's
          # destination is not the canonical origin.
          # memetic.fun and www.memetic.fun LEFT THIS LIST on 2026-09-20. They are
          # not aliases of this venue any more: they serve the Memetics Lab from a
          # DIFFERENT Vercel project, so this repo's vercel.json never executes for
          # them and no edit here could make them redirect. Demanding one would page
          # every 15 minutes about a host behaving exactly as designed, which is the
          # same shape of mistake #478 made by demanding a literal 301.
          #
          # The law they used to enforce is enforced below instead, inverted. #478
          # was never "the alias must redirect" - that was one mechanism for it. The
          # law is that THIS VENUE ANSWERS UNDER ONE NAME, and a host we do not serve
          # satisfies it as completely as a redirect did.
          ALIASES="www.memetics.finance tegridyfarms.vercel.app"

          probe "$CANONICAL app shell" "https://$CANONICAL/" "/assets/"

          # Each alias must answer with a PERMANENT redirect AND point at the
          # canonical host. Checking only for "a 3xx" would pass a redirect loop or
          # a redirect to anywhere at all — which is how a misrouted domain reads
          # as healthy.
          #
          # 301 OR 308, because vercel.json expresses these as `"permanent": true`
          # and Vercel emits 308 for that (307 for `false`) — a `redirects` entry
          # never produces a 301. This loop demanded a literal 301 from #478
          # (2026-09-12) and then failed EVERY scheduled run from 2026-09-13T06:20Z
          # onward: it asserted a status code the config it shipped alongside could
          # not emit. Production was correct the whole time — 308 is the
          # method-preserving twin of 301 and search engines consolidate on it
          # identically — so the literal was the defect, not the redirect. Pin the
          # invariant (permanent, and onto the canonical host), not one vendor's
          # choice of code. A temporary still fails: a 302/303/307 here means
          # someone flipped `permanent` to false and the SEO signal quietly stopped
          # consolidating.
          for host in $ALIASES; do
            read -r code location <<<"$(curl -sS -o /dev/null --max-time 20 \
              -w '%{http_code} %{redirect_url}' "https://$host/" 2>/dev/null)" \
              || { FAILS="$FAILS\n- $host: curl failed"; continue; }
            case "$code" in
              301|308) : ;;
              *)
                FAILS="$FAILS\n- $host: expected a permanent redirect (301 or 308) to https://$CANONICAL/, got $code"
                continue
                ;;
            esac
            case "$location" in
              "https://$CANONICAL"|"https://$CANONICAL"/*) : ;;
              *) FAILS="$FAILS\n- $host: ${code}s to '$location', not the canonical host https://$CANONICAL/" ;;
            esac
          done

          # THE INVERSE OF THE ALIAS LOOP, for a host that is no longer ours.
          #
          # memetic.fun serves the Memetics Lab. The failure worth watching is not
          # "it stopped redirecting" but "it started serving US again", which is what
          # a re-attach of the domain to this Vercel project looks like. That is the
          # canonical-host law breaking in the only direction still open to it, and it
          # is exactly what went unnoticed with tegridyfarms.vercel.app until it cost
          # a ruling to undo.
          #
          # NO -L. Following the redirect would land on the canonical host, find its
          # app shell, and report a perfectly healthy redirect as a violation.
          #
          # It asserts an ABSENCE, so it is written not to pass vacuously: a non-200
          # is reported inconclusive rather than as health. This venue does not own
          # the Lab uptime and must never page on it. While the domain is still
          # mid-move and answering 308, that is the branch this takes.
          FOREIGN="memetic.fun"
          foreign_code="$(curl -sS -o /dev/null --max-time 20 -w '%{http_code}' "https://$FOREIGN/" 2>/dev/null || echo 000)"
          if [ "$foreign_code" = "200" ]; then
            if curl -sS --max-time 20 "https://$FOREIGN/" 2>/dev/null | grep -q '/assets/'; then
              FAILS="$FAILS\n- $FOREIGN: THIS VENUE is answering on it (served our app shell). The domain is back on this Vercel project; the canonical-host law forbids a second front door."
            fi
          else
            printf 'note: %s answered %s, so the "not us" check is inconclusive. Not ours to page on.\n' "$FOREIGN" "$foreign_code"
          fi

          # 6. THE VENUE ITSELF — body validation, not status-line validation.
          #
          # The surfaces below are not reachable by the probes above, and they
          # fail in a shape a grep-for-a-string probe would pass anyway: on
          # 2026-09-04 an Alchemy key rotation had the JSON-RPC path answering
          # HTTP 200 with a JSON-RPC `error` object, and the Railway indexer —
          # never probed by anything until now — went dark behind an nginx that
          # had cached its old upstream IP, while the site around it stayed
          # green. venueHealth.mjs reads the body: a real block number, a real
          # slot, indexer readiness, and rows actually coming back.
          #
          # It also asks for every token name-and-picture file under /mint/ (the
          # list in frontend/scripts/lib/mint-identity.mjs). A missing one answers
          # 200 with the app page, so the body must be that file's own JSON and
          # its picture a real PNG.
          #
          # --fails-only prints ONE LINE PER FAILURE and nothing when healthy,
          # so its output drops straight into $FAILS and both sets of findings
          # read as a single list in a single incident. It exits 0 either way,
          # including when it crashes (a crash prints itself as a failed check),
          # so `bash -e` cannot turn a venue outage into a skipped step.
          VENUE="$(node scripts/monitoring/venueHealth.mjs --fails-only 2>&1)" \
            || VENUE="- venue probe: exited non-zero, which it is written never to do"
          if [ -n "$VENUE" ]; then
            FAILS="$FAILS"$'\n'"$VENUE"
          fi

          if [ -n "$FAILS" ]; then
            REPORT="$(printf 'Synthetic monitor failures at %s UTC:%b' "$(date -u '+%Y-%m-%d %H:%M')" "$FAILS")"

            # To the STEP LOG as well as to $GITHUB_OUTPUT. The report used to go
            # only to $GITHUB_OUTPUT, which `gh run view --log-failed` does not
            # render — so this step's log showed the script source and a bare
            # `exit 1`, and the one fact an operator needs (WHICH host, and what it
            # actually returned) was recoverable only by reproducing the probe by
            # hand. An alarm that cannot say what tripped it gets ignored, which is
            # exactly what happened for two days.
            printf '%s\n' "$REPORT"

            printf 'failed=true\n' >> "$GITHUB_OUTPUT"
            {
              printf 'report<<EOF\n'
              printf '%s\n' "$REPORT"
              printf 'EOF\n'
            } >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Open or update incident issue
        if: failure() && steps.probe.outputs.failed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ steps.probe.outputs.report }}
        shell: bash
        run: |
          set -u
          EXISTING="$(gh issue list --repo "$GITHUB_REPOSITORY" --label prod-incident --state open --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$REPORT"
          else
            gh label create prod-incident --repo "$GITHUB_REPOSITORY" --color B60205 --description "Synthetic monitor detected a production failure" 2>/dev/null || true
            printf '%s\n\nRunbook: check Vercel deployments (npx vercel ls from the repo root), the Upstash rate limiter, and Supabase status. Close this issue once probes pass again.\n' "$REPORT" \
              | gh issue create --repo "$GITHUB_REPOSITORY" \
                  --title "Prod incident: synthetic monitor failing" \
                  --label prod-incident \
                  --body-file -
          fi

      # RECOVERY — the half this workflow never had.
      #
      # Until 2026-09-04 it only ran its issue step on failure, so an incident it
      # opened stayed open forever. #385 sat OPEN after prod had already
      # recovered, which means an open `prod-incident` issue could not tell
      # "still broken" from "fixed, nobody closed it" — the same
      # two-states-rendering-as-one defect this repo keeps closing everywhere
      # else. The issue body even instructed a human to "close this issue once
      # probes pass again", which is a process asking a person to be the
      # feedback loop.
      #
      # Deliberately BEST-EFFORT. Recovery bookkeeping must never turn a healthy
      # production into a red monitor: if an API call fails we log it and leave
      # the run green, because the probes already proved prod is up. Every
      # command is guarded — GitHub runs `run:` under `bash -e`, and an
      # unguarded non-zero here would fail the step for a reason that has
      # nothing to do with production health.
      - name: Close the incident once probes pass again
        if: steps.probe.outputs.failed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -u
          OPEN="$(gh issue list --repo "$GITHUB_REPOSITORY" --label prod-incident --state open --json number --jq '.[].number' 2>/dev/null || true)"
          if [ -z "$OPEN" ]; then
            echo "Probes green; no open prod-incident issue. Nothing to close."
            exit 0
          fi
          for N in $OPEN; do
            echo "Probes green — closing prod-incident #$N"
            gh issue comment "$N" --repo "$GITHUB_REPOSITORY" \
              --body "Probes passed again — closing automatically.

          Verified by synthetic monitor run: $RUN_URL

          Every probe in this workflow succeeded: the app shell on the Vercel alias and on both production domains, the Alchemy proxy, the native orderbook, the trades endpoint, and the venue checks — the EVM and Solana RPC proxies returning a real block number and slot, and the Railway indexer both ready and serving rows, and each token file under /mint/ answering with its own JSON and a real PNG." 2>/dev/null \
              || echo "WARNING: could not comment on #$N — prod is healthy; this is bookkeeping only"
            gh issue close "$N" --repo "$GITHUB_REPOSITORY" 2>/dev/null \
              || echo "WARNING: could not close #$N — prod is healthy; this is bookkeeping only"
          done

      # Dead-man switch for GitHub's own schedules, which stopped for 5+ days in 2026-09 and
      # told nobody. healthchecks.io emails when these pings stop (docs/OPS_SCHEDULER.md,
      # section 2). Every run pings the base URL, pass or fail: a /fail would hold the check
      # DOWN through a probe outage and mute it. The prod-incident issue reports the probe.
      # curl reads the URL on stdin, never argv. No secret, or a ping that did not land, is
      # a warning, never a red run: the missing ping is itself the alarm.
      - name: Heartbeat to healthchecks.io
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        env:
          HC_PING_URL: ${{ secrets.HC_PING_URL_GITHUB_CRONS }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
          REPORT: ${{ steps.probe.outputs.report }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -u
          if [ -z "${HC_PING_URL:-}" ]; then
            echo "::warning title=No heartbeat::HC_PING_URL_GITHUB_CRONS is not set, so nothing outside GitHub notices if its schedules stop. See docs/OPS_SCHEDULER.md section 2."
            exit 0
          fi
          case "$HC_PING_URL" in
            *[[:space:]\"\\]*) usable=no ;;
            https://?*) usable=yes ;;
            *) usable=no ;;
          esac
          if [ "$usable" != yes ]; then
            echo "::warning title=No heartbeat::HC_PING_URL_GITHUB_CRONS is set but is not a plain https URL, so no ping was sent."
            exit 0
          fi
          target="${HC_PING_URL%/}"
          body="$RUNNER_TEMP/heartbeat-body.txt"
          printf 'synthetic-monitor: %s\n%s\n\n%s\n' "$PROBE_OUTCOME" "$RUN_URL" "${REPORT:-}" > "$body"
          if printf 'url = "%s"\n' "$target" | curl --config - -fsS -o /dev/null --max-time 10 --retry 3 --retry-all-errors --retry-delay 2 --data-binary "@$body"; then
            echo "Heartbeat sent (probe: $PROBE_OUTCOME)."
          else
            echo "::warning title=Heartbeat not delivered::curl could not reach healthchecks.io. The check raises the missed ping itself."
          fi
