name: Slither

on:
  push:
    branches: [main, mvp-launch]
    paths:
      - "contracts/**"
      - ".github/workflows/slither.yml"
  pull_request:
    branches: [main, mvp-launch]
    paths:
      - "contracts/**"
      - ".github/workflows/slither.yml"

# Least-privilege default — the analyze job augments below with
# security-events: write to upload the SARIF.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Static analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        # AUDIT R056: SHA-pinned (was @v4 floating).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@de808b1eea699e761c404bda44ba8f21aba30b2c # v1.3.1
        with:
          version: stable

      - name: Run Slither
        uses: crytic/slither-action@b52cc1cbfee9ca3e8722dd5224299d16c9a6b80f # v0.4.2
        id: slither
        with:
          target: contracts/
          solc-version: 0.8.26
          # AUDIT R056 LOW: fail-on: medium (was none). PRs that introduce
          # medium/high static-analysis findings now block merge instead of
          # silently flowing into main. False positives can be muted with
          # inline `// slither-disable-next-line <detector>`.
          fail-on: medium
          sarif: slither.sarif

      - name: Upload SARIF to GitHub Security tab
        if: always() && steps.slither.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: ${{ steps.slither.outputs.sarif }}

      # DEBUG (temporary): upload slither's raw JSON report so we can diff
      # against local runs when the Medium+ count diverges. Drop this step
      # once CI is reliably green on `fail-on: medium`.
      - name: Upload Slither raw report (debug)
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: slither-report
          path: |
            slither-report.json
            slither-report.sarif
            slither.sarif
          if-no-files-found: warn
