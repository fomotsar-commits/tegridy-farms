name: Slither

on:
  push:
    branches: [main, mvp-launch]
    paths:
      - "contracts/**"
      - ".github/workflows/slither.yml"
  # NO `paths:` HERE, deliberately — see the `scope` job. A workflow-level
  # path filter on a pull_request is what forced the `-not-applicable.yml`
  # shim, and the shim is what let a failing gate be reported as a pass.
  pull_request:
    branches: [main, mvp-launch]

# Least-privilege default — the analyze job augments below with
# security-events: write to upload the SARIF.
permissions:
  contents: read

concurrency:
  # PRs cancel their own superseded runs; TRUNK RUNS MUST FINISH. On a push to
  # main/mvp-launch every merge shares one group, so cancel-in-progress:true made
  # each merge kill the previous run -- and trunk is the branch that deploys.
  # Measured 2026-09-04: six consecutive trunk commits with 5-9 cancelled checks
  # each and as few as 0 successes. Cancelled is not red, so it reads as fine.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── which jobs are in scope for this diff ──────────────────────────────────
  #
  # This job replaces `slither-not-applicable.yml`. That shim published a SECOND
  # check run under this workflow's name whenever a PR touched both Solidity and
  # anything else, and GitHub does not resolve a duplicated name the way the
  # shim's comment assumed. Measured on PR #205, where two of these pairs
  # doubled at once: `Slither / Static analysis` had a FAILING 4-minute analysis
  # and a passing 2-second shim, and only the pass appeared in the PR's check
  # list; `all-tests-pass` was doubled too and agreed by luck.
  #
  # So the filter moved here. The workflow now triggers on every PR — exactly one
  # check run under this name ever exists — and this job decides whether the real
  # work runs. A job skipped by `if:` reports success to branch protection, which
  # is what the shim was for.
  scope:
    name: scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.q.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Does this diff touch Solidity?
        id: q
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          # EVERY uncertain path below answers `true`. A wrong `true` costs CI
          # minutes; a wrong `false` skips the gate AND reports success for
          # having done so, which is the failure this job exists to end.
          say() { echo "run=$1" >> "$GITHUB_OUTPUT"; exit 0; }

          # A `push` reached this workflow through its own `paths:` filter, so it
          # is already known to be in scope.
          [ -n "${PR:-}" ] || { echo "not a pull_request — in scope by trigger"; say true; }

          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')
          if [ -z "$files" ]; then
            echo "::warning::could not list this PR's changed files — running the real job"
            say true
          fi
          # `pulls/{n}/files` truncates at 3000. A truncated list can only make a
          # skip look justified, so refuse to narrow on one.
          if [ "$(printf '%s\n' "$files" | wc -l)" -ge 3000 ]; then
            echo "::warning::changed-file list is at the API cap — running the real job"
            say true
          fi

          verdict=$(printf '%s\n' "$files" | node .github/scripts/diff-scope.mjs \
            'contracts/**' \
            '.github/workflows/slither.yml')
          case "$verdict" in
            true|false) say "$verdict" ;;
            *) echo "::warning::diff-scope returned '$verdict' — running the real job"; say true ;;
          esac

  analyze:
    name: Static analysis
    needs: scope
    if: >-
      !cancelled() &&
      (needs.scope.result != 'success' || needs.scope.outputs.run == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        # AUDIT R056: SHA-pinned (was @v4 floating).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          # PINNED 2026-08-27 (was `stable`, which FLOATS) — see the build job in
          # contracts-ci.yml for the incident. Bump ALL 7 sites together, never one.
          version: v1.7.1

      - name: Run Slither
        uses: crytic/slither-action@b52cc1cbfee9ca3e8722dd5224299d16c9a6b80f # v0.4.2
        id: slither
        with:
          target: contracts/
          solc-version: 0.8.26
          # ── THE CONFIG WAS NEVER LOADED ────────────────────────────────
          #
          # The action's `slither-config` input is documented as defaulting to
          # "./slither.config.json if present". It does not: entrypoint.sh
          # reads the input raw and only passes `--config-file` when it is
          # non-empty. With nothing passed, slither falls back to its own
          # auto-load, which searches the CURRENT WORKING DIRECTORY — the repo
          # ROOT, not `target:`. So every run has been picking up the stale
          # root slither.config.json (last touched 2026-05-03) while
          # contracts/slither.config.json — the curated one written for this
          # branch's 15-contract scope, with 12 documented false-positive
          # exclusions and their rationale — was read by nothing.
          #
          # Two of those exclusions are exactly the chronic noise: `timestamp`
          # (every flagged comparison is a period-scale time gate, verified FP
          # across six contracts) and `dead-code` (helpers kept for ABI
          # compatibility). Neither is excluded by the root config.
          #
          # ⚠ Loading the curated config also required fixing it: it carried
          # its promoted fund-loss detectors under `detectors_to_run`, which in
          # slither means "run ONLY these" and returns before the exclusion
          # logic — so loading it as-written would have QUIETLY GUTTED the
          # detector set under a fail-on gate. See the note in that file.
          slither-config: contracts/slither.config.json
          # ── AND THE THRESHOLD STAYS ────────────────────────────────────
          #
          # fail-on: medium is NOT being lowered to buy green. The chronic red
          # was a config that never loaded, not a threshold set too tight; the
          # honest fix is to load the config and see what is genuinely left. A
          # noisy gate is bad, but a gate lowered until it stops objecting is
          # worse — it still reports, and it now reports nothing.
          #
          # If Medium findings survive the curated exclusions they are real
          # and get triaged: fix, or mute the specific line with
          # `// slither-disable-next-line <detector>` and a reason. Do not
          # move this to `high` or `none`.
          fail-on: medium
          sarif: slither.sarif

      - name: Upload SARIF to GitHub Security tab
        if: always() && steps.slither.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: ${{ steps.slither.outputs.sarif }}

      # DEBUG (temporary): upload slither's raw JSON report so we can diff
      # against local runs when the Medium+ count diverges. Drop this step
      # once CI is reliably green on `fail-on: medium`.
      - name: Upload Slither raw report (debug)
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: slither-report
          path: |
            slither-report.json
            slither-report.sarif
            slither.sarif
          if-no-files-found: warn
