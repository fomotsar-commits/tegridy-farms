name: solana-ci

# Tegridy CP-AMM (solana/tegridy-amm): a fork of raydium-cp-swap that differs from
# it by four authority constants, the program's own name and contact text, one
# added instruction (create_lp_metadata, which names a pool's lp token) and one
# refusal (public initialize on fee tier 0), plus tegridy-launch, our own bonding
# curve that graduates into it.
# Gates:
#   1. diff-guard  — proves the fork's delta from pinned audited upstream is
#      EXACTLY the pinned hash. Not a file allowlist: the previous version accepted
#      ANY change inside lib.rs, which holds upstream's whole #[program] dispatcher.
#      This is the security invariant; it needs no Solana toolchain, and since
#      2026-10-14 no clone: no job here fetches anything from Raydium.
#      SCOPED TO cp-swap ONLY — tegridy-launch is our own code with no upstream
#      to diff against, so it is deliberately NOT covered by this job.
#   2. build       — compiles the SBF program (validates our diff compiles).
#   3. launch-curve — host-tests tegridy-launch's dependency-free curve math,
#      SBF-builds the program, and runs its layout and error-code pins under both
#      feature configs. This is the ONLY compile gate for that program:
#      it cannot be built on the Windows dev box (platform-tools install needs
#      the symlink privilege, os error 1314; cargo build scripts are blocked by
#      Application Control, os error 4551 — both hit the existing cp-swap too).
#   4. launch-constraints — deploys tegridy-launch to a local validator and proves
#      its SECURITY CONSTRAINTS actually REJECT. `cargo check` only shows they
#      compile and sit in the right Accounts context. Every check here came from
#      the 2026-07-29 adversarial review (1 critical + 3 medium), and each has a
#      positive control so a vacuous pass is impossible.
#      The Windows dev box can run NO Solana runtime at all — build-sbf and
#      solana-test-validator both hit os error 1314, and solana-program-test and
#      litesvm both fail building openssl-sys — so this job is the only place
#      these constraints are ever executed.
#   5. migration-rehearsal — the ONLY job that EXECUTES migrate_to_amm. Deploys
#      BOTH programs to a validator, creates an AmmConfig, then drives the full
#      lifecycle: create -> buy to target -> migrate -> assert the pool exists,
#      the curve is closed and records it, and LP SUPPLY IS ZERO (the burn).
#      It patches cp-swap's hardcoded admin + fee-receiver in a throwaway
#      checkout because we hold neither key; diff-guard runs on its own clean
#      checkout and independently proves the COMMITTED fork still carries exactly
#      the pinned delta.
#   6. clmm-guards — tegridy-clmm (raydium-clmm under the venue's keys, not deployed) is
#      upstream plus exactly its pinned identity delta, and no key in it, cp-swap, tegridy-launch
#      or bayla-ladder is anyone's but the venue's (solana/guards/). A pin changes in a pull
#      request of its own. Each guard first refuses known-bad copies.
#   7. clmm-build — builds tegridy-clmm on upstream's own Solana pin, proves a build
#      without the placeholder feature, or with devnet or localnet, is refused, runs
#      upstream's unit tests, and prices the deploy at the rent rate read from mainnet.
on:
  push:
    paths: ["solana/**", ".github/workflows/solana-ci.yml", "frontend/src/lib/launcher/solana/curve/curveVectors.fixture.ts"]
  # NO `paths:` HERE, deliberately — see the `scope` job. A workflow-level
  # path filter on a pull_request is what forced the `-not-applicable.yml`
  # shim, and the shim is what let a failing gate be reported as a pass.
  pull_request:

permissions:
  contents: read

env:
  # The upstream commits both pool programs are pinned to live in solana/guards/provenance.mjs.
  SOLANA_VERSION: v2.3.0
  # Must match Anchor.toml's [toolchain] anchor_version and the anchor-lang /
  # anchor-spl versions both programs pin — the IDL the TS tests load is
  # generated by this CLI.
  ANCHOR_VERSION: 0.32.1

jobs:
  # ── which jobs are in scope for this diff ──────────────────────────────────
  #
  # This job replaces `solana-ci-not-applicable.yml`. That shim published a SECOND
  # check run under this workflow's name whenever a PR touched both the Solana programs and
  # anything else, and GitHub does not resolve a duplicated name the way the
  # shim's comment assumed. Measured on PR #205, where two of these pairs
  # doubled at once: `Slither / Static analysis` had a FAILING 4-minute analysis
  # and a passing 2-second shim, and only the pass appeared in the PR's check
  # list; `all-tests-pass` was doubled too and agreed by luck.
  #
  # So the filter moved here. The workflow now triggers on every PR — exactly one
  # check run under this name ever exists — and this job decides whether the real
  # work runs. A job skipped by `if:` reports success to branch protection, which
  # is what the shim was for.
  scope:
    name: scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.q.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Does this diff touch the Solana programs?
        id: q
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          # EVERY uncertain path below answers `true`. A wrong `true` costs CI
          # minutes; a wrong `false` skips the gate AND reports success for
          # having done so, which is the failure this job exists to end.
          say() { echo "run=$1" >> "$GITHUB_OUTPUT"; exit 0; }

          # A `push` reached this workflow through its own `paths:` filter, so it
          # is already known to be in scope.
          [ -n "${PR:-}" ] || { echo "not a pull_request — in scope by trigger"; say true; }

          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" \
            --jq '.[] | .filename, (.previous_filename // empty)') || {
            echo "::warning::gh could not list every changed file, running the real job"
            say true
          }
          if [ -z "$files" ]; then
            echo "::warning::could not list this PR's changed files — running the real job"
            say true
          fi
          # `pulls/{n}/files` truncates at 3000. A truncated list can only make a
          # skip look justified, so refuse to narrow on one.
          if [ "$(printf '%s\n' "$files" | wc -l)" -ge 3000 ]; then
            echo "::warning::changed-file list is at the API cap — running the real job"
            say true
          fi

          verdict=$(printf '%s\n' "$files" | node .github/scripts/diff-scope.mjs \
            'solana/**' \
            '.github/workflows/solana-ci.yml' \
            'frontend/src/lib/launcher/solana/curve/curveVectors.fixture.ts')
          case "$verdict" in
            true|false) say "$verdict" ;;
            *) echo "::warning::diff-scope returned '$verdict' — running the real job"; say true ;;
          esac

  diff-guard:
    needs: scope
    if: >-
      !cancelled() &&
      (needs.scope.result != 'success' || needs.scope.outputs.run == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No clone: solana/guards/upstream/ holds upstream's file hashes at the pin and the
      # reviewed patch, so this job needs nothing from Raydium. It refuses any file added to,
      # missing from or changed in the cp-swap package beyond that patch (a build.rs too), and
      # the patch must hash to the pin in solana/guards/provenance.mjs. Re-pin history up to
      # 2026-10-06: this file's git log. What the patch holds: solana/tegridy-amm/TEGRIDY_FORK.md.
      - name: Assert the delta from audited upstream is EXACTLY the pinned one
        run: node solana/guards/provenance.mjs cp-swap

  # The Raydium CLMM vendor guard lived here until 2026-08-23.
  #
  # It asserted that seven files existed under tegridy-launch/src/vendor/ and matched
  # a pinned upstream commit. That directory is gone: it priced the segmented
  # (Meteora-shaped) curve, and segmented mode was removed wholesale before the
  # redeploy — see the merge of claude/solana-segmented-removal. A guard whose subject
  # has been deleted cannot pass, and leaving it here would have failed
  # `all-checks-pass` on every run through its `needs:` edge rather than at the job,
  # which reads as an infrastructure fault rather than as the deliberate deletion it is.
  #
  # The cp-swap diff-guard ABOVE is untouched and still the real one — cp-swap is still
  # vendored and still the graduation venue. Concentrated liquidity came back on 2026-10-14
  # as a whole program, tegridy-clmm, with its own guards in the two jobs below.
  clmm-guards:
    needs: scope
    if: >-
      !cancelled() &&
      (needs.scope.result != 'success' || needs.scope.outputs.run == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit and its base, so the pull request's own changes can be listed.
          fetch-depth: 2
      # No clone here either: hashes, the reviewed patches and the deny-list are in
      # solana/guards/upstream/, written once by `provenance.mjs --regenerate`.
      - name: tegridy-clmm and its vendored uint are upstream plus exactly the pinned identity delta
        run: node solana/guards/provenance.mjs tegridy-clmm uint
      - name: No outside key in any of the four programs, and no build flag in the build workflows
        run: |
          node solana/guards/key-guard.mjs --allow solana/guards/allowed-keys.json \
            --deny solana/guards/upstream/deny-keys.txt \
            --ours solana/tegridy-amm/programs/cp-swap --ours solana/tegridy-clmm \
            --ours solana/tegridy-amm/programs/tegridy-launch --ours solana/tegridy-amm/programs/bayla-ladder \
            --clmm-lib solana/tegridy-clmm/programs/amm/src/lib.rs \
            --workflow .github/workflows/solana-ci.yml --workflow .github/workflows/solana-deploy-artifact.yml
      # A re-pin is read alone: a pull request that changes a file in solana/guards/ may change
      # nothing else but the programs it pins. The changed guard lines are printed for the reader.
      - name: A change to a pin, the reviewed patch or the allow-list is its own pull request
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git diff --name-status --no-renames HEAD^1 HEAD > /tmp/pr-files.txt
          git diff --diff-filter=MD HEAD^1 HEAD -- solana/guards
          node solana/guards/provenance.mjs --pr-files /tmp/pr-files.txt
      # A guard that cannot fail proves nothing, so each one meets copies it must refuse.
      # Every disguise an outside check tried is in frontend/src/test/solanaGuardTampers.test.ts.
      - name: Each guard refuses a known-bad copy
        run: |
          set -uo pipefail
          refused() { if "$@" > /tmp/refused.log 2>&1; then echo "::error::this passed and must not: $*"; cat /tmp/refused.log; exit 1; fi; }
          because() { grep -qF "$1" /tmp/refused.log || { echo "::error::refused, but not because: $1"; cat /tmp/refused.log; exit 1; }; }
          KG="node solana/guards/key-guard.mjs --allow solana/guards/allowed-keys.json --deny solana/guards/upstream/deny-keys.txt"
          PV="node solana/guards/provenance.mjs"
          VAULT=GRMtSxgseKdesExU1BQ22abEspTXV55UPcLaHCd18osd
          RAYDIUM_ADMIN=GThUX1Atko4tqhN2NaiTazWSeFWMuiUvfFnyJyUghFMJ
          # Raydium's admin back in the admin's place, and glued to a letter.
          cp -r solana/tegridy-clmm /tmp/clmm-key
          sed -i "0,/$VAULT/s//$RAYDIUM_ADMIN/" /tmp/clmm-key/programs/amm/src/lib.rs
          refused $KG --ours /tmp/clmm-key; because "$RAYDIUM_ADMIN is hard-coded by upstream"
          refused $PV tegridy-clmm --ours /tmp/clmm-key; because "is not the reviewed one"
          cp -r solana/tegridy-clmm /tmp/clmm-glued
          echo "// 0$RAYDIUM_ADMIN" >> /tmp/clmm-glued/programs/amm/src/states/pool.rs
          refused $KG --ours /tmp/clmm-glued; because "$RAYDIUM_ADMIN is hard-coded by upstream"
          # A build script in cp-swap's package, outside src/.
          cp -r solana/tegridy-amm/programs/cp-swap /tmp/cp-build
          echo 'fn main() {}' > /tmp/cp-build/build.rs
          refused $PV cp-swap --ours /tmp/cp-build; because "build.rs is in our copy"
          refused $KG --ours /tmp/cp-build; because "cargo reads this on its own"
          # A crate swapped in the lock.
          cp -r solana/tegridy-clmm /tmp/clmm-lock
          sed -i '0,/^version = "0.11.1"$/s//version = "0.8.0"/' /tmp/clmm-lock/Cargo.lock
          refused $PV tegridy-clmm --ours /tmp/clmm-lock; because "Cargo.lock hashes to"
          # The devnet and localnet gate removed.
          cp -r solana/tegridy-clmm /tmp/clmm-gate
          sed -i '/not(feature = "test-chain-keys")/,+1d' /tmp/clmm-gate/programs/amm/src/lib.rs
          refused $KG --ours solana/tegridy-clmm --clmm-lib /tmp/clmm-gate/programs/amm/src/lib.rs
          because "lacks the compile_error! gate"
          # A release refuses the placeholder program id. Once the owner's id is in, a release passes,
          # and the placeholder put back is refused again.
          if grep -q 'RangePoo1PLACEHo1DERnotDep1oyed111111111111' solana/guards/allowed-keys.json; then
            refused $KG --release --ours solana/tegridy-clmm; because "is the placeholder program id"
          else
            ALL="--ours solana/tegridy-amm/programs/cp-swap --ours solana/tegridy-clmm --ours solana/tegridy-amm/programs/tegridy-launch --ours solana/tegridy-amm/programs/bayla-ladder --clmm-lib solana/tegridy-clmm/programs/amm/src/lib.rs"
            $KG --release $ALL > /tmp/release.log 2>&1 || { echo "::error::a release of the real id is refused"; cat /tmp/release.log; exit 1; }
            # The placeholder put back in the release's place, with its allow-list entry back too:
            # --release itself must refuse it (not merely "on no allow-list").
            cp -r solana/tegridy-clmm /tmp/clmm-ph
            ID=$(grep -A1 '^#\[cfg(not(feature = "devnet"))\]$' /tmp/clmm-ph/programs/amm/src/lib.rs | sed -n 's/^declare_id!("\([1-9A-HJ-NP-Za-km-z]*\)");$/\1/p')
            [ -n "$ID" ] || { echo "::error::lib.rs declares no release program id"; exit 1; }
            sed -i "s/$ID/RangePoo1PLACEHo1DERnotDep1oyed111111111111/g" /tmp/clmm-ph/programs/amm/src/lib.rs
            node -e 'const f=require("fs"),a=JSON.parse(f.readFileSync("solana/guards/allowed-keys.json","utf8"));a.placeholder={RangePoo1PLACEHo1DERnotDep1oyed111111111111:"the placeholder, put back for this check"};f.writeFileSync("/tmp/allow-ph.json",JSON.stringify(a))'
            refused $KG --allow /tmp/allow-ph.json --release --ours /tmp/clmm-ph; because "is the placeholder program id"
          fi
          # Raydium's admin in tegridy-launch, which graduates its pools into cp-swap.
          cp -r solana/tegridy-amm/programs/tegridy-launch /tmp/launch-key
          echo "// $RAYDIUM_ADMIN" >> /tmp/launch-key/src/lib.rs
          refused $KG --ours /tmp/launch-key; because "$RAYDIUM_ADMIN is hard-coded by upstream"
          # A [patch] table in cp-swap's workspace, spelled with a tab, spaces and quotes.
          printf '\n[\tpatch . "crates-io" ]\nuint = { path = "x" }\n' >> solana/tegridy-amm/Cargo.toml
          refused $PV cp-swap; because "solana/tegridy-amm/Cargo.toml hashes to"
          refused $KG --ours solana/tegridy-amm/programs/cp-swap; because "swaps a dependency's source"
          git checkout -- solana/tegridy-amm/Cargo.toml
          echo "every known-bad copy refused"

  clmm-build:
    needs: scope
    if: >-
      !cancelled() &&
      (needs.scope.result != 'success' || needs.scope.outputs.run == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Upstream's own pins (its Anchor.toml): Solana 3.1.10, Anchor 1.0.2 via Cargo.lock.
      CLMM_SOLANA_VERSION: v3.1.10
    defaults:
      run:
        working-directory: solana/tegridy-clmm/programs/amm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: clmm-cargo-${{ hashFiles('solana/tegridy-clmm/Cargo.lock') }}
      - name: Install Solana CLI ${{ env.CLMM_SOLANA_VERSION }}
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${CLMM_SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      # While lib.rs declares the placeholder, a build needs `placeholder-id`. Once the owner's
      # real id is in (program-id-change.mjs), the release is the build with no features at all,
      # and its sha256 below is the one the deploy pack pins.
      - name: Which program id the source declares
        id: idstate
        run: |
          # The id a build with no features compiles: the line after the not(devnet) cfg.
          MAIN=$(grep -A1 '^#\[cfg(not(feature = "devnet"))\]$' src/lib.rs | sed -n 's/^declare_id!("\([1-9A-HJ-NP-Za-km-z]*\)");$/\1/p')
          [ -n "$MAIN" ] || { echo "::error::lib.rs declares no release program id"; exit 1; }
          if [ "$MAIN" = "RangePoo1PLACEHo1DERnotDep1oyed111111111111" ]; then
            echo "features=placeholder-id" >> "$GITHUB_OUTPUT"; echo "placeholder=true" >> "$GITHUB_OUTPUT"
            echo "the placeholder id: building with --features placeholder-id"
          else
            echo "features=" >> "$GITHUB_OUTPUT"; echo "placeholder=false" >> "$GITHUB_OUTPUT"
            echo "a real program id: building the release, with no features"
          fi
      # The same two guards as cp-swap's build: build-sbf can exit 0 having compiled nothing,
      # and a 4 KB stack overflow is only a linker warning.
      - name: Build
        env:
          FEATURES: ${{ steps.idstate.outputs.features }}
        run: |
          set -euo pipefail
          SO=../../target/deploy/raydium_clmm.so
          rm -f "$SO"
          build() { if [ -n "$FEATURES" ]; then cargo build-sbf --features "$FEATURES" -- --locked; else cargo build-sbf -- --locked; fi; }
          build 2>&1 | tee /tmp/clmm-build.log
          if [ ! -f "$SO" ]; then
            echo "::warning::first cargo build-sbf produced no artifact (toolchain install only), retrying"
            build 2>&1 | tee -a /tmp/clmm-build.log
          fi
          [ -f "$SO" ] || { echo "::error::cargo build-sbf exited 0 but produced no $SO"; exit 1; }
          if grep -q "exceeded max offset" /tmp/clmm-build.log; then
            echo "::error::SBF stack frame overflow"
            grep -B3 "exceeded max offset" /tmp/clmm-build.log
            exit 1
          fi
          ls -l "$SO"
          sha256sum "$SO"
          # The build writes a fresh program key beside the program when none exists. Nothing
          # may deploy with it: the deploy pack names the owner's key file. Removed here.
          rm -f ../../target/deploy/raydium_clmm-keypair.json
          if [ "${FEATURES}" = "" ]; then
            { echo "### tegridy-clmm release build"; echo; echo "sha256 \`$(sha256sum "$SO" | cut -d' ' -f1)\`, $(stat -c%s "$SO") bytes"; } >> "$GITHUB_STEP_SUMMARY"
          fi
      # Kept only from mvp-launch itself: a pull request's or a fork's build is never the one kept.
      - name: Keep the release build
        if: steps.idstate.outputs.placeholder == 'false' && github.event_name == 'push' && github.ref == 'refs/heads/mvp-launch'
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: tegridy-clmm-release
          path: solana/tegridy-clmm/target/deploy/raydium_clmm.so
          if-no-files-found: error
          retention-days: 90
      # Rent is a refundable deposit. Read from mainnet at run time; a failed read says so
      # rather than printing a figure nobody read.
      - name: Deploy rent at today's rate
        run: |
          set -euo pipefail
          SO=../../target/deploy/raydium_clmm.so
          BYTES=$(stat -c%s "$SO")
          rent() {
            curl -sS -m 20 https://api.mainnet-beta.solana.com -H 'content-type: application/json' \
              -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"getMinimumBalanceForRentExemption\",\"params\":[$1]}" \
              | python3 -c 'import json,sys; print("%.4f SOL" % (json.load(sys.stdin)["result"] / 1e9))' 2>/dev/null \
              || echo "could not be read"
          }
          {
            echo "### tegridy-clmm: what a deploy would lock in rent"
            echo
            echo "| | bytes | rent |"
            echo "|---|---|---|"
            echo "| program data, exact --max-len | $((BYTES + 45)) | $(rent $((BYTES + 45))) |"
            echo "| program data, CLI default (twice the size) | $((2 * BYTES + 45)) | $(rent $((2 * BYTES + 45))) |"
            echo "| upload buffer, refunded after deploy | $((BYTES + 37)) | $(rent $((BYTES + 37))) |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: A build without the placeholder feature is refused
        if: steps.idstate.outputs.placeholder == 'true'
        run: |
          set -uo pipefail
          if cargo build-sbf -- --locked > /tmp/clmm-refused.log 2>&1; then
            echo "::error::a build without placeholder-id succeeded: a release could carry the placeholder id"
            exit 1
          fi
          grep -q 'the program id is still the placeholder' /tmp/clmm-refused.log \
            || { echo "::error::the build failed, but not at the placeholder gate"; tail -40 /tmp/clmm-refused.log; exit 1; }
          echo "refused at the placeholder gate, as it must be"
      # devnet hands every power to one test key and localnet reads the admin from the build's
      # environment: neither may build unless test-chain-keys is also named.
      - name: A devnet or localnet build is refused without test-chain-keys
        env:
          FEATURES: ${{ steps.idstate.outputs.features }}
        run: |
          set -uo pipefail
          for F in devnet localnet; do
            if CLMM_LOCALNET_ADMIN=GRMtSxgseKdesExU1BQ22abEspTXV55UPcLaHCd18osd \
              cargo build-sbf --features "${FEATURES:+$FEATURES,}$F" -- --locked > "/tmp/clmm-$F.log" 2>&1; then
              echo "::error::a $F build without test-chain-keys succeeded"
              exit 1
            fi
            grep -q 'devnet and localnet give every power to a test key' "/tmp/clmm-$F.log" \
              || { echo "::error::the $F build failed, but not at the test-chain gate"; tail -40 "/tmp/clmm-$F.log"; exit 1; }
            echo "$F refused at the test-chain gate, as it must be"
          done
      # paramset (test-length reward periods) gets its gate with the real id (program-id-change.mjs).
      - name: A paramset build is refused without test-chain-keys
        if: steps.idstate.outputs.placeholder == 'false'
        run: |
          set -uo pipefail
          if cargo build-sbf --features paramset -- --locked > /tmp/clmm-paramset.log 2>&1; then
            echo "::error::a paramset build without test-chain-keys succeeded"; exit 1
          fi
          grep -q 'paramset is for tests' /tmp/clmm-paramset.log \
            || { echo "::error::the paramset build failed, but not at its gate"; tail -40 /tmp/clmm-paramset.log; exit 1; }
          echo "paramset refused at its gate, as it must be"
      # Skipped: upstream's compute_swap_step_test adds the fee to the net output of an exact
      # output with the fee on output, which holds only at a zero fee (solana/tegridy-clmm/README.md).
      - name: Upstream's own unit tests, but the one with the wrong rule
        run: cargo test --locked --lib -- --exact --skip libraries::swap_math::swap_math_test::compute_swap_step_test
      - name: compute_swap's rule in all four swap kinds, in place of the skipped test
        run: cargo test --locked --test swap_math_fee_rule

  build:
    needs: scope
    if: >-
      !cancelled() &&
      (needs.scope.result != 'success' || needs.scope.outputs.run == 'true')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solana/tegridy-amm/programs/cp-swap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: solana-cargo-${{ hashFiles('solana/tegridy-amm/Cargo.lock') }}
      - name: Install Solana CLI ${{ env.SOLANA_VERSION }}
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: solana --version
        run: solana --version
      - name: Build SBF program (validates the fork compiles; devnet feature = functional keys)
        # `--features devnet` selects the real devnet authorities. A default (non-devnet)
        # build compiles too and embeds the MAINNET identities (EKS4C6x… / the Squads
        # vault); a mainnet binary is built by the operator from a tagged commit, never
        # published from CI, so we do NOT publish that as an artifact here.
        #
        # THIS BUILD PRODUCES A PUBLISHED ARTIFACT, so it carries the same two
        # guards the tegridy-launch build carries — it had NEITHER:
        #
        #  1. `cargo build-sbf` CAN EXIT 0 HAVING COMPILED NOTHING. On a runner
        #     where platform-tools is absent it installs the toolchain and
        #     returns success. That vacuum-passed the launch job on 2026-07-28.
        #  2. An SBF function that overflows its 4 KB stack frame is a LINKER
        #     WARNING, not an error. The build "succeeds" and the program dies
        #     on-chain with "Access violation ... at address 0x4000000000000008".
        #     `cargo check` cannot see it — it is not an SBF target — so this
        #     grep is the only thing between that warning and a published .so.
        #
        # Removing the artifact first is what makes the assertion mean anything:
        # a stale .so from a previous step or a warm cache would otherwise
        # satisfy `test -f` for a build that did nothing.
        run: |
          set -euo pipefail
          SO=../../target/deploy/raydium_cp_swap.so
          rm -f "$SO"
          cargo build-sbf --features devnet -- --locked 2>&1 | tee /tmp/cpswap-build.log
          if [ ! -f "$SO" ]; then
            echo "::warning::first cargo build-sbf produced no artifact (toolchain install only) — retrying"
            cargo build-sbf --features devnet -- --locked 2>&1 | tee -a /tmp/cpswap-build.log
          fi
          if [ ! -f "$SO" ]; then
            echo "::error::cargo build-sbf exited 0 but produced no $SO — the program was NOT compiled, and the artifact published below would be stale or absent"
            exit 1
          fi
          if grep -q "exceeded max offset" /tmp/cpswap-build.log; then
            echo "::error::SBF stack frame overflow — a function exceeds its 4KB frame. Box large Account<T> fields."
            grep -B3 "exceeded max offset" /tmp/cpswap-build.log
            exit 1
          fi
          ls -l "$SO"
      - name: Publish compiled .so (DEVNET deployable binary — mainnet is an operator verifiable build)
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: tegridy-cp-amm-devnet-sbf
          path: solana/tegridy-amm/target/deploy/*.so
          if-no-files-found: error
          retention-days: 14

  launch-curve:
    needs: scope
    if: >-
      !cancelled() &&
      (needs.scope.result != 'success' || needs.scope.outputs.run == 'true')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solana/tegridy-amm/programs/tegridy-launch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: launch-cargo-${{ hashFiles('solana/tegridy-amm/Cargo.lock') }}

      # The curve math is deliberately dependency-free so it can be proven
      # without cargo, a validator, or the SBF toolchain. Run it that way here
      # too: it is the same command a developer runs locally, and it keeps this
      # check green even if the Anchor dependency graph is mid-change.
      - name: Curve math (standalone, no deps)
        run: |
          rustc --edition 2021 --test src/curve.rs -o /tmp/curve_test
          /tmp/curve_test

      # math.test.ts proves the frontend port against curveVectors.fixture.ts, so the
      # fixture must be exactly what tools/gen_curve_vectors.rs prints when built
      # against the curve.rs above. Whole-line `//` comments and blank lines are
      # dropped on both sides, so a note may sit anywhere in the fixture body; any
      # other difference fails. To regenerate: the recipe in the fixture's header.
      - name: Frontend curve fixture matches curve.rs
        run: |
          set -euo pipefail
          FIXTURE="$GITHUB_WORKSPACE/frontend/src/lib/launcher/solana/curve/curveVectors.fixture.ts"
          T=$(mktemp -d)
          cp src/curve.rs "$T/curve_pub.rs"
          cp ../../tools/gen_curve_vectors.rs "$T/"
          (cd "$T" && rustc --edition 2021 -O --diagnostic-width=200 -o gen gen_curve_vectors.rs) || {
            echo "::error::tools/gen_curve_vectors.rs does not compile against this curve.rs (rustc's error is above)"
            exit 1
          }
          rows() { sed -e '/^[[:space:]]*\/\//d' -e '/^[[:space:]]*$/d'; }
          "$T/gen" | tail -n +2 | rows > "$T/generated"
          sed -n '/^export const FEE_UP_VECTORS/,$p' "$FIXTURE" | rows > "$T/fixture"
          [ -s "$T/generated" ] || { echo "::error::the generator printed no rows"; exit 1; }
          if ! diff -u --label fixture --label generated "$T/fixture" "$T/generated" > "$T/diff"; then
            echo "::error::curveVectors.fixture.ts is not what gen_curve_vectors.rs prints against this curve.rs. Regenerate it with the recipe in its header."
            head -n 40 "$T/diff"
            echo "($(wc -l < "$T/diff") diff lines in all)"
            exit 1
          fi
          echo "fixture matches the generator: $(wc -l < "$T/generated") lines"

      - name: Install Solana CLI ${{ env.SOLANA_VERSION }}
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      # The real compile gate for this program — it cannot be run on the Windows
      # dev box (see the header). If this breaks, the program does not build.
      #
      # ⚠️ `cargo build-sbf` CAN EXIT 0 WITHOUT COMPILING ANYTHING. On a runner
      # where platform-tools is not yet present it installs the toolchain and
      # returns success, having built nothing — which passed this job vacuously
      # on 2026-07-28 and made the gate meaningless. So do not trust the exit
      # code: assert the artifact exists, and if the first invocation only
      # installed tools, run it again and then insist on the .so.
      - name: Build SBF program
        run: |
          set -euo pipefail
          SO=../../target/deploy/tegridy_launch.so
          cargo build-sbf 2>&1 | tee /tmp/sbf-build.log
          if [ ! -f "$SO" ]; then
            echo "::warning::first cargo build-sbf produced no artifact (toolchain install only) — retrying"
            cargo build-sbf 2>&1 | tee -a /tmp/sbf-build.log
          fi
          if [ ! -f "$SO" ]; then
            echo "::error::cargo build-sbf exited 0 but produced no $SO — the program was NOT compiled"
            exit 1
          fi
          ls -l "$SO"

      # -- DEPLOY COST, MEASURED --------------------------------------------
      # What deploying the .so just built would lock up in rent: the number an
      # operator funds a deployer with, so it is derived from this artifact and
      # priced by MAINNET on the day, never by a rate written here. Until
      # 2026-10-14 this step used 6960.89 lamports a byte; mainnet's rent had
      # fallen to (bytes + 128) x 5,080 by 2026-09-25 (read again 2026-10-14,
      # slot 456,735,211), so it overstated every figure by about 37%.
      # `solana program deploy` defaults max_len to 2x the binary so the program
      # can grow on upgrade, which DOUBLES the locked rent: pass --max-len.
      - name: Report measured deploy cost
        env:
          RENT_RPC: https://api.mainnet-beta.solana.com
        run: |
          set -euo pipefail
          SO=../../target/deploy/tegridy_launch.so
          # Was `exit 0` — a step that ends in a stack-overflow check must not
          # be able to opt out of reaching it. The build step above asserts this
          # file exists, so its absence here means something upstream lied.
          [ -f "$SO" ] || { echo "::error::no $SO to measure — the build step claimed success"; exit 1; }
          BYTES=$(stat -c%s "$SO")
          # A deploy holds a write buffer (b + 37 bytes, the bytes being
          # uploaded) and programdata (max_len + 45) at once; the buffer is
          # refunded at the end. So settled = programdata, peak = buffer +
          # programdata: (3b + ...) with the CLI default, not twice the settled.
          # Each figure is mainnet's own answer for that exact size.
          rpc() { curl -sS --fail --max-time 20 -X POST "$RENT_RPC" -H 'content-type: application/json' -d "$1" | grep -o '"result":[0-9]*' | cut -d: -f2; }
          rent() { rpc "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"getMinimumBalanceForRentExemption\",\"params\":[$1]}"; }
          SUMMARY="### tegridy-launch - measured deploy cost"
          if SLOT=$(rpc '{"jsonrpc":"2.0","id":1,"method":"getSlot"}') && R0=$(rent 0) && R1=$(rent 1) \
             && BUF=$(rent $((BYTES + 37))) && PD1=$(rent $((BYTES + 45))) && PD2=$(rent $((2 * BYTES + 45))) \
             && [ -n "$SLOT" ] && [ -n "$R0" ] && [ -n "$R1" ] && [ -n "$BUF" ] && [ -n "$PD1" ] && [ -n "$PD2" ]; then
            awk -v b="$BYTES" -v slot="$SLOT" -v r0="$R0" -v r1="$R1" -v buf="$BUF" -v pd1="$PD1" -v pd2="$PD2" 'BEGIN {
              per = r1 - r0;
              printf "### tegridy-launch - measured deploy cost\n\n";
              printf "Rent read from mainnet at slot %d: %d lamports a byte, over the account size plus %d bytes.\n\n", slot, per, r0 / per;
              printf "| | |\n|---|---|\n";
              printf "| .so size | %d bytes |\n", b;
              printf "| rent settled, --max-len exact | **%.3f SOL** |\n", pd1 / 1e9;
              printf "| rent settled, CLI default (2x max_len) | **%.3f SOL** |\n", pd2 / 1e9;
              printf "| peak float, --max-len exact | **%.3f SOL** |\n", (buf + pd1) / 1e9;
              printf "| peak float, CLI default | **%.3f SOL** |\n\n", (buf + pd2) / 1e9;
              printf "Peak exceeds the settled cost because the write buffer holds its own rent, sized to the program, until it is closed and refunded.\n\n";
              printf "Rent is a refundable deposit, not a fee. Pass an explicit --max-len to avoid paying double for upgrade headroom.\n";
            }' | tee -a "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n\nMainnet rent could not be read from %s, so no SOL figure is printed. The .so is %d bytes.\n' "$SUMMARY" "$RENT_RPC" "$BYTES" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

          # ⚠️ SBF gives each function a 4 KB stack frame, and overflowing it is NOT
          # a compile error. The linker prints a warning, the build "succeeds", and
          # the program dies at runtime with "Access violation ... at address
          # 0x4000000000000008". `cargo check` cannot see this at all — it is not an
          # SBF target.
          #
          # This is not hypothetical: adding ONE `seeds` constraint to `pool_state`
          # pushed `MigrateToAmm::try_accounts` to 4224 bytes and every migration
          # aborted, while local `cargo check` stayed clean. Fail the build rather
          # than ship undefined behaviour. The fix is to `Box<Account<'info, T>>` the
          # deserialized accounts, as cp-swap already does.
          if grep -q "exceeded max offset" /tmp/sbf-build.log; then
            echo "::error::SBF stack frame overflow — a function exceeds its 4KB frame. Box large Account<T> fields."
            grep -B3 "exceeded max offset" /tmp/sbf-build.log || true
            exit 1
          fi

      # Published so the .so can be pulled down and exercised against a local
      # validator. That is the only way to test the ACCOUNT CONSTRAINTS at
      # runtime — `cargo check` proves they compile and are wired into the right
      # contexts, not that they actually reject. Devnet feature, because the
      # default build embeds the MAINNET deployer (CqcVva…), which no CI runner holds.
      - name: Build SBF program (devnet authorities, for the deployable artifact)
        # THIS is the build whose output gets published, and it was the only
        # unguarded one in the job — the guards above protect the DEFAULT build,
        # whose .so this step then overwrites.
        #
        # That ordering made the failure mode worse than "no artifact". Both
        # builds write the SAME path. If this one exits 0 without compiling
        # (toolchain-install path), the default build's .so is still sitting
        # there — so `if-no-files-found: error` is satisfied and CI publishes
        # the DEFAULT binary under the devnet name. That build embeds the
        # MAINNET program id and deployer: it deploys, and then nobody but the
        # mainnet deployer can initialize it. Deleting first turns that silent
        # substitution into a failed step.
        run: |
          set -euo pipefail
          SO=../../target/deploy/tegridy_launch.so
          rm -f "$SO"
          cargo build-sbf --features devnet 2>&1 | tee /tmp/sbf-build-devnet.log
          if [ ! -f "$SO" ]; then
            echo "::warning::devnet cargo build-sbf produced no artifact — retrying"
            cargo build-sbf --features devnet 2>&1 | tee -a /tmp/sbf-build-devnet.log
          fi
          if [ ! -f "$SO" ]; then
            echo "::error::devnet cargo build-sbf exited 0 but produced no $SO — refusing to publish the previous (default, mainnet-identity) build under the devnet artifact name"
            exit 1
          fi
          # Same 4KB-frame check as the default build. The devnet feature swaps
          # in different constants, so it is a genuinely different link — a
          # clean default build is not evidence about this one.
          if grep -q "exceeded max offset" /tmp/sbf-build-devnet.log; then
            echo "::error::SBF stack frame overflow in the DEVNET build — a function exceeds its 4KB frame. Box large Account<T> fields."
            grep -B3 "exceeded max offset" /tmp/sbf-build-devnet.log
            exit 1
          fi
          ls -l "$SO"
      # The host-side layout and error-code pins (lib.rs `mod layout_tests`), the
      # same two steps as bayla-ladder. They need the Anchor dependency graph, so
      # they cannot run under the bare rustc above. They are the only check on the
      # BYTE OFFSETS the frontend decoders read (program.ts): the validator suites
      # decode through the IDL, so a reordered field with an unchanged size passes
      # them and the client misreads it.
      #
      # Both feature configs: `deployer::ID` is cfg-gated, so one run only ever
      # compiles one arm.
      - name: Layout and error-code pins (default features)
        run: cargo test --lib -- layout_tests
      - name: Layout and error-code pins (--features devnet)
        run: cargo test --lib --features devnet -- layout_tests
      - name: Publish compiled .so (DEVNET — never a mainnet artifact)
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: tegridy-launch-devnet-sbf
          path: solana/tegridy-amm/target/deploy/tegridy_launch.so
          if-no-files-found: error
          retention-days: 14

  # Runtime proof for tegridy-launch's SECURITY CONSTRAINTS. `cargo check` shows
  # an Anchor constraint compiles and sits in the right context; only executing it
  # shows it REJECTS. Every fix from the 2026-07-29 adversarial review is
  # exercised here, each with a positive control so a vacuous pass is impossible.
  #
  # This job exists in CI rather than locally because the Windows dev box cannot
  # run ANY Solana runtime: cargo build-sbf and solana-test-validator both fail
  # with os error 1314 (symlink privilege), and solana-program-test / litesvm both
  # fail building openssl-sys. The tests are authored + type-checked locally and
  # executed here.
  # bayla-ladder: the lock-ladder staking program with veYFI's early-exit penalty and the
  # mid-window rate guard (a reload may not lower a live rate). Same two
  # gates as launch-curve, for the same reason — the money math is dependency-free and
  # proven under bare rustc, and the Anchor layer can only be compiled here.
  bayla-ladder:
    needs: scope
    if: >-
      !cancelled() &&
      (needs.scope.result != 'success' || needs.scope.outputs.run == 'true')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solana/tegridy-amm/programs/bayla-ladder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ladder-cargo-${{ hashFiles('solana/tegridy-amm/Cargo.lock') }}

      # The ladder, the accumulator, the penalty and the funding bound — proven the
      # same way a developer proves them locally, with no cargo and no validator.
      - name: Ladder math (standalone, no deps)
        run: |
          rustc --edition 2021 --test src/math.rs -o /tmp/ladder_math
          /tmp/ladder_math

      - name: Install Solana CLI ${{ env.SOLANA_VERSION }}
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      # The real compile gate. Same artifact assertion as launch-curve: `cargo
      # build-sbf` can exit 0 having only installed platform-tools.
      - name: Build SBF program
        run: |
          set -euo pipefail
          SO=../../target/deploy/bayla_ladder.so
          cargo build-sbf 2>&1 | tee /tmp/ladder-build.log
          if [ ! -f "$SO" ]; then
            echo "::warning::first cargo build-sbf produced no artifact (toolchain install only) — retrying"
            cargo build-sbf 2>&1 | tee -a /tmp/ladder-build.log
          fi
          if [ ! -f "$SO" ]; then
            echo "::error::cargo build-sbf exited 0 but produced no $SO — the program was NOT compiled"
            exit 1
          fi
          if grep -q "exceeded max offset" /tmp/ladder-build.log; then
            echo "::error::a function exceeded the SBF 4 KB stack frame"
            grep -B3 "exceeded max offset" /tmp/ladder-build.log
            exit 1
          fi
          ls -l "$SO"

      # The host-side layout and error-code pins need the Anchor dependency graph, so
      # they run here rather than under bare rustc.
      #
      # BOTH feature configs, deliberately. `deployer::ID` is cfg-gated, so a single
      # run only ever exercises one arm — and the arm that shipped broken (audit L-5,
      # devnet deployer == the program's own address) is precisely the one a default
      # build never compiles.
      - name: Layout and error-code pins (default features)
        run: cargo test --lib -- layout_tests
      - name: Layout and error-code pins (--features devnet)
        run: cargo test --lib --features devnet -- layout_tests

  # THE FIRST EXECUTION of bayla-ladder, ever.
  #
  # Until this job existed, nothing in that program had run anywhere: not mainnet, not
  # devnet, not a validator. It compiled, its pure math was proven on the host, and an
  # 82-agent audit read every line — none of which is the same as running. The audit
  # named what only execution can find, and compute-unit consumption was top of the
  # list: entirely unmeasured, on a program that had already blown the OTHER hard SBF
  # limit (Exit::try_accounts, over the 4 KB frame by 56 bytes on its first compile).
  #
  # Structure mirrors launch-constraints deliberately: patch identities into a
  # throwaway checkout, build, assert the artifacts agree, deploy, drive the real
  # instructions. Every rejection in the suite carries a positive control.
  ladder-constraints:
    needs: scope
    if: >-
      !cancelled() &&
      (needs.scope.result != 'success' || needs.scope.outputs.run == 'true')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solana/tegridy-amm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install Solana CLI ${{ env.SOLANA_VERSION }}
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor ${{ env.ANCHOR_VERSION }}
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install "$ANCHOR_VERSION"
          avm use "$ANCHOR_VERSION"

      # `deployer::ID` is a COMPILE-TIME constant, so a generated CI wallet can never
      # match the committed one. Patch, exactly as launch-constraints does — and note
      # this is the constant that shipped EQUAL to declare_id! (audit L-5), which made
      # initialize_pool uncallable and every instruction downstream unreachable. The
      # patcher asserts its own counts so a silent mis-patch cannot pass as a mystery.
      - name: Pin the program id and the devnet deployer, then build
        run: |
          set -euo pipefail
          solana-keygen new --no-bip39-passphrase --silent --force -o "$HOME/.config/solana/id.json"
          WALLET=$(solana-keygen pubkey "$HOME/.config/solana/id.json")
          mkdir -p target/deploy
          solana-keygen new --no-bip39-passphrase --silent --force             -o target/deploy/bayla_ladder-keypair.json
          PROGRAM_ID=$(solana-keygen pubkey target/deploy/bayla_ladder-keypair.json)
          echo "wallet(deployer)=$WALLET program=$PROGRAM_ID"

          python3 - programs/bayla-ladder/src/lib.rs "$PROGRAM_ID" "$WALLET" <<'PY'
          import re, sys
          path, program_id, wallet = sys.argv[1], sys.argv[2], sys.argv[3]
          src = open(path).read()
          marker = "pub mod deployer {"
          head, sep, tail = src.partition(marker)
          assert sep, "could not locate `pub mod deployer` - lib.rs layout changed"
          head, n = re.subn(r'declare_id!\("[^"]+"\)', f'declare_id!("{program_id}")', head)
          assert n == 1, f"expected exactly 1 top-level declare_id!, patched {n}"
          pat = r'(#\[cfg\(feature = "devnet"\)\]\s*pub const ID: Pubkey = pubkey!\(")[^"]+("\);)'
          tail, n = re.subn(pat, r'\g<1>' + wallet + r'\g<2>', tail, count=1)
          assert n == 1, f"expected 1 devnet deployer pubkey!, patched {n}"
          assert program_id != wallet, "deployer must never equal the program id - audit L-5"
          open(path, 'w').write(head + sep + tail)
          PY

          sed -i "s|^bayla_ladder = \".*\"|bayla_ladder = \"$PROGRAM_ID\"|" Anchor.toml
          grep -E '^bayla_ladder' Anchor.toml
          anchor build -p bayla_ladder -- --features devnet

      - name: Assert artifacts exist AND their program ids agree
        run: |
          set -euo pipefail
          test -f target/deploy/bayla_ladder.so || { echo "::error::no .so"; exit 1; }
          test -f target/idl/bayla_ladder.json || { echo "::error::no IDL - the tests load it at runtime"; exit 1; }
          KEYPAIR_ID=$(solana-keygen pubkey target/deploy/bayla_ladder-keypair.json)
          IDL_ID=$(python3 -c "import json;print(json.load(open('target/idl/bayla_ladder.json'))['address'])")
          SRC_ID=$(grep -oP 'declare_id!\("\K[^"]+' programs/bayla-ladder/src/lib.rs | head -1)
          echo "keypair=$KEYPAIR_ID idl=$IDL_ID src=$SRC_ID"
          if [ "$KEYPAIR_ID" != "$IDL_ID" ] || [ "$KEYPAIR_ID" != "$SRC_ID" ]; then
            echo "::error::program id mismatch - deploy keypair, IDL and declare_id! must agree"
            exit 1
          fi
          ls -l target/deploy/bayla_ladder.so target/idl/bayla_ladder.json

      # THE COMMITTED IDL MUST STILL DESCRIBE THIS PROGRAM.
      #
      # `anchor build` cannot run on the operator's Windows box (platform-tools needs
      # a symlink privilege it does not have), so for most of this program's life the
      # only IDL in existence was inside a CI artifact GitHub deletes after 30 days -
      # an interface description with an expiry date, for a program that is deployed.
      # `idl/bayla_ladder.json` is committed now, and a committed generated file that
      # nothing checks is a file that goes stale silently. This job has just built a
      # fresh one; compare them.
      #
      # The two per-build identities (declare_id! and the cfg-gated deployer::ID,
      # which this job patches with THROWAWAY keys) are normalised - after being
      # asserted present, so a build that LOST the deployer gate cannot read as a
      # match. Nothing else is normalised; see tools/check_committed_idl.py.
      - name: The committed IDL must match this build
        run: |
          set -euo pipefail
          python3 tools/check_committed_idl.py idl/bayla_ladder.json target/idl/bayla_ladder.json

      - name: Install JS deps (yarn, matching the committed lockfile)
        run: yarn install --frozen-lockfile

      - name: Deploy to a local validator and drive the real instructions
        env:
          ANCHOR_PROVIDER_URL: http://127.0.0.1:8899
          ANCHOR_WALLET: /home/runner/.config/solana/id.json
          # Node 24 loads a .ts file itself (type stripping) before ts-node can, and then
          # `import { BN, Idl } from "@coral-xyz/anchor"` fails: Idl is a type, and the
          # module is CommonJS. Off, ts-node compiles the tests the way it did on Node 20.
          NODE_OPTIONS: --no-experimental-strip-types
        run: |
          set -euo pipefail
          solana-test-validator --ledger /tmp/ledger-ladder --reset --quiet &
          VALIDATOR_PID=$!
          trap 'kill $VALIDATOR_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            solana -u http://127.0.0.1:8899 cluster-version >/dev/null 2>&1 && break
            sleep 2
          done
          solana -u http://127.0.0.1:8899 cluster-version
          solana -u http://127.0.0.1:8899 airdrop 100 || true
          solana -u http://127.0.0.1:8899 program deploy             --program-id target/deploy/bayla_ladder-keypair.json             target/deploy/bayla_ladder.so
          yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/bayla-ladder.test.ts

  launch-constraints:
    needs: scope
    if: >-
      !cancelled() &&
      (needs.scope.result != 'success' || needs.scope.outputs.run == 'true')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solana/tegridy-amm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install Solana CLI ${{ env.SOLANA_VERSION }}
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor ${{ env.ANCHOR_VERSION }}
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install "$ANCHOR_VERSION"
          avm use "$ANCHOR_VERSION"

      # deployer::ID is a COMPILE-TIME constant, so a freshly generated CI wallet
      # can never match it. Rather than commit a keypair, generate one and patch
      # the devnet constant to match before building. The constraint under test is
      # the mechanism ("only this key may initialize"), not the specific value —
      # and the reject-path test still uses a different signer, so the check is
      # genuinely exercised in both directions.
      # Pin BOTH identities before building, so the .so, the IDL, declare_id! and
      # the deploy keypair are equal by construction rather than by build
      # ordering. `anchor keys sync` was tried and is NOT sufficient: it aligned
      # declare_id! and the keypair but left the IDL carrying a third, stale
      # address, which then failed at runtime as an opaque sanitize error.
      - name: Pin the program id and the devnet deployer, then build
        run: |
          set -euo pipefail

          # 1. CI wallet — this becomes the devnet `deployer` key. deployer::ID is
          #    a compile-time constant, so a generated wallet can never match a
          #    committed one; patch rather than commit a keypair.
          solana-keygen new --no-bip39-passphrase --silent --force -o "$HOME/.config/solana/id.json"
          WALLET=$(solana-keygen pubkey "$HOME/.config/solana/id.json")

          # 2. Program keypair, generated up front so nothing downstream invents one.
          mkdir -p target/deploy
          solana-keygen new --no-bip39-passphrase --silent --force \
            -o target/deploy/tegridy_launch-keypair.json
          PROGRAM_ID=$(solana-keygen pubkey target/deploy/tegridy_launch-keypair.json)
          echo "wallet(deployer)=$WALLET program=$PROGRAM_ID"

          # 3. Patch both into the source. The program id is the crate's single
          #    `declare_id!`; the deployer key is a `pubkey!` CONSTANT inside
          #    `mod deployer` (deliberately not a second declare_id! — see the note
          #    on that module). Handled separately, each count asserted, so a
          #    silent mis-patch cannot slip through as a runtime mystery.
          python3 - programs/tegridy-launch/src/lib.rs "$PROGRAM_ID" "$WALLET" <<'PY'
          import re, sys
          path, program_id, wallet = sys.argv[1], sys.argv[2], sys.argv[3]
          src = open(path).read()

          marker = "pub mod deployer {"
          head, sep, tail = src.partition(marker)
          assert sep, "could not locate `pub mod deployer` — lib.rs layout changed"

          # The crate must contain EXACTLY ONE declare_id!, and it must be the
          # top-level program id. A second one anywhere makes the IDL address
          # ambiguous, which is the bug this whole arrangement exists to prevent.
          assert 'declare_id!' not in tail, "declare_id! found inside/after mod deployer — use pubkey! for key constants"
          head, n = re.subn(r'declare_id!\("[^"]+"\)', f'declare_id!("{program_id}")', head)
          assert n == 1, f"expected exactly 1 top-level declare_id!, patched {n}"

          # Only the devnet arm of the deployer constant.
          pat = r'(#\[cfg\(feature = "devnet"\)\]\s*\n\s*pub const ID: Pubkey = pubkey!\(")[^"]+("\);)'
          tail, n = re.subn(pat, r'\g<1>' + wallet + r'\g<2>', tail, count=1)
          assert n == 1, f"expected 1 devnet deployer pubkey!, patched {n}"

          open(path, 'w').write(head + sep + tail)
          PY

          # 4. Anchor.toml must agree or anchor build rewrites the id back.
          sed -i "s|^tegridy_launch = \".*\"|tegridy_launch = \"$PROGRAM_ID\"|" Anchor.toml
          grep -E 'declare_id' programs/tegridy-launch/src/lib.rs
          grep -E '^tegridy_launch' Anchor.toml

          anchor build -p tegridy_launch -- --features devnet

      - name: Assert artifacts exist AND their program ids agree
        run: |
          set -euo pipefail
          test -f target/deploy/tegridy_launch.so || { echo "::error::no .so"; exit 1; }
          test -f target/idl/tegridy_launch.json || { echo "::error::no IDL — tests load it at runtime"; exit 1; }

          KEYPAIR_ID=$(solana-keygen pubkey target/deploy/tegridy_launch-keypair.json)
          IDL_ID=$(python3 -c "import json;print(json.load(open('target/idl/tegridy_launch.json'))['address'])")
          SRC_ID=$(grep -oP 'declare_id!\("\K[^"]+' programs/tegridy-launch/src/lib.rs | head -1)
          echo "keypair=$KEYPAIR_ID idl=$IDL_ID src=$SRC_ID"

          # Fail LOUDLY on drift. This mismatch previously surfaced only as an
          # opaque sanitize error from inside a test, which cost a CI round-trip
          # to diagnose.
          if [ "$KEYPAIR_ID" != "$IDL_ID" ] || [ "$KEYPAIR_ID" != "$SRC_ID" ]; then
            echo "::error::program id mismatch — deploy keypair, IDL and declare_id! must agree"
            exit 1
          fi
          ls -l target/deploy/tegridy_launch.so target/idl/tegridy_launch.json

      # yarn, not npm — the project ships .yarnrc.yml + yarn.lock, and Anchor.toml's
      # own test script uses yarn. Running npm here would generate a competing
      # package-lock.json and resolve a different tree than the committed lockfile.
      - name: Install JS deps (yarn, matching the committed lockfile)
        run: yarn install --frozen-lockfile

      - name: Run constraint tests against a local validator
        env:
          ANCHOR_PROVIDER_URL: http://127.0.0.1:8899
          ANCHOR_WALLET: /home/runner/.config/solana/id.json
          # See ladder-constraints: Node 24's own .ts loading must not pre-empt ts-node.
          NODE_OPTIONS: --no-experimental-strip-types
        run: |
          set -euo pipefail
          solana-test-validator --ledger /tmp/ledger --reset --quiet &
          VALIDATOR_PID=$!
          trap 'kill $VALIDATOR_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            solana -u http://127.0.0.1:8899 cluster-version >/dev/null 2>&1 && break
            sleep 2
          done
          solana -u http://127.0.0.1:8899 cluster-version
          solana -u http://127.0.0.1:8899 airdrop 100 || true
          solana -u http://127.0.0.1:8899 program deploy \
            --program-id target/deploy/tegridy_launch-keypair.json \
            target/deploy/tegridy_launch.so
          yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/tegridy-launch-constraints.test.ts

  # FULL LIFECYCLE REHEARSAL — the only job that actually EXECUTES migrate_to_amm.
  #
  # Two runtime-only defects were already found in that instruction by reading
  # mechanics, both of which `cargo check` accepted silently: an unbudgeted
  # create_pool_fee, and a system_program::transfer from a program-owned PDA that
  # would have failed on every migration. There is no reason to assume inspection
  # caught the last one, so this drives the real thing end to end and asserts the
  # LP supply is ZERO afterwards.
  migration-rehearsal:
    needs: scope
    if: >-
      !cancelled() &&
      (needs.scope.result != 'success' || needs.scope.outputs.run == 'true')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solana/tegridy-amm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install Solana CLI ${{ env.SOLANA_VERSION }}
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor ${{ env.ANCHOR_VERSION }}
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install "$ANCHOR_VERSION"
          avm use "$ANCHOR_VERSION"

      # cp-swap hardcodes `admin::ID` and `create_pool_fee_reveiver::ID`, and we hold
      # NEITHER key — so a rehearsal cannot create an AmmConfig or pay the pool fee
      # without repointing them at addresses this runner controls.
      #
      # This patches a THROWAWAY CHECKOUT for test purposes only. The `diff-guard`
      # job runs on its own clean checkout and independently proves the COMMITTED
      # cp-swap source differs from audited upstream by exactly the pinned delta, so
      # this cannot launder a real change into the fork.
      - name: Pin every identity, then build both programs
        run: |
          set -euo pipefail
          solana-keygen new --no-bip39-passphrase --silent --force -o "$HOME/.config/solana/id.json"
          WALLET=$(solana-keygen pubkey "$HOME/.config/solana/id.json")

          # The pool-fee receiver must be a real on-chain account at a compile-time
          # address. Derive our WSOL ATA now and patch THAT in; the test creates it
          # at runtime. (Chicken-and-egg otherwise: the address must exist to be
          # paid, but must be known to be compiled.)
          WSOL=So11111111111111111111111111111111111111112
          FEE_ATA=$(spl-token address --token "$WSOL" --owner "$WALLET" --verbose 2>/dev/null \
            | awk '/Associated token address/{print $NF}')
          if [ -z "$FEE_ATA" ]; then echo "::error::could not derive WSOL ATA"; exit 1; fi
          echo "wallet=$WALLET  fee_ata=$FEE_ATA"

          mkdir -p target/deploy
          for P in raydium_cp_swap tegridy_launch; do
            solana-keygen new --no-bip39-passphrase --silent --force -o "target/deploy/${P}-keypair.json"
          done
          CP_ID=$(solana-keygen pubkey target/deploy/raydium_cp_swap-keypair.json)
          TL_ID=$(solana-keygen pubkey target/deploy/tegridy_launch-keypair.json)
          echo "cp_swap=$CP_ID  tegridy_launch=$TL_ID"

          python3 - "$WALLET" "$FEE_ATA" "$CP_ID" "$TL_ID" <<'PY'
          import re, sys
          wallet, fee_ata, cp_id, tl_id = sys.argv[1:5]

          # --- cp-swap: program id + devnet admin + devnet fee receiver ---
          p = "programs/cp-swap/src/lib.rs"
          s = open(p).read()
          s, n = re.subn(r'(#\[cfg\(feature = "devnet"\)\]\s*\ndeclare_id!\(")[^"]+(")',
                         r'\g<1>' + cp_id + r'\g<2>', s, count=1)
          assert n == 1, f"cp-swap devnet declare_id: patched {n}"
          def patch_mod(src, mod, value):
              head, sep, tail = src.partition(f"pub mod {mod} {{")
              assert sep, f"no mod {mod}"
              tail, k = re.subn(r'(#\[cfg\(feature = "devnet"\)\]\s*\n\s*pub const ID: Pubkey = pubkey!\(")[^"]+(")',
                                r'\g<1>' + value + r'\g<2>', tail, count=1)
              assert k == 1, f"mod {mod}: patched {k}"
              return head + sep + tail
          s = patch_mod(s, "admin", wallet)
          s = patch_mod(s, "create_pool_fee_reveiver", fee_ata)
          open(p, "w").write(s)

          # --- tegridy-launch: program id + devnet deployer ---
          p2 = "programs/tegridy-launch/src/lib.rs"
          s2 = open(p2).read()
          head, sep, tail = s2.partition("pub mod deployer {")
          assert sep
          head, n = re.subn(r'declare_id!\("[^"]+"\)', f'declare_id!("{tl_id}")', head)
          assert n == 1, f"tegridy-launch declare_id: patched {n}"
          tail, n = re.subn(r'(#\[cfg\(feature = "devnet"\)\]\s*\n\s*pub const ID: Pubkey = pubkey!\(")[^"]+(")',
                            r'\g<1>' + wallet + r'\g<2>', tail, count=1)
          assert n == 1, f"deployer pubkey: patched {n}"
          open(p2, "w").write(head + sep + tail)
          PY

          sed -i "s|^raydium_cp_swap = \".*\"|raydium_cp_swap = \"$CP_ID\"|" Anchor.toml
          sed -i "s|^tegridy_launch = \".*\"|tegridy_launch = \"$TL_ID\"|" Anchor.toml

          anchor build -- --features devnet 2>&1 | tee /tmp/anchor-build.log

          for P in raydium_cp_swap tegridy_launch; do
            test -f "target/deploy/${P}.so" || { echo "::error::no ${P}.so"; exit 1; }
            test -f "target/idl/${P}.json" || { echo "::error::no ${P} IDL"; exit 1; }
          done
          ls -l target/deploy/*.so

          # An SBF stack-frame overflow is a WARNING here, not an error, and the
          # program then dies at runtime with "Access violation ... at address
          # 0x4000000000000008". This build is what produced exactly that on
          # 2026-07-30, so refuse to run the rehearsal against a binary carrying it —
          # otherwise the failure shows up as an inscrutable "Program failed to
          # complete" three steps later. See the same guard in launch-curve.
          if grep -q "exceeded max offset" /tmp/anchor-build.log; then
            echo "::error::SBF stack frame overflow — a function exceeds its 4KB frame. Box large Account<T> fields."
            grep -B3 "exceeded max offset" /tmp/anchor-build.log || true
            exit 1
          fi

      - name: Install JS deps
        run: yarn install --frozen-lockfile

      - name: Deploy both and run the rehearsal
        env:
          ANCHOR_PROVIDER_URL: http://127.0.0.1:8899
          ANCHOR_WALLET: /home/runner/.config/solana/id.json
          # See ladder-constraints: Node 24's own .ts loading must not pre-empt ts-node.
          NODE_OPTIONS: --no-experimental-strip-types
        run: |
          set -euo pipefail
          solana-test-validator --ledger /tmp/ledger --reset --quiet &
          VALIDATOR_PID=$!
          trap 'kill $VALIDATOR_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            solana -u http://127.0.0.1:8899 cluster-version >/dev/null 2>&1 && break
            sleep 2
          done
          solana -u http://127.0.0.1:8899 cluster-version
          solana -u http://127.0.0.1:8899 airdrop 500 || true

          for P in raydium_cp_swap tegridy_launch; do
            solana -u http://127.0.0.1:8899 program deploy \
              --program-id "target/deploy/${P}-keypair.json" "target/deploy/${P}.so"
          done

          yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/tegridy-launch-migration.test.ts

  # ─────────────────────────────────────────────────────────────────────
  # Required-status aggregator, mirroring contracts-ci.yml's all-tests-pass.
  #
  # Before this job, solana-ci exposed six independent check names and no
  # single one meant "the Solana side is good". Branch protection would have
  # had to name all six, and adding a seventh job would silently leave it
  # unrequired. Point the rule at "solana-ci / all-checks-pass" instead.
  #
  # `if: always()` plus an explicit read of every result: under always(), a
  # skipped or failed dependency still lets this job run, so `needs` alone
  # gates nothing. A skipped job is NOT a pass here — that is the same
  # green-over-nothing shape the contracts aggregator exists to refuse.
  # ─────────────────────────────────────────────────────────────────────
  all-checks-pass:
    name: all-checks-pass
    needs:
      [
        scope,
        diff-guard,
        clmm-guards,
        clmm-build,
        build,
        launch-curve,
        bayla-ladder,
        ladder-constraints,
        launch-constraints,
        migration-rehearsal,
      ]
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 5
    steps:
      # Exactly one of the next two steps runs; the conditions are
      # complements. Out of scope, every job above is SKIPPED, and the
      # aggregate below counts a skip as a failure — correctly, so it
      # must not be the step that speaks here.
      - name: Out of scope for this diff
        if: needs.scope.result == 'success' && needs.scope.outputs.run != 'true'
        run: |
          echo "Nothing in this change set is in scope for solana-ci.yml;"
          echo "reporting its check as satisfied. See the scope job for the file list."
      # DERIVED FROM `needs` ITSELF, never a hand-maintained list.
      #
      # It used to enumerate five jobs by name while `needs:` listed eight, so
      # `bayla-ladder` and `ladder-constraints` sat OUTSIDE the aggregate entirely,
      # and this job reported SUCCESS on two consecutive runs where
      # ladder-constraints had FAILED. Branch protection reads this check, so a
      # duplicated list here is the whole "green != checked" failure mode.
      #
      # `toJSON(needs)` cannot drift from the `needs:` block above, because it IS
      # that block. Adding a job to `needs:` now adds it to the gate automatically.
      # python3, not jq: it is on the runner AND on the dev box, so the parsing can
      # be exercised locally instead of trusted.
      - name: Aggregate job results
        if: needs.scope.result != 'success' || needs.scope.outputs.run == 'true'
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -uo pipefail
          python3 - <<'AGG'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS_JSON"])
          # `scope` is handled by the complementary step above; everything else counts.
          jobs = {k: v.get("result") for k, v in needs.items() if k != "scope"}
          if not jobs:
              print("::error title=aggregate checked nothing::needs resolved to no jobs")
              sys.exit(1)
          print(f"aggregating {len(jobs)} job(s):")
          failed = []
          for name in sorted(jobs):
              result = jobs[name]
              print(f"  {name}: {result}")
              if result != "success":
                  failed.append(name)
          if failed:
              print(
                  "::error title=solana-ci did not fully pass::"
                  + ", ".join(failed)
                  + " did not succeed. A skipped job counts as a failure here."
              )
              sys.exit(1)
          print("All solana-ci jobs passed")
          AGG
