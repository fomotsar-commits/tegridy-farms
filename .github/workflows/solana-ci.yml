name: solana-ci

# Tegridy CP-AMM (solana/tegridy-amm) — a verbatim fork of raydium-cp-swap,
# plus tegridy-launch, our own bonding curve that graduates into it.
# Gates:
#   1. diff-guard  — proves the fork is byte-identical to the pinned audited
#      upstream EXCEPT programs/cp-swap/src/lib.rs (the 3 authority constants).
#      This is the security invariant; it needs no Solana toolchain.
#      SCOPED TO cp-swap ONLY — tegridy-launch is our own code with no upstream
#      to diff against, so it is deliberately NOT covered by this job.
#   2. build       — compiles the SBF program (validates our diff compiles).
#   3. launch-curve — host-tests tegridy-launch's dependency-free curve math and
#      SBF-builds the program. This is the ONLY compile gate for that program:
#      it cannot be built on the Windows dev box (platform-tools install needs
#      the symlink privilege, os error 1314; cargo build scripts are blocked by
#      Application Control, os error 4551 — both hit the existing cp-swap too).
#   4. launch-constraints — deploys tegridy-launch to a local validator and proves
#      its SECURITY CONSTRAINTS actually REJECT. `cargo check` only shows they
#      compile and sit in the right Accounts context. Every check here came from
#      the 2026-07-29 adversarial review (1 critical + 3 medium), and each has a
#      positive control so a vacuous pass is impossible.
#      The Windows dev box can run NO Solana runtime at all — build-sbf and
#      solana-test-validator both hit os error 1314, and solana-program-test and
#      litesvm both fail building openssl-sys — so this job is the only place
#      these constraints are ever executed.
on:
  push:
    paths: ["solana/**", ".github/workflows/solana-ci.yml"]
  pull_request:
    paths: ["solana/**", ".github/workflows/solana-ci.yml"]

permissions:
  contents: read

env:
  # Upstream commit this fork is pinned to. Bump deliberately + re-diff on any
  # intentional upstream sync.
  UPSTREAM_REPO: https://github.com/raydium-io/raydium-cp-swap
  UPSTREAM_COMMIT: 78f254e1023751e706df7dc15c453fc3e046697c
  SOLANA_VERSION: v2.3.0
  # Must match Anchor.toml's [toolchain] anchor_version and the anchor-lang /
  # anchor-spl versions both programs pin — the IDL the TS tests load is
  # generated by this CLI.
  ANCHOR_VERSION: 0.32.1

jobs:
  diff-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone pinned upstream
        run: |
          git clone "$UPSTREAM_REPO" /tmp/upstream
          git -C /tmp/upstream checkout --quiet "$UPSTREAM_COMMIT"
      - name: Assert ONLY the allowed authority files differ from audited upstream
        run: |
          set -euo pipefail
          # The ENTIRE code delta from audited upstream must be confined to these two
          # files, which hold ONLY hardcoded authority/identity constants (program id,
          # admin, fee receiver, support-mint owner). Anything else = audit invariant broken.
          # Match the differing file's path in a `diff -rq` line ("Files A and B differ").
          # Do NOT anchor to end-of-line — the line ends in "differ", not the filename.
          ALLOWED='/(lib\.rs|create_support_mint_associated\.rs) '
          UNEXPECTED=$(diff -rq /tmp/upstream/programs/cp-swap/src \
                                solana/tegridy-amm/programs/cp-swap/src \
                        | grep -vE "$ALLOWED" || true)
          if [ -n "$UNEXPECTED" ]; then
            echo "::error::Fork diverges from audited upstream beyond the allowed authority files:"
            echo "$UNEXPECTED"
            exit 1
          fi
          echo "✅ Only lib.rs + create_support_mint_associated.rs differ from upstream $UPSTREAM_COMMIT"
      - name: Show the authority deltas (for review)
        run: |
          for f in lib.rs instructions/admin/create_support_mint_associated.rs; do
            echo "═══ $f ═══"
            diff "/tmp/upstream/programs/cp-swap/src/$f" \
                 "solana/tegridy-amm/programs/cp-swap/src/$f" || true
          done

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solana/tegridy-amm/programs/cp-swap
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: solana-cargo-${{ hashFiles('solana/tegridy-amm/Cargo.lock') }}
      - name: Install Solana CLI ${{ env.SOLANA_VERSION }}
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: solana --version
        run: solana --version
      - name: Build SBF program (validates the fork compiles; devnet feature = functional keys)
        # `--features devnet` selects the real devnet authorities. A default (non-devnet)
        # build compiles too but embeds fail-closed System-Program sentinels, so we do
        # NOT publish that as a deployable artifact.
        run: cargo build-sbf --features devnet
      - name: Publish compiled .so (DEVNET deployable binary — mainnet is an operator verifiable build)
        uses: actions/upload-artifact@v4
        with:
          name: tegridy-cp-amm-devnet-sbf
          path: solana/tegridy-amm/target/deploy/*.so
          if-no-files-found: error
          retention-days: 14

  launch-curve:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solana/tegridy-amm/programs/tegridy-launch
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: launch-cargo-${{ hashFiles('solana/tegridy-amm/Cargo.lock') }}

      # The curve math is deliberately dependency-free so it can be proven
      # without cargo, a validator, or the SBF toolchain. Run it that way here
      # too: it is the same command a developer runs locally, and it keeps this
      # check green even if the Anchor dependency graph is mid-change.
      - name: Curve math (standalone, no deps)
        run: |
          rustc --edition 2021 --test src/curve.rs -o /tmp/curve_test
          /tmp/curve_test

      - name: Install Solana CLI ${{ env.SOLANA_VERSION }}
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      # The real compile gate for this program — it cannot be run on the Windows
      # dev box (see the header). If this breaks, the program does not build.
      #
      # ⚠️ `cargo build-sbf` CAN EXIT 0 WITHOUT COMPILING ANYTHING. On a runner
      # where platform-tools is not yet present it installs the toolchain and
      # returns success, having built nothing — which passed this job vacuously
      # on 2026-07-28 and made the gate meaningless. So do not trust the exit
      # code: assert the artifact exists, and if the first invocation only
      # installed tools, run it again and then insist on the .so.
      - name: Build SBF program
        run: |
          set -euo pipefail
          SO=../../target/deploy/tegridy_launch.so
          cargo build-sbf
          if [ ! -f "$SO" ]; then
            echo "::warning::first cargo build-sbf produced no artifact (toolchain install only) — retrying"
            cargo build-sbf
          fi
          if [ ! -f "$SO" ]; then
            echo "::error::cargo build-sbf exited 0 but produced no $SO — the program was NOT compiled"
            exit 1
          fi
          ls -l "$SO"

      # Published so the .so can be pulled down and exercised against a local
      # validator. That is the only way to test the ACCOUNT CONSTRAINTS at
      # runtime — `cargo check` proves they compile and are wired into the right
      # contexts, not that they actually reject. Devnet feature, because the
      # default build embeds fail-closed sentinels that cannot initialize.
      - name: Build SBF program (devnet authorities, for the deployable artifact)
        run: cargo build-sbf --features devnet
      - name: Publish compiled .so (DEVNET — never a mainnet artifact)
        uses: actions/upload-artifact@v4
        with:
          name: tegridy-launch-devnet-sbf
          path: solana/tegridy-amm/target/deploy/tegridy_launch.so
          if-no-files-found: error
          retention-days: 14

  # Runtime proof for tegridy-launch's SECURITY CONSTRAINTS. `cargo check` shows
  # an Anchor constraint compiles and sits in the right context; only executing it
  # shows it REJECTS. Every fix from the 2026-07-29 adversarial review is
  # exercised here, each with a positive control so a vacuous pass is impossible.
  #
  # This job exists in CI rather than locally because the Windows dev box cannot
  # run ANY Solana runtime: cargo build-sbf and solana-test-validator both fail
  # with os error 1314 (symlink privilege), and solana-program-test / litesvm both
  # fail building openssl-sys. The tests are authored + type-checked locally and
  # executed here.
  launch-constraints:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solana/tegridy-amm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Solana CLI ${{ env.SOLANA_VERSION }}
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor ${{ env.ANCHOR_VERSION }}
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install "$ANCHOR_VERSION"
          avm use "$ANCHOR_VERSION"

      # deployer::ID is a COMPILE-TIME constant, so a freshly generated CI wallet
      # can never match it. Rather than commit a keypair, generate one and patch
      # the devnet constant to match before building. The constraint under test is
      # the mechanism ("only this key may initialize"), not the specific value —
      # and the reject-path test still uses a different signer, so the check is
      # genuinely exercised in both directions.
      - name: Generate wallet and pin it as the devnet deployer
        run: |
          set -euo pipefail
          solana-keygen new --no-bip39-passphrase --silent --force -o "$HOME/.config/solana/id.json"
          PUBKEY=$(solana-keygen pubkey "$HOME/.config/solana/id.json")
          echo "CI deployer: $PUBKEY"
          LIB=programs/tegridy-launch/src/lib.rs
          # Replace only the declare_id inside the `devnet` cfg arm of `mod deployer`.
          python3 - "$LIB" "$PUBKEY" <<'PY'
          import re, sys
          path, pubkey = sys.argv[1], sys.argv[2]
          src = open(path).read()
          pat = r'(pub mod deployer \{.*?#\[cfg\(feature = "devnet"\)\]\s*\n\s*declare_id!\(")[^"]+("\);)'
          new, n = re.subn(pat, r'\g<1>' + pubkey + r'\g<2>', src, flags=re.S)
          assert n == 1, f"expected exactly one devnet deployer declare_id, patched {n}"
          open(path, 'w').write(new)
          PY
          grep -A4 'pub mod deployer' "$LIB"

      - name: Build (produces the .so AND the IDL the tests load)
        run: |
          set -euo pipefail
          # The FIRST build generates target/deploy/tegridy_launch-keypair.json
          # with a fresh pubkey that does NOT match declare_id! or Anchor.toml.
          # Deploying that keypair while the IDL still carries the placeholder
          # address points the client at an address with no program at it; every
          # instruction then dies with the deeply unhelpful "Transaction failed to
          # sanitize accounts offsets correctly". `anchor keys sync` rewrites
          # declare_id! and Anchor.toml to match the keypair — then rebuild so the
          # .so and the IDL both carry the synced address.
          anchor build -p tegridy_launch -- --features devnet
          anchor keys sync
          anchor build -p tegridy_launch -- --features devnet

      - name: Assert artifacts exist AND their program ids agree
        run: |
          set -euo pipefail
          test -f target/deploy/tegridy_launch.so || { echo "::error::no .so"; exit 1; }
          test -f target/idl/tegridy_launch.json || { echo "::error::no IDL — tests load it at runtime"; exit 1; }

          KEYPAIR_ID=$(solana-keygen pubkey target/deploy/tegridy_launch-keypair.json)
          IDL_ID=$(python3 -c "import json;print(json.load(open('target/idl/tegridy_launch.json'))['address'])")
          SRC_ID=$(grep -oP 'declare_id!\("\K[^"]+' programs/tegridy-launch/src/lib.rs | head -1)
          echo "keypair=$KEYPAIR_ID idl=$IDL_ID src=$SRC_ID"

          # Fail LOUDLY on drift. This mismatch previously surfaced only as an
          # opaque sanitize error from inside a test, which cost a CI round-trip
          # to diagnose.
          if [ "$KEYPAIR_ID" != "$IDL_ID" ] || [ "$KEYPAIR_ID" != "$SRC_ID" ]; then
            echo "::error::program id mismatch — deploy keypair, IDL and declare_id! must agree"
            exit 1
          fi
          ls -l target/deploy/tegridy_launch.so target/idl/tegridy_launch.json

      # yarn, not npm — the project ships .yarnrc.yml + yarn.lock, and Anchor.toml's
      # own test script uses yarn. Running npm here would generate a competing
      # package-lock.json and resolve a different tree than the committed lockfile.
      - name: Install JS deps (yarn, matching the committed lockfile)
        run: yarn install --frozen-lockfile

      - name: Run constraint tests against a local validator
        env:
          ANCHOR_PROVIDER_URL: http://127.0.0.1:8899
          ANCHOR_WALLET: /home/runner/.config/solana/id.json
        run: |
          set -euo pipefail
          solana-test-validator --ledger /tmp/ledger --reset --quiet &
          VALIDATOR_PID=$!
          trap 'kill $VALIDATOR_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            solana -u http://127.0.0.1:8899 cluster-version >/dev/null 2>&1 && break
            sleep 2
          done
          solana -u http://127.0.0.1:8899 cluster-version
          solana -u http://127.0.0.1:8899 airdrop 100 || true
          solana -u http://127.0.0.1:8899 program deploy \
            --program-id target/deploy/tegridy_launch-keypair.json \
            target/deploy/tegridy_launch.so
          yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/tegridy-launch-constraints.test.ts
