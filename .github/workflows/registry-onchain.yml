name: Address Registry — chain read

# The registry's OFFLINE checks (structure, truncation, duplicates, denylist,
# drift against constants.ts) run on every push in ci.yml. This is the other
# half: does the chain agree with what the registry SAYS?
#
# It did not run anywhere. `verify-addresses.mjs --onchain` existed, and no
# workflow ever passed the flag — and had one, it could not have failed:
# every disagreement was a `warn()` (warnings do not affect the exit code) and
# every RPC error was swallowed by `catch { console.log('(unreadable)') }`.
# Both halves are fixed in the script; this is the pipeline it was missing.
#
# WHY NOT ON EVERY PR: this reads mainnet over the network. A PR that touches
# no addresses should not be blocked because an operator wallet ran dry or a
# public RPC hiccuped. It runs daily, on demand, and on any change to the
# registry or to the constants it mirrors.
#
# ⚠ THIS IS EXPECTED TO BE RED ON ITS FIRST RUN, and that is the point. As of
# 2026-08-12 the registry's `deploy-authority`
# (Dcjink4RGNUBpRVV4AX8mzxNLpUF2ik5h8Em6usv7kZ7) is recorded as "live, funded
# … 3.53 SOL left" and does not exist on mainnet — zero lamports, confirmed
# against two independent RPCs. Per its own registry note it is the only
# signer that can call initialize_global. Either fund it, or correct the
# registry. Do not silence the check.

on:
  schedule:
    - cron: "41 6 * * *" # daily 06:41 UTC
  workflow_dispatch: {}
  push:
    branches: [main, mvp-launch]
    paths:
      - "frontend/scripts/addresses.json"
      - "frontend/scripts/verify-addresses.mjs"
      - "frontend/src/lib/constants.ts"
      - ".github/workflows/registry-onchain.yml"
  # NO `paths:` HERE, deliberately — see the `scope` job. A workflow-level
  # path filter on a pull_request is what forced the `-not-applicable.yml`
  # shim, and the shim is what let a failing gate be reported as a pass.
  pull_request:
    branches: [main, mvp-launch]

permissions:
  contents: read

concurrency:
  # PRs share a group and cancel; TRUNK COMMITS EACH GET THEIR OWN GROUP (keyed
  # on github.sha). Sharing one group on trunk meant each merge killed the run
  # before it -- on the branch that deploys. Making cancel-in-progress
  # conditional was NOT enough: it only governs a run already in progress, and a
  # run still queued in an occupied group is pending, which GitHub evicts
  # unconditionally. A pending kill creates zero jobs and so zero check-runs,
  # which made the starvation invisible as well as unfixed. See ci.yml for the
  # full write-up.
  group: registry-onchain-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── which jobs are in scope for this diff ──────────────────────────────────
  #
  # This job replaces `registry-onchain-not-applicable.yml`. That shim published a SECOND
  # check run under this workflow's name whenever a PR touched both the address registry and
  # anything else, and GitHub does not resolve a duplicated name the way the
  # shim's comment assumed. Measured on PR #205, where two of these pairs
  # doubled at once: `Slither / Static analysis` had a FAILING 4-minute analysis
  # and a passing 2-second shim, and only the pass appeared in the PR's check
  # list; `all-tests-pass` was doubled too and agreed by luck.
  #
  # So the filter moved here. The workflow now triggers on every PR — exactly one
  # check run under this name ever exists — and this job decides whether the real
  # work runs. A job skipped by `if:` reports success to branch protection, which
  # is what the shim was for.
  scope:
    name: scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.q.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Does this diff touch the address registry?
        id: q
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          # EVERY uncertain path below answers `true`. A wrong `true` costs CI
          # minutes; a wrong `false` skips the gate AND reports success for
          # having done so, which is the failure this job exists to end.
          say() { echo "run=$1" >> "$GITHUB_OUTPUT"; exit 0; }

          # A `push` reached this workflow through its own `paths:` filter, so it
          # is already known to be in scope.
          [ -n "${PR:-}" ] || { echo "not a pull_request — in scope by trigger"; say true; }

          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')
          if [ -z "$files" ]; then
            echo "::warning::could not list this PR's changed files — running the real job"
            say true
          fi
          # `pulls/{n}/files` truncates at 3000. A truncated list can only make a
          # skip look justified, so refuse to narrow on one.
          if [ "$(printf '%s\n' "$files" | wc -l)" -ge 3000 ]; then
            echo "::warning::changed-file list is at the API cap — running the real job"
            say true
          fi

          verdict=$(printf '%s\n' "$files" | node .github/scripts/diff-scope.mjs \
            'frontend/scripts/addresses.json' \
            'frontend/scripts/verify-addresses.mjs' \
            'frontend/src/lib/constants.ts' \
            '.github/workflows/registry-onchain.yml')
          case "$verdict" in
            true|false) say "$verdict" ;;
            *) echo "::warning::diff-scope returned '$verdict' — running the real job"; say true ;;
          esac

  chain-read:
    name: registry vs chain
    needs: scope
    if: >-
      !cancelled() &&
      (needs.scope.result != 'success' || needs.scope.outputs.run == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --ignore-scripts

      # Offline first. If the registry does not even parse, a chain read is
      # noise — and this is the check that caught the fabricated 33-byte
      # "Solana address" the whole script exists for.
      - name: Registry structure (offline)
        run: node scripts/verify-addresses.mjs

      # Keyless public endpoints, both verified serving real reads. Overridable
      # so an operator can point at a paid endpoint when the public ones throttle.
      # Bound through env:, never spliced into the script.
      - name: Registry vs live chain state
        env:
          SOLANA_RPC: ${{ vars.SOLANA_RPC || 'https://api.mainnet-beta.solana.com' }}
          ETH_RPC: ${{ vars.ETH_RPC || 'https://ethereum-rpc.publicnode.com' }}
        run: |
          set -euo pipefail
          node scripts/verify-addresses.mjs --onchain | tee /tmp/onchain.txt

      # `tee` above means the node exit code reaches the step through
      # pipefail. This is the belt: the report has to actually contain the
      # chain section, so a script that silently stops reading — an early
      # return, a renamed flag — cannot pass as "no disagreements found".
      - name: Assert the chain was actually read
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          grep -q 'live chain state' /tmp/onchain.txt || {
            echo "::error title=No chain read happened::verify-addresses.mjs --onchain produced no chain section. A green run here would mean 'nothing was checked', not 'nothing is wrong'."
            exit 1
          }

          # Second belt, for the case the first one cannot see. The script now
          # SKIPS addresses the RPC did not answer for — the right call, because a
          # rate-limited endpoint must not turn a correct registry red — but a run
          # where EVERY address was skipped still prints the section header and
          # still exits 0. That is the same "green means nothing was checked" hole
          # the grep above exists to close, one level down.
          #
          # Partial skips are tolerated and reported. A total skip is not: it means
          # this job verified nothing at all, and it should say so rather than pass.
          # Deliberately not `read < <(...)`: under `set -e` a failing read exits
          # the step before the error message below can explain why.
          coverage=$(sed -n 's/.*chain read: \([0-9]\{1,\}\) considered, \([0-9]\{1,\}\) NOT CHECKED.*/\1 \2/p' /tmp/onchain.txt | tail -1 || true)
          considered=${coverage%% *}
          skipped=${coverage##* }
          if [ -z "${coverage:-}" ]; then
            echo "::error title=No coverage line::the chain section printed no 'chain read: N considered, M NOT CHECKED' line, so this run cannot say what it verified."
            exit 1
          fi
          if [ "$considered" -gt 0 ] && [ "$skipped" -ge "$considered" ]; then
            echo "::error title=Nothing was actually checked::all $considered addresses were skipped because the RPC did not answer. This run verified NOTHING; it is not evidence the registry is correct. Re-run, or set the SOLANA_RPC / ETH_RPC repo variables to keyed endpoints."
            exit 1
          fi
          if [ "$skipped" -gt 0 ]; then
            echo "::warning title=Partial chain read::$skipped of $considered addresses were NOT CHECKED (the RPC did not answer). Those addresses are unverified by this run."
          fi
          {
            echo "### Address registry — chain read"
            echo ""
            echo '```'
            sed -n '/live chain state/,$p' /tmp/onchain.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
