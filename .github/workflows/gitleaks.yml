name: Gitleaks

# Secret scan on every push + PR. Added after the 2026-06-07 post-deploy red-team
# found a live Etherscan key committed into a tracked audit doc (.audit_101/*).
# Since audit artifacts are intentionally tracked, scan-on-commit is the right
# guard. gitleaks-action scans the push/PR commit range (not full history), so it
# catches NEW secrets without blocking on the already-known historical leak
# (which is remediated by rotating the key, not by this scan).
on:
  push:
    branches: [main, mvp-launch]
  pull_request:
    branches: [main, mvp-launch]

permissions:
  contents: read

concurrency:
  # PRs share a group and cancel; TRUNK COMMITS EACH GET THEIR OWN GROUP (keyed
  # on github.sha). Sharing one group on trunk meant each merge killed the run
  # before it -- on the branch that deploys. Making cancel-in-progress
  # conditional was NOT enough: it only governs a run already in progress, and a
  # run still queued in an occupied group is pending, which GitHub evicts
  # unconditionally. A pending kill creates zero jobs and so zero check-runs,
  # which made the starvation invisible as well as unfixed. See ci.yml for the
  # full write-up.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          # gitleaks-action@v2 hard-requires GITHUB_TOKEN on pull_request events
          # (it fetches the PR's commit list via the API before scanning). Without
          # it every PR run dies at startup — push runs were unaffected, which is
          # why this went unnoticed on a push-heavy repo. Read-only default token.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
