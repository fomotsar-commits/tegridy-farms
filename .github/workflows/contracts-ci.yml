name: Contracts CI

on:
  push:
    branches: [main, mvp-launch]
    paths:
      - "contracts/**"
      - "scripts/check-interface-selectors.mjs"
      - "scripts/check-test-slice-coverage.mjs"
      - "frontend/scripts/extract-missing-abis.mjs"
      - ".github/contracts-test-slices.json"
      # The selector guard reads both of these: contracts.ts holds the
      # hand-rolled ABIs it checks, constants.ts the address exports that tell
      # an in-repo target from a third-party one. Without them here a
      # frontend-only ABI edit — the exact shape of the drift this guard
      # exists to catch — would never trigger this workflow.
      - "frontend/src/lib/contracts.ts"
      - "frontend/src/lib/constants.ts"
      - ".github/workflows/contracts-ci.yml"
  pull_request:
    branches: [main, mvp-launch]
    paths:
      - "contracts/**"
      - "scripts/check-interface-selectors.mjs"
      - "scripts/check-test-slice-coverage.mjs"
      - "frontend/scripts/extract-missing-abis.mjs"
      - ".github/contracts-test-slices.json"
      # The selector guard reads both of these: contracts.ts holds the
      # hand-rolled ABIs it checks, constants.ts the address exports that tell
      # an in-repo target from a third-party one. Without them here a
      # frontend-only ABI edit — the exact shape of the drift this guard
      # exists to catch — would never trigger this workflow.
      - "frontend/src/lib/contracts.ts"
      - "frontend/src/lib/constants.ts"
      - ".github/workflows/contracts-ci.yml"

# Least-privilege default — contracts CI only reads source and caches.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Build + bytecode-size budget. Single-job — produces the artifacts
  # the test matrix consumes. Fast (~2 min); shared across all matrix
  # slices via the `actions/cache` key on lib/foundry.toml hashes.
  # ─────────────────────────────────────────────────────────────────────
  build:
    name: forge build + size budget
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Checkout
        # AUDIT R056: SHA-pinned (was @v4 floating).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@de808b1eea699e761c404bda44ba8f21aba30b2c # v1.3.1
        with:
          version: stable

      - name: Cache forge deps
        # CI fix 2026-05-17: bumped from v4.0.2 SHA (deprecated by GitHub per
        # https://github.blog/changelog/2024-12-05-notice-of-upcoming-releases-and-breaking-changes-for-github-actions/)
        # to v4.2.0 SHA. Keeps SHA pinning for supply-chain safety while staying
        # on the supported v4 line.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            contracts/cache
            contracts/out
          key: foundry-${{ hashFiles('contracts/foundry.toml', 'contracts/remappings.txt', 'contracts/lib/**') }}

      - name: Show forge version
        run: forge --version

      # Build src only (--skip test --skip script): keeps this step cheap
      # so the matrix below can spin up quickly. Each matrix slice does its
      # own incremental test compile.
      # CI fix 2026-05-17: --skip test --skip script so this step compiles
      # ONLY src/ artifacts. Pre-fix, this recompiled every test AND script
      # too, doubling CI compile time and triggering 16-minute OOM kills on
      # the 7GB hosted runner.
      - name: Build
        run: forge build --skip test --skip script

      # AUDIT FIX: EIP170-01/02/03 — size-budget guard (full rationale block
      # preserved from the pre-matrix workflow at the same code shape).
      - name: Bytecode size budget (24,000-byte floor with 576-byte EIP-170 headroom)
        run: |
          set -e
          BUDGET=24000
          # The actual EVM ceiling. Nothing not explicitly deferred may cross this.
          EIP170=24576
          FAIL=0
          #
          # TWO-TIER ALLOWLIST (ported from main #99, 2026-07-24; sizes re-measured
          # against THIS branch's artifacts — mvp-launch did NOT take #99's
          # TegridyStaking bytecode reclaim, so its allowlist differs from main's).
          #
          # A single flat EXCEPTIONS list softens the check at BOTH thresholds: an
          # allowlisted contract that grows past the real 24,576-byte EIP-170 limit
          # still only warns, so it can become UNDEPLOYABLE without failing CI. That
          # is exactly how TegridyStaking drifted to 24,569 B on main (7 B headroom)
          # while CI stayed green. Split in two so the allowlist can only ever soften
          # the conservative FLOOR, never the EVM limit.
          #
          # FLOOR_EXCEPTIONS — between BUDGET and EIP170. Deployable today; over the
          #   conservative floor only. Warning.
          #   TegridyStaking — 24,337 B (measured 2026-07-24): 239 B under EIP-170.
          #     On main #99 reclaimed 573 B and took it off the list; that ABI-surface
          #     golf is NOT on mvp-launch, so here it stays a floor-exception. Tightest
          #     path after VoteIncentives — extract to StakingViewLib on further growth.
          #   VoteIncentives — 24,274 B (measured 2026-07-24): 302 B under EIP-170.
          #     Admin-function split into VoteIncentivesAdmin is the eventual fix.
          #
          # OVER_EIP170_DEFERRED — genuinely OVER EIP-170 and therefore undeployable
          #   by construction. Every entry MUST also be absent from every deploy path
          #   (DeployMVP / VerifyMVP). Adding a name here defers a contract nobody can
          #   ship — it is NOT a way to silence a launch blocker on a deploy-path one.
          #   TegridyRestaking — 26,760 B (measured 2026-07-24). Removed from
          #     DeployMVP/VerifyMVP; stays until its Phase-7 library split.
          #
          # The VerifyMVP.s.sol deploy-gate is the real pre-launch EIP-170 enforcement.
          FLOOR_EXCEPTIONS="TegridyStaking VoteIncentives"
          OVER_EIP170_DEFERRED="TegridyRestaking"
          for f in out/*.sol/*.json; do
            name=$(basename "$f" .json)
            case "$name" in
              *Test|*Mock|*Script|*Setup|*Harness) continue ;;
            esac
            size=$(jq -r '.deployedBytecode.object // empty' "$f" | sed 's/0x//' | wc -c)
            size=$((size / 2))
            if [ "$size" -gt "$EIP170" ]; then
              # HARD GATE: over the EVM limit. Only an explicit deferral may warn.
              if echo " $OVER_EIP170_DEFERRED " | grep -q " $name "; then
                echo "::warning file=contracts/src/${name}.sol::Bytecode ${size}B EXCEEDS EIP-170 (${EIP170}B) — deferred/undeployable, must stay off every deploy path"
              else
                echo "::error file=contracts/src/${name}.sol::Bytecode ${size}B EXCEEDS EIP-170 (${EIP170}B) — UNDEPLOYABLE. Extract to a library or a read-only sister contract."
                FAIL=1
              fi
            elif [ "$size" -gt "$BUDGET" ]; then
              if echo " $FLOOR_EXCEPTIONS $OVER_EIP170_DEFERRED " | grep -q " $name "; then
                echo "::warning file=contracts/src/${name}.sol::Bytecode ${size}B > floor ${BUDGET}B (under EIP-170; split pending)"
              else
                echo "::error file=contracts/src/${name}.sol::Bytecode ${size}B > budget ${BUDGET}B (EIP-170 limit ${EIP170})"
                FAIL=1
              fi
            fi
          done
          if [ "$FAIL" -ne 0 ]; then
            echo "❌ One or more contracts exceed the bytecode size budget."
            exit 1
          fi
          echo "✅ All contracts within size budget (${BUDGET}B floor, ${EIP170}B EIP-170 ceiling)."

      # ─────────────────────────────────────────────────────────────────
      # Interface selector guard (ported from main #100/#102, 2026-07-24).
      # A Solidity `interface` is NEVER checked against the contract it is
      # pointed at: if the deployed callee lacks a declared selector, the
      # code COMPILES CLEANLY and then reverts at runtime with EMPTY
      # RETURNDATA (no matching selector, no fallback) — a bare
      # `EvmError: Revert` easily misread as gas or arithmetic.
      #
      # This is the standing hazard of the EIP-170 golf above: lowering a
      # function `external -> internal` to reclaim bytecode silently drops
      # it from the ABI. On main it bricked `CommunityGrants.createProposal`
      # when `userPositionCount` was demoted (fixed in #100). Its first run
      # on THIS branch (2026-07-24) also found four dead interface
      # declarations mvp-launch still carried that main had already pruned
      # (IVotingEscrow.totalLocked, IVotingEscrowGrants.{totalLocked,
      # votingPowerAt}, IStakingVote.votingPowerAt) — never called, so no
      # live brick, but exactly the latent footgun this guard removes; they
      # were deleted in this commit.
      #
      # Phase 2 (added 2026-07-28) extends the same artifact comparison to the
      # HAND-ROLLED ABIs in frontend/src/lib/contracts.ts, which had no drift
      # guard at all: check-interface-selectors covered Solidity interfaces and
      # the ABI drift gate below covers only the GENERATED abi-supplement.ts.
      # PR #123 had to remove three selectors that slipped through that gap
      # (SwapFeeRouter.totalSwaps, TegridyStaking.totalLocked, and
      # LPFarming.notifyRewardAmount(uint256) — the deployed farm takes
      # (uint256,uint256)). Phase 2's first run found three more, all now
      # resolved. A frontend ABI is the worse case: viem encodes the declared
      # selector without consulting the chain, so drift ships to users as a
      # dead button rather than failing a build.
      #
      # NOTE the paths filter at the top of this file must keep listing
      # frontend/src/lib/{contracts,constants}.ts, or a frontend-only ABI edit
      # will not trigger this workflow and the guard will not run.
      #
      # Runs off the artifacts the Build step just produced — Node is
      # preinstalled on ubuntu-latest and the script has zero npm deps. cwd
      # is `contracts` (the job default), so the script lives one level up.
      - name: Interface + frontend ABI selector guard
        run: node ../scripts/check-interface-selectors.mjs

      # ABI drift gate — closes the MEDIUM at
      # .audit_101/legacy/audit_findings.md:138 ("no CI guard that the generated
      # ABI matches the committed one"). frontend/src/lib/contracts.ts does
      # `export * from './abi-supplement'`, so a stale abi-supplement.ts ships
      # straight to the client surface with no compile error to catch it.
      #
      # Added 2026-07-23 after this gate, run for the first time, found the
      # committed file carrying only 53 of 147 TegridyTWAP entries plus a
      # phantom `NotOwner` error that OZ Ownable2Step had already replaced with
      # `OwnableUnauthorizedAccount`. Nothing was user-visibly broken — the sole
      # consumer, useToweliPrice.ts, calls `consult`, whose signature was
      # unchanged — but that is luck, not a guarantee.
      #
      # Runs here because `out/` is already built by the Build step above. The
      # generator uses only Node builtins, so no `npm ci` is needed. It now
      # fail-closes on a missing artifact rather than writing a truncated file,
      # so a partial build shows up as a hard error, not a silent gutting.
      # Deliberately NOT auto-committing: a diff means a human should look at
      # which ABI changed and why.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: ABI supplement drift guard
        working-directory: .
        run: |
          set -e
          node frontend/scripts/extract-missing-abis.mjs
          if ! git diff --quiet -- frontend/src/lib/abi-supplement.ts; then
            echo "::error file=frontend/src/lib/abi-supplement.ts::abi-supplement.ts is stale vs contracts/src. Regenerate: (cd contracts && forge build) && npm run extract-abis"
            echo "── drift ──"
            git diff -- frontend/src/lib/abi-supplement.ts
            exit 1
          fi
          echo "✅ abi-supplement.ts matches the compiled contract artifacts."

  # ─────────────────────────────────────────────────────────────────────
  # Test-slice manifest + coverage guard.
  #
  # The matrix below is NOT written inline any more. It is generated from
  # .github/contracts-test-slices.json, and the same script that generates
  # it asserts that every contracts/test/**/*.t.sol is claimed by exactly
  # one slice or by an explicit `excluded` entry.
  #
  # Restructured 2026-07-28 after the second occurrence of the same silent
  # failure. The first (2026-05-23) was regex-vs-glob: every pattern matched
  # zero files, forge exited 0 on "No tests found in project!", and all six
  # jobs went green while running nothing. The second was subtler and lived
  # for seven weeks: every pattern is `test/<prefix>*.t.sol`, which requires
  # <prefix> IMMEDIATELY after `test/` — a path like `test/v4/Audit…` continues
  # `v4/`, so no subdirectory was reachable. (The star is not the culprit:
  # forge leaves globset's literal_separator off, so `*` DOES cross `/` —
  # `test/*Invariants.t.sol` matches all 7 files under test/invariants/.
  # Verified against forge 1.5.1; an earlier version of this comment and of
  # the guard's matcher both claimed the opposite.) The casualties were
  # test/v4/ (42 tests), test/pass5_pocs/ (4) plus ten top-level files whose
  # prefixes were never added to a brace list (80 tests) simply did not run.
  # TegridyV4Hook.t.sol::test_admin_discountConfigTimelockFlow had been red
  # since 38aaad2 (2026-06-07) and nothing reported it.
  #
  # The guard has to live outside forge because forge itself cannot signal
  # this: an empty match is exit 0, not a failure. Keeping the patterns in
  # the manifest rather than inline here is the point — a guard holding its
  # own private copy of the pattern list can pass while the matrix that
  # actually runs is empty.
  #
  # This job needs no Foundry and no npm install (Node builtins only), so it
  # finishes in seconds and gates the matrix that follows.
  # ─────────────────────────────────────────────────────────────────────
  slices:
    name: test-slice coverage guard
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.emit.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Every test file is sliced or explicitly excluded
        run: node scripts/check-test-slice-coverage.mjs

      - name: Emit matrix
        id: emit
        run: |
          set -euo pipefail
          # Assign first, THEN echo. `echo "k=$(cmd)"` swallows cmd's exit status
          # even under `set -e`, which would write an empty matrix and hand the
          # test job a `fromJSON('')` failure instead of this job's error.
          # Each matrix entry carries its own resolved `noMatchTest`, so the test
          # job never has to know which slices override the shared default.
          MATRIX="$(node scripts/check-test-slice-coverage.mjs --emit-matrix)"
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          echo "matrix: ${MATRIX}"

  # ─────────────────────────────────────────────────────────────────────
  # Test matrix — splits the .t.sol suite across the slices declared in
  # .github/contracts-test-slices.json so each fits comfortably under the
  # ubuntu-latest 15-minute SIGTERM watchdog. Slices run in PARALLEL, so
  # wall-clock = max(slice times).
  #
  # CI fix 2026-05-18: pre-fix, a single Test step ran the entire suite
  # serially and consistently SIGTERM'd at ~15 min (exit 143). Prior
  # mitigations (skip invariants, skip fuzz, lower FUZZ_RUNS 10000→256,
  # drop -vvv) bought time but the suite kept growing past budget. The
  # documented "real fixes" were (a) self-hosted runner, (b) parallel-
  # jobs refactor, (c) GHE larger-runner entitlement. This change picks
  # (b) — no new infra, no cost.
  #
  # Slice balance is printed by the guard job above on every run, so it is
  # never stale here. (The table that used to live in this comment had
  # drifted badly — it claimed pass-r-series carried 28 files when the real
  # figure was 6.)
  #
  # Slices exclude invariant/fuzz tests BY TEST NAME via the manifest's
  # shared `--no-match-test`. Note that this is a name filter, not a path
  # filter: a file can be inside a slice and still contribute zero runnable
  # tests (test/FuzzInvariant.t.sol is exactly that). The per-slice guard
  # below asserts the slice TOTAL is non-zero.
  #
  # The `invariants` slice OVERRIDES that filter — the shared default would
  # strip every test it exists to run. Its 37 tests had never been executed
  # by any pipeline before this; they pass. See the timing note on the Test
  # step for why they need a tuned invariant budget to fit the runner.
  # ─────────────────────────────────────────────────────────────────────
  test:
    name: forge test — ${{ matrix.slice }}
    needs: [build, slices]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.slices.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@de808b1eea699e761c404bda44ba8f21aba30b2c # v1.3.1
        with:
          version: stable

      - name: Restore forge cache
        # Same cache key as the build job — restores src compilation so the
        # test step only needs to compile this slice's test files.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            contracts/cache
            contracts/out
          key: foundry-${{ hashFiles('contracts/foundry.toml', 'contracts/remappings.txt', 'contracts/lib/**') }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      # ─────────────────────────────────────────────────────────────────
      # Non-zero-test guard, plus a fidelity check on the coverage guard.
      #
      # `forge test` EXITS 0 when its selection is empty ("No tests found in
      # project!"). That single behaviour is the root cause of both silent
      # matrix failures this repo has had, so the slice's test count has to
      # be asserted separately from the run's exit code.
      #
      # Two assertions, from `forge test --list --json` (forge's own answer,
      # not a reimplementation of its glob):
      #   1. the FILE SET forge matches equals what the coverage guard
      #      predicted — this is what keeps the guard's glob subset honest
      #      against forge's `globset`; a matcher that over-claims would
      #      otherwise let the coverage job pass over an empty matrix;
      #   2. the slice yields at least one runnable test after the shared
      #      `--no-match-test` name filter.
      #
      # `--list` compiles, so this warms the same build the run below reuses;
      # the marginal cost is one extra forge startup.
      #
      # `working-directory: .` is workspace-relative and overrides this job's
      # `contracts` default — same shape as the ABI drift guard in `build`.
      # The script re-roots itself at contracts/ before invoking forge.
      # ─────────────────────────────────────────────────────────────────
      - name: Slice guard (${{ matrix.slice }})
        working-directory: .
        run: node scripts/check-test-slice-coverage.mjs --verify-slice "$SLICE_NAME"
        env:
          SLICE_NAME: ${{ matrix.slice }}

      - name: Test (${{ matrix.slice }})
        # Each slice runs only its own test files (`--match-path` GLOB — not a
        # regex; see the manifest's _readme) under its OWN `--no-match-test`,
        # resolved in the manifest and carried on the matrix entry.
        #
        # FOUNDRY_FUZZ_RUNS: 256 is the Foundry default; matches the locally-
        # validated config.
        #
        # FOUNDRY_INVARIANT_* are load-bearing for the `invariants` slice, and
        # the values are measured, not guessed. This suite (37 tests, 13 files),
        # all three settings 37/37 PASS:
        #   forge defaults       632s wall / 7,059s CPU
        #   32 runs x 256 depth   13.2s wall /   144s CPU   <- chosen
        #   32 runs x  64 depth    2.3s wall /    24s CPU
        # Stock defaults do NOT fit: 7,059s of CPU only finished in 632s on an
        # ~11-core dev box, so a 2-core ubuntu-latest needs ~59 min — four times
        # the 15-minute SIGTERM budget. Nothing in foundry.toml sets an
        # [invariant] profile, so anything naive inherits exactly that.
        # Depth 256 costs ~1 min of execution on 2 cores (the slice's compile
        # step alone is ~2m12s, so this is not the bottleneck) and buys 8,192
        # calls per invariant instead of 2,048. Depth 64 was the first cut and
        # was raised once measured — a shallow invariant run that always passes
        # is the same false-green this guard exists to prevent.
        # These vars only bite on slices that actually contain invariant tests.
        #
        # PATTERN and FILTER come through `env:`, NOT `${{ }}` inline in the
        # script. `${{ }}` is textual substitution performed BEFORE bash parses
        # the script, so a manifest value is shell source, not data:
        #   value `(Fuzz|$HOME)`  -> bash expands it; forge receives
        #                            `(Fuzz|/home/runner)`, while the guard
        #                            (execFile, no shell) verified the LITERAL.
        #                            The guard's whole promise — "what I check is
        #                            what CI runs" — silently stops holding.
        #   value containing `"`  -> closes the quote and the rest executes.
        # Via `env:` the value reaches bash as data and `"$VAR"` passes it
        # verbatim, so guard and run agree by construction.
        run: |
          forge test \
            --match-path "$SLICE_PATTERN" \
            --no-match-test "$SLICE_NO_MATCH_TEST"
        env:
          SLICE_PATTERN: ${{ matrix.pattern }}
          SLICE_NO_MATCH_TEST: ${{ matrix.noMatchTest }}
          FOUNDRY_FUZZ_RUNS: 256
          FOUNDRY_INVARIANT_RUNS: 32
          FOUNDRY_INVARIANT_DEPTH: 256

      - name: Coverage summary (best-effort, disabled in PR-blocking CI)
        # CI fix 2026-05-17: forge coverage on this codebase takes 15-30 min
        # on the ubuntu-latest runner and blocks the job from completing
        # even with continue-on-error: true (the step itself doesn't exit
        # until coverage finishes regardless of pass/fail status). Disabled
        # for PR-blocking CI; runs on the nightly cron with full coverage.
        if: ${{ false }}
        run: forge coverage --report summary || true
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────
  # Required-status aggregator. Branch-protection rules can point at THIS
  # check name ("Contracts CI / all-tests-pass") instead of each matrix
  # slice — adding a new slice doesn't require updating branch protection.
  # ─────────────────────────────────────────────────────────────────────
  all-tests-pass:
    name: all-tests-pass
    needs: [build, slices, test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Aggregate matrix result
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "Build job: ${{ needs.build.result }}"
            exit 1
          fi
          # `slices` gates the matrix. If it fails the `test` job is SKIPPED,
          # and a skipped matrix must never read as success here — that is the
          # same "green over nothing" shape the guard exists to prevent.
          if [ "${{ needs.slices.result }}" != "success" ]; then
            echo "Test-slice coverage guard: ${{ needs.slices.result }}"
            exit 1
          fi
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Test matrix: ${{ needs.test.result }} (any slice failed or was skipped)"
            exit 1
          fi
          echo "✅ All matrix slices passed"
