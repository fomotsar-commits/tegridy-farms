name: Contracts CI

on:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - ".github/workflows/contracts-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "contracts/**"
      - ".github/workflows/contracts-ci.yml"

# Least-privilege default — contracts CI only reads source and caches.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: forge build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts

    steps:
      - name: Checkout
        # AUDIT R056: SHA-pinned (was @v4 floating).
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@de808b1eea699e761c404bda44ba8f21aba30b2c # v1.3.1
        with:
          version: stable

      - name: Cache forge deps
        # CI fix 2026-05-17: bumped from v4.0.2 SHA (deprecated by GitHub per
        # https://github.blog/changelog/2024-12-05-notice-of-upcoming-releases-and-breaking-changes-for-github-actions/)
        # to v4.2.0 SHA. Keeps SHA pinning for supply-chain safety while staying
        # on the supported v4 line.
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            contracts/cache
            contracts/out
          key: foundry-${{ hashFiles('contracts/foundry.toml', 'contracts/remappings.txt', 'contracts/lib/**') }}

      - name: Show forge version
        run: forge --version

      # Build without --sizes so the over-EIP-170 contracts (Phase 0 split
       # pending) don't fail before the budget step gets a chance to apply
       # the temporary tracked-exceptions allowlist. Real compilation errors
       # still block CI here. Size enforcement happens in the next step.
      - name: Build
        run: forge build

      # AUDIT FIX: EIP170-01/02/03 — size-budget guard.
      # The 2026-04-26 size-reduction sprint that produced *Admin sister-contracts
      # has since regressed: TegridyLending +2666 bytes, TegridyStaking +2336,
      # VoteIncentives +1401 — all over EIP-170 (24576). `forge build --sizes`
      # already errors on overflow but `code_size_limit` in foundry.toml could
      # mask it; this step is the belt-and-suspenders enforcement and applies a
      # safety floor of 24,000 bytes (576-byte headroom for next features).
      #
      # Phase 0 history (all complete as of 2026-05-06):
      #   - Phase 0.1 TegridyLending split → 2026-05-05 (batch 4)
      #   - Phase 0.3 VoteIncentives split → 2026-05-05 (batch 5)
      #   - Phase 0.4 TegridyRestaking visibility trim → 2026-05-05 (batch 6)
      #   - Phase 0.2 TegridyStaking → 2026-05-06 (batch 14):
      #       - Solady ERC721 swap (–621 B)
      #       - JBAC sister-vault split (–712 B)
      #       - Inlined JBAC capture+return into _clearPosition (–80 B)
      #       - supportsInterface trim (–27 B; no longer IERC721Receiver)
      #       - optimizer_runs 10 → 1 (–15 B)
      #       - Lowered 7 unread/admin-only public constants to internal
      #         (BPS, BOOST_PRECISION, MIN_NOTIFY_AMOUNT, MIN_STAKE,
      #         TRANSFER_COOLDOWN, TRANSFER_RATE_LIMIT, EMERGENCY_EXIT_DELAY,
      #         USER_INACTIVITY_GATE, MAX_POSITIONS_PER_HOLDER,
      #         ADMIN_REPLACEMENT_TIMELOCK, EXTEND_FEE_BPS_CEILING) → −280 B
      #         total auto-getter bytecode reclaimed
      #       Final: 24,544 B (32 B under EIP-170 24,576).
      # All Phase 0 contracts now mainnet-deployable. Exception list is empty.
      - name: Bytecode size budget (24,000-byte floor with 576-byte EIP-170 headroom)
        run: |
          set -e
          BUDGET=24000
          FAIL=0
          # AUDIT FIX (pass-8 batch-14): TegridyStaking is at 24,544 B — 32 B
          # under EIP-170 (24,576) but 544 B over the local 24,000-byte floor.
          # The Phase 0.2 reductions exhausted the available trims; future
          # features must either (a) extract more state, (b) accept further
          # ABI cuts (more public→internal constants), or (c) split into a
          # second sister contract. Until then, this is the documented
          # "hugging the line" exception.
          EXCEPTIONS="TegridyStaking"
          for f in out/*.sol/*.json; do
            name=$(basename "$f" .json)
            # Skip test/script/lib artifacts — only enforce on src/ contracts.
            case "$name" in
              *Test|*Mock|*Script|*Setup|*Harness) continue ;;
            esac
            size=$(jq -r '.deployedBytecode.object // empty' "$f" | sed 's/0x//' | wc -c)
            size=$((size / 2))
            if [ "$size" -gt "$BUDGET" ]; then
              if echo " $EXCEPTIONS " | grep -q " $name "; then
                echo "::warning file=contracts/src/${name}.sol::Bytecode ${size}B > budget ${BUDGET}B (Phase 0 split pending)"
              else
                echo "::error file=contracts/src/${name}.sol::Bytecode ${size}B > budget ${BUDGET}B (EIP-170 limit 24576)"
                FAIL=1
              fi
            fi
          done
          if [ "$FAIL" -ne 0 ]; then
            echo "❌ One or more contracts exceed the bytecode size budget."
            exit 1
          fi
          echo "✅ All contracts within size budget (${BUDGET}B floor, 576B headroom)."

      - name: Test
        run: forge test -vvv
        env:
          # FRESH-EYES CI: 10000 runs catch invariant edge-cases that the
          # default 256 misses (boundary arithmetic, slot collisions).
          # forge test itself MUST NOT carry continue-on-error — failures
          # block merge. Coverage step below is allowed to be best-effort.
          FOUNDRY_FUZZ_RUNS: 10000

      - name: Coverage summary (best-effort)
        run: forge coverage --report summary || true
        continue-on-error: true
