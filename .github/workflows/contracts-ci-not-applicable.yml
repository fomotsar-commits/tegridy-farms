name: Contracts CI

# COMPANION WORKFLOW — DO NOT RENAME EITHER `name:` ABOVE OR THE JOB BELOW.
#
# THE BUG THIS FIXES. contracts-ci.yml filters `pull_request` by
# `paths: [contracts/**, …]`, and its own comment names
# "Contracts CI / all-tests-pass" as the check branch protection should
# require. Those two facts are incompatible. A PR that touches only frontend/
# never triggers contracts-ci.yml, so no check run with that name is ever
# created, so a required-status-check rule sits at "Expected — waiting for
# status to be reported" forever and the PR cannot merge. The failure looks
# like an outage, gets diagnosed as a flake, and ends with someone removing
# the requirement — which is how a repo loses its contract gate.
#
# THE FIX (GitHub's documented "skipped but required" recipe): a second
# workflow with the SAME workflow name and the SAME job name, triggered on the
# inverse of the filter, that reports the same check as a pass. Both names are
# the wire format — the check context is built from them, so renaming either
# silently unsolders the fix.
#
# ON THE OVERLAP. `paths-ignore` is not the exact complement of `paths`:
# GitHub runs a `paths` workflow when ANY changed file matches and a
# `paths-ignore` workflow when ANY changed file does not, so a PR touching both
# contracts/ and frontend/ triggers both files and two check runs share the
# name. That is safe here only because of finish order — this job is a single
# echo and reports in seconds, while contracts-ci.yml's matrix takes tens of
# minutes, so the real verdict is always the last one written. Never add a
# slow step, a `needs:`, or a matrix to this job; the moment it can finish
# after the real workflow it becomes a mechanism for masking a red build.
#
# THIS WORKFLOW IS NOT BRANCH PROTECTION. Arming the requirement is a GitHub
# settings action and stays with the operator; this only makes the check
# reportable so the requirement can be armed at all.

on:
  pull_request:
    branches: [main, mvp-launch]
    paths-ignore:
      - "contracts/**"
      - "scripts/check-interface-selectors.mjs"
      - "scripts/check-test-slice-coverage.mjs"
      - "frontend/scripts/extract-missing-abis.mjs"
      - ".github/contracts-test-slices.json"
      - "frontend/src/lib/contracts.ts"
      - "frontend/src/lib/constants.ts"
      - ".github/workflows/contracts-ci.yml"

permissions:
  contents: read

jobs:
  all-tests-pass:
    name: all-tests-pass
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: No contract surface in this diff
        run: echo "contracts-ci.yml does not apply to this change set; reporting its required check as satisfied."
