name: Supabase Backup

# Weekly encrypted snapshot of every Supabase table the app writes.
#
# WHY THIS EXISTS: signed Seaport orders (native_orders, trade_offers) are
# BEARER INSTRUMENTS — the signature in the row is the only copy. If the
# Supabase project is paused/deleted/corrupted, this backup is what lets
# makers see and CANCEL their still-valid on-chain-fulfillable orders
# (Seaport orders stay fulfillable until incrementCounter/cancel on-chain,
# whether or not our DB remembers them). DMs, profiles, favorites and push
# subscriptions are the rest of the user-state that has no other home.
#
# SECURITY: this repo is PUBLIC and workflow artifacts on public repos are
# downloadable by any logged-in GitHub user. The bundle contains private DMs
# and signed orders, so it is ALWAYS gpg-encrypted (AES256, symmetric) with
# the BACKUP_PASSPHRASE secret before upload. Plaintext never leaves the
# runner. Restore:
#   gpg --decrypt --batch --passphrase "<BACKUP_PASSPHRASE>" \
#     supabase-backup-<date>.tar.gz.gpg | tar -xz
#
# Required repo secrets (the workflow FAILS LOUDLY when any is unset — it used
# to skip silently and report success, and did so for its entire life):
#   SUPABASE_URL          — https://<project-ref>.supabase.co
#   SUPABASE_SERVICE_KEY  — service-role key (bypasses RLS; read-only use here)
#   BACKUP_PASSPHRASE     — long random string; store a copy offline — without
#                           it the backups are unreadable
#
# NOT backed up: siwe_nonces (5-minute-TTL ephemeral auth nonces — already
# dead by the time any restore could happen).

on:
  schedule:
    - cron: "23 4 * * 1" # Mondays 04:23 UTC
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: supabase-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # ─────────────────────────────────────────────────────────────────
      # FAIL when the secrets are missing. This used to write ready=false
      # and let every downstream step skip, so the job reported SUCCESS
      # having backed up nothing.
      #
      # It did exactly that for its entire life. Every scheduled run from
      # 2026-06-15 through 2026-07-27 is green; run 30247964816 logs
      # "Skipping backup — repo secrets not configured: SUPABASE_URL
      # SUPABASE_SERVICE_KEY BACKUP_PASSPHRASE" and produced 0 artifacts.
      # Seven weekly "successful" backups, zero bytes of backup.
      #
      # What that silence was covering: `orders` holds SIGNED SEAPORT
      # ORDERS. Those signatures are bearer instruments — the DB row is
      # the only copy, and nothing on-chain can reconstruct one. A green
      # check on an unconfigured backup is worse than no workflow at all,
      # because it reads as protection that does not exist.
      #
      # A weekly red run is the correct signal here: either set the three
      # secrets, or disable the workflow deliberately. Silent success is
      # the one state that must not be reachable.
      - name: Preflight — require the backup secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        shell: bash
        run: |
          set -u
          missing=""
          if [ -z "${SUPABASE_URL}" ]; then missing="$missing SUPABASE_URL"; fi
          if [ -z "${SUPABASE_SERVICE_KEY}" ]; then missing="$missing SUPABASE_SERVICE_KEY"; fi
          if [ -z "${BACKUP_PASSPHRASE}" ]; then missing="$missing BACKUP_PASSPHRASE"; fi
          if [ -n "$missing" ]; then
            echo "::error title=Supabase backup not configured::Missing repo secrets:$missing — no backup has been taken. Set them under Settings > Secrets and variables > Actions, or disable this workflow deliberately."
            exit 1
          fi
          echo "✅ backup secrets present."

      - name: Dump tables via PostgREST (paginated, 1000 rows/page)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p backup

          # Table list = union of the API surface's writable tables:
          #   frontend/api/orderbook.js        → native_orders, trade_offers
          #   frontend/api/supabase-proxy.js   → ALLOWED_TABLES (messages,
          #     user_profiles, user_favorites, user_watchlist, votes,
          #     dm_messages, push_subscriptions)
          #   frontend/api/auth/*.js           → revoked_jwts (siwe_nonces
          #     intentionally excluded — ephemeral)
          # Keep in sync when ALLOWED_TABLES or the orderbook schema grows.
          TABLES="native_orders trade_offers messages dm_messages user_profiles user_favorites user_watchlist votes push_subscriptions revoked_jwts"

          # Tables permitted to be ABSENT (HTTP 404) — and ONLY absent; any
          # other error on them still fails. Empty on purpose: every table in
          # the list above has a committed migration, so a 404 means either a
          # migration has not been applied to prod or the name drifted, and
          # both are things a backup job must shout about. Add a name here only
          # with the migration number that has not shipped yet.
          OPTIONAL_TABLES=""

          PAGE_SIZE=1000
          MAX_PAGES=500   # 500k rows/table runtime bound — log loudly if hit
          ok=0
          failed=""
          missing=""
          truncated=""

          dump_table() {
            local table="$1"
            local tmpdir page=0 from to code rows
            tmpdir="$(mktemp -d)"
            while [ "$page" -lt "$MAX_PAGES" ]; do
              from=$((page * PAGE_SIZE))
              to=$((from + PAGE_SIZE - 1))
              code="$(curl -sS --max-time 60 -o "$tmpdir/page_$page.json" -w '%{http_code}' \
                -H "apikey: ${SUPABASE_SERVICE_KEY}" \
                -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
                -H "Range-Unit: items" \
                -H "Range: ${from}-${to}" \
                "${SUPABASE_URL}/rest/v1/${table}?select=*")" || code="000"
              if [ "$code" = "416" ]; then
                # Range past end of table — pagination complete.
                rm -f "$tmpdir/page_$page.json"
                break
              fi
              if [ "$code" != "200" ] && [ "$code" != "206" ]; then
                # Return code 2 = "table does not exist", 1 = "could not read
                # it". The caller treats those differently: only the first can
                # ever be tolerated, and only for a table on OPTIONAL_TABLES.
                # Collapsing both into one warning is what let nine of ten
                # tables fail while the job reported success.
                echo "::warning::${table}: HTTP ${code} on rows ${from}-${to}"
                rm -rf "$tmpdir"
                [ "$code" = "404" ] && return 2
                return 1
              fi
              rows="$(jq 'length' "$tmpdir/page_$page.json" 2>/dev/null || echo bad)"
              if ! [[ "$rows" =~ ^[0-9]+$ ]]; then
                echo "::warning::${table}: non-JSON page at rows ${from}-${to}"
                rm -rf "$tmpdir"
                return 1
              fi
              page=$((page + 1))
              if [ "$rows" -lt "$PAGE_SIZE" ]; then break; fi
            done
            if [ "$page" -ge "$MAX_PAGES" ]; then
              # A truncated table is a table you cannot restore from. It was a
              # warning; it is a failure.
              echo "::error::${table}: hit the ${MAX_PAGES}-page cap — this table is TRUNCATED and the bundle is not a usable restore point. Raise MAX_PAGES."
              truncated="$truncated $table"
            fi
            # Merge pages into one JSON array per table.
            if ls "$tmpdir"/page_*.json >/dev/null 2>&1; then
              jq -s 'add // []' "$tmpdir"/page_*.json > "backup/${table}.json"
            else
              echo "[]" > "backup/${table}.json"
            fi
            local total
            total="$(jq 'length' "backup/${table}.json")"
            echo "${table}: ${total} rows"
            echo "| ${table} | ${total} |" >> "$GITHUB_STEP_SUMMARY"
            rm -rf "$tmpdir"
            return 0
          }

          echo "| Table | Rows |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for t in $TABLES; do
            # `set -e` is deliberately NOT in force in this step (`set -uo
            # pipefail` only), so a non-zero return lands in $? rather than
            # killing the run before every table has been attempted. One report
            # naming all the broken tables beats failing at the first.
            dump_table "$t"
            case "$?" in
              0) ok=$((ok + 1)) ;;
              2)
                if printf '%s\n' $OPTIONAL_TABLES | grep -qx -- "$t"; then
                  echo "::warning::${t}: table does not exist (allowlisted as optional) — not backed up"
                  missing="$missing $t"
                else
                  echo "::error::${t}: table does not exist. Either its migration has not been applied to prod, or the name drifted from the API surface."
                  failed="$failed $t"
                fi
                ;;
              *) failed="$failed $t" ;;
            esac
          done

          # ─────────────────────────────────────────────────────────────
          # ANY table failing fails the job.
          #
          # This used to be `if [ "$ok" -eq 0 ]` — nine of ten tables could
          # fail and the run still reported SUCCESS, having uploaded a bundle
          # that silently omitted them. For a backup whose whole purpose is
          # `native_orders` / `trade_offers` — signed Seaport orders, bearer
          # instruments whose only copy is the DB row — "we got most of it" is
          # indistinguishable from "we got the part you did not need". The
          # artifact would restore cleanly and be missing the money.
          #
          # A partial backup must never be presentable as a backup. If one
          # table is genuinely gone for good, allowlist it in OPTIONAL_TABLES
          # with a reason; do not soften this test.
          # ─────────────────────────────────────────────────────────────
          {
            echo ""
            echo "Backed up ${ok}/$(echo $TABLES | wc -w) tables."
            [ -n "$missing" ] && echo "Absent (allowlisted):$missing"
            [ -n "$failed" ] && echo "FAILED:$failed"
            [ -n "$truncated" ] && echo "TRUNCATED:$truncated"
            true
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$failed" ] || [ -n "$truncated" ]; then
            echo "::error title=Incomplete backup::Tables failed:${failed:- none} | truncated:${truncated:- none}. The bundle is NOT a usable restore point, so this run fails rather than uploading a partial snapshot under a green check."
            exit 1
          fi
          if [ "$ok" -eq 0 ]; then
            echo "::error::Every table failed — check SUPABASE_URL / SUPABASE_SERVICE_KEY (project paused? key rotated?)"
            exit 1
          fi

      - name: Bundle and encrypt (NEVER upload plaintext)
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          STAMP="$(date -u '+%Y-%m-%d')"
          tar -czf "supabase-backup-${STAMP}.tar.gz" backup/
          # Passphrase via stdin (never argv — argv is visible in process lists).
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --symmetric \
            --cipher-algo AES256 --pinentry-mode loopback --passphrase-fd 0 \
            -o "supabase-backup-${STAMP}.tar.gz.gpg" "supabase-backup-${STAMP}.tar.gz"
          # Shred the plaintext so only the .gpg can ever reach the artifact step.
          rm -f "supabase-backup-${STAMP}.tar.gz"
          rm -rf backup
          ls -l supabase-backup-*.tar.gz.gpg

      - name: Upload encrypted artifact (90-day retention)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supabase-backup-${{ github.run_id }}
          path: supabase-backup-*.tar.gz.gpg
          retention-days: 90
          if-no-files-found: error
