name: Slither

# COMPANION WORKFLOW. See contracts-ci-not-applicable.yml for the full
# reasoning — same bug, same recipe, same rule about finish order.
#
# In short: slither.yml is filtered by `paths: [contracts/**, …]`, so on a PR
# that touches no Solidity it never runs and never reports. A required-status
# rule naming "Slither / Static analysis" would then block every frontend PR
# forever, waiting for a check that cannot arrive.
#
# `name:` above and the job name below are the wire format for the check
# context. Renaming either silently unsolders this.

on:
  pull_request:
    branches: [main, mvp-launch]
    paths-ignore:
      - "contracts/**"
      - ".github/workflows/slither.yml"

permissions:
  contents: read

jobs:
  analyze:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: No Solidity in this diff
        run: echo "slither.yml does not apply to this change set; reporting its required check as satisfied."
