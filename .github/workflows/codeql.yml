name: CodeQL

on:
  push:
    branches: [main, mvp-launch]
  pull_request:
    branches: [main, mvp-launch]
  schedule:
    - cron: "17 3 * * 1" # weekly, Monday 03:17 UTC

# Least-privilege default — the analyze job augments below with the specific
# scopes CodeQL needs (actions: read, security-events: write).
permissions:
  contents: read

concurrency:
  # PRs share a group and cancel; TRUNK COMMITS EACH GET THEIR OWN GROUP (keyed
  # on github.sha). Sharing one group on trunk meant each merge killed the run
  # before it -- on the branch that deploys. Making cancel-in-progress
  # conditional was NOT enough: it only governs a run already in progress, and a
  # run still queued in an occupied group is pending, which GitHub evicts
  # unconditionally. A pending kill creates zero jobs and so zero check-runs,
  # which made the starvation invisible as well as unfixed. See ci.yml for the
  # full write-up.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Same docs short-circuit as ci.yml: a pull request whose every changed path, old and
  # new for a rename, is markdown or under docs/ skips the analysis. A push, the weekly
  # schedule and every uncertain answer analyse.
  scope:
    name: scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.q.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Does this diff touch anything outside the docs?
        id: q
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          say() { echo "run=$1" >> "$GITHUB_OUTPUT"; exit 0; }
          [ -n "${PR:-}" ] || { echo "not a pull_request: everything runs"; say true; }
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" \
            --jq '.[] | .filename, (.previous_filename // empty)') || {
            echo "::warning::gh could not list every changed file, running everything"
            say true
          }
          if [ -z "$files" ]; then
            echo "::warning::could not list this PR's changed files, running everything"
            say true
          fi
          if [ "$(printf '%s\n' "$files" | wc -l)" -ge 3000 ]; then
            echo "::warning::changed-file list is at the API cap, running everything"
            say true
          fi
          verdict=$(printf '%s\n' "$files" | node .github/scripts/diff-scope.mjs --outside \
            '**/*.md' \
            'docs/**')
          case "$verdict" in
            true|false) say "$verdict" ;;
            *) echo "::warning::diff-scope returned '$verdict', running everything"; say true ;;
          esac

  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    needs: scope
    if: >-
      !cancelled() &&
      (needs.scope.result != 'success' || needs.scope.outputs.run == 'true')
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Checkout
        # AUDIT R056: SHA-pinned actions (was @v3/@v4 floating).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          # Excludes contracts/lib (vendored upstream Solidity libs and their JS
          # dev scripts). See the file for why, and for what it deliberately does
          # NOT exclude.
          config-file: .github/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0

      - name: Perform analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:${{ matrix.language }}"
