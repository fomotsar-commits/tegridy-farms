name: CodeQL

on:
  push:
    branches: [main, mvp-launch]
  pull_request:
    branches: [main, mvp-launch]
  schedule:
    - cron: "17 3 * * 1" # weekly, Monday 03:17 UTC

# Least-privilege default — the analyze job augments below with the specific
# scopes CodeQL needs (actions: read, security-events: write).
permissions:
  contents: read

concurrency:
  # PRs cancel their own superseded runs; TRUNK RUNS MUST FINISH. On a push to
  # main/mvp-launch every merge shares one group, so cancel-in-progress:true made
  # each merge kill the previous run -- and trunk is the branch that deploys.
  # Measured 2026-09-04: six consecutive trunk commits with 5-9 cancelled checks
  # each and as few as 0 successes. Cancelled is not red, so it reads as fine.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Checkout
        # AUDIT R056: SHA-pinned actions (was @v3/@v4 floating).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          # Excludes contracts/lib (vendored upstream Solidity libs and their JS
          # dev scripts). See the file for why, and for what it deliberately does
          # NOT exclude.
          config-file: .github/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

      - name: Perform analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:${{ matrix.language }}"
