name: CodeQL

on:
  push:
    branches: [main, mvp-launch]
  pull_request:
    branches: [main, mvp-launch]
  schedule:
    - cron: "17 3 * * 1" # weekly, Monday 03:17 UTC

# Least-privilege default — the analyze job augments below with the specific
# scopes CodeQL needs (actions: read, security-events: write).
permissions:
  contents: read

concurrency:
  # PRs share a group and cancel; TRUNK COMMITS EACH GET THEIR OWN GROUP (keyed
  # on github.sha). Sharing one group on trunk meant each merge killed the run
  # before it -- on the branch that deploys. Making cancel-in-progress
  # conditional was NOT enough: it only governs a run already in progress, and a
  # run still queued in an occupied group is pending, which GitHub evicts
  # unconditionally. A pending kill creates zero jobs and so zero check-runs,
  # which made the starvation invisible as well as unfixed. See ci.yml for the
  # full write-up.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Checkout
        # AUDIT R056: SHA-pinned actions (was @v3/@v4 floating).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          # Excludes contracts/lib (vendored upstream Solidity libs and their JS
          # dev scripts). See the file for why, and for what it deliberately does
          # NOT exclude.
          config-file: .github/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

      - name: Perform analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:${{ matrix.language }}"
