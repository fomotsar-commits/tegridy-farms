name: Mirror to GitLab

# GitLab is the live standby: every branch and tag pushed here goes there too, so losing GitHub
# costs a 15-minute failover, not the code (docs/GIT_HOSTING.md). It never forces or deletes.
# The daily run sends everything again (GitHub starts no run for a push of more than three tags).
# It and a run by hand ping healthchecks.io, so a standby that stops being current raises an alarm.
on:
  push:
    branches: ['**']
    tags: ['**']
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  mirror:
    name: Push to the GitLab standby
    # A deleted branch or tag starts no job: the standby keeps its copy.
    if: ${{ github.event_name != 'push' || !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      # One job at a time per ref; the full runs queue with the trunk. GitHub keeps one pending job
      # per group and cancels the older one, so a full run can be cancelled: the ping job says so.
      group: mirror-to-gitlab-${{ github.event_name == 'push' && github.ref || 'refs/heads/mvp-launch' }}
      cancel-in-progress: false
    env:
      MIRROR_URL: git@gitlab.com:memetics-finance/tegridy-farms.git
      # gitlab.com's ed25519 host key and its SHA256 fingerprint, as GitLab publishes both
      # (docs.gitlab.com/user/gitlab_com). The script connects only when the two agree.
      GITLAB_HOST_KEY: 'gitlab.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAfuCHKVTjquxvt6CM6tdG4SLp1Btn/nOeHHE5UOzRdf'
      GITLAB_HOST_KEY_SHA256: 'SHA256:eUXGGm1YGsMAS7vkcx6JOJdOGHPem5gQp4taiCfCLB8'
    steps:
      # A push run's checkout holds the pushed commit, even when the branch moved since.
      - name: Check out every branch and tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push to GitLab
        env:
          GITLAB_MIRROR_SSH_KEY: ${{ secrets.GITLAB_MIRROR_SSH_KEY }}
          MIRROR_EVENT: ${{ github.event_name }}
          MIRROR_REF: ${{ github.ref }}
          MIRROR_DELETED: ${{ github.event.deleted }}
        run: bash scripts/git-hosting/mirror-to-gitlab.sh

  # The dead-man switch for the standby. Late: no full run finished (GitHub's schedules stopped,
  # or a newer run cancelled it). /fail: the full run failed or was cancelled.
  ping:
    name: Ping healthchecks.io
    needs: mirror
    if: ${{ always() && github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the gitlab-standby check
        env:
          HC_PING_URL: ${{ secrets.HC_PING_URL_GITLAB_STANDBY }}
          MIRROR_RESULT: ${{ needs.mirror.result }}
        run: |
          if [ -z "$HC_PING_URL" ]; then
            echo "::warning::HC_PING_URL_GITLAB_STANDBY is not set, so no alarm watches the standby (docs/GIT_HOSTING.md, 2E)"
            exit 0
          fi
          case "$HC_PING_URL" in
            https://*[!A-Za-z0-9._~:/-]*) echo "::error::HC_PING_URL_GITLAB_STANDBY must be a plain https URL"; exit 1 ;;
            https://?*) ;;
            *) echo "::error::HC_PING_URL_GITLAB_STANDBY must be a plain https URL"; exit 1 ;;
          esac
          if [ "$MIRROR_RESULT" = success ]; then suffix=''; else suffix=/fail; fi
          printf 'url = "%s%s"\n' "$HC_PING_URL" "$suffix" | curl -fsS -m 10 --retry 3 -o /dev/null --config -
