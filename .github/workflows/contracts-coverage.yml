name: Contracts Coverage

# Weekly line coverage over contracts/src, held by a ratchet: .github/coverage-floor.json.
# It lives here, not in contracts-ci.yml, because it is slow and allowed to fail. There is
# no "no floor file, pass anyway" path: an unarmed ratchet is a green over nothing, so a
# missing file fails the run and prints the JSON to commit.
#
# One slice per job, the slices of .github/contracts-test-slices.json. A single
# `forge coverage` over the whole suite compiles ~480 files under --ir-minimum and is killed
# at about 15 GB on a 16 GB runner. Each slice compiles only its own tests (the rest are
# `--skip`ped), peaks near 7.5 GB, and the lcov files are merged by line after.

on:
  schedule:
    - cron: "13 5 * * 0" # Sundays 05:13 UTC
  workflow_dispatch:
    inputs:
      update_floor:
        description: "Print the floor JSON to commit instead of enforcing it"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: contracts-coverage
  cancel-in-progress: false

jobs:
  slices:
    name: coverage slices
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.emit.outputs.matrix }}
      count: ${{ steps.emit.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Every test file is sliced or explicitly excluded
        run: node scripts/check-test-slice-coverage.mjs

      - name: Emit matrix
        id: emit
        run: |
          set -euo pipefail
          MATRIX="$(node scripts/check-test-slice-coverage.mjs --emit-matrix)"
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          COUNT="$(node -e 'console.log(JSON.parse(process.argv[1]).include.length)' "$MATRIX")"
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"

  coverage:
    name: coverage - ${{ matrix.slice }}
    needs: slices
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.slices.outputs.matrix) }}
    defaults:
      run:
        working-directory: contracts

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          # PINNED 2026-08-27 (was `stable`, which FLOATS) - see the build job in
          # contracts-ci.yml for the incident. Bump ALL 7 sites together, never one.
          version: v1.7.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # --ir-minimum is load-bearing: foundry.toml sets via_ir, and plain `forge coverage`
      # drops it and dies on stack-too-deep. These cannot be built under it, so the run
      # leaves them out and the number does not count them:
      #   src/TegridyTokenURIReader.sol  string.concat with 20+ arguments: Yul stack-too-deep.
      #                                  Its test, and the one Deep_DropLaunchpad test that
      #                                  imports it, go with it.
      # `--no-match-contract EIP170Size` drops tests that assert the OPTIMIZED bytecode size.
      - name: forge coverage (${{ matrix.slice }})
        id: forge
        env:
          SLICE: ${{ matrix.slice }}
          SLICE_NO_MATCH_TEST: ${{ matrix.noMatchTest }}
          FOUNDRY_FUZZ_RUNS: 256
          FOUNDRY_INVARIANT_RUNS: 32
          FOUNDRY_INVARIANT_DEPTH: 256
        run: |
          set -euo pipefail
          UNBUILDABLE=(
            src/TegridyTokenURIReader.sol
            test/TegridyTokenURIReader.t.sol
            test/Deep_DropLaunchpad_2026_05_01.t.sol
          )
          for f in "${UNBUILDABLE[@]}"; do
            test -f "$f" || { echo "::error::$f is on the coverage skip list and no longer exists"; exit 1; }
          done

          node ../scripts/check-test-slice-coverage.mjs --expect "$SLICE" | sort > /tmp/keep.txt
          find test -name '*.t.sol' | sort > /tmp/all.txt
          test -s /tmp/keep.txt || { echo "::error::slice $SLICE names no test file"; exit 1; }
          echo "slice $SLICE compiles $(wc -l < /tmp/keep.txt) of $(wc -l < /tmp/all.txt) test files"

          SKIPS=(--skip script)
          for f in "${UNBUILDABLE[@]}"; do SKIPS+=(--skip "$f"); done
          while read -r f; do SKIPS+=(--skip "$f"); done < <(comm -23 /tmp/all.txt /tmp/keep.txt)

          # A failing forge must not stop the lcov upload, or the slice leaves nothing to read.
          if ! forge coverage --ir-minimum "${SKIPS[@]}" \
               --no-match-contract 'EIP170Size' --no-match-test "$SLICE_NO_MATCH_TEST" \
               --report summary --report lcov; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload this slice's lcov
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        if: ${{ !cancelled() }}
        with:
          name: lcov-${{ matrix.slice }}
          path: contracts/lcov.info
          retention-days: 30
          if-no-files-found: error

      - name: Fail the slice if forge failed
        if: ${{ steps.forge.outputs.failed == 'true' }}
        env:
          SLICE: ${{ matrix.slice }}
        run: |
          echo "::error title=Coverage slice failed::forge coverage failed on slice $SLICE. Coverage over part of the suite is not the repo's number, so the merge will not run."
          exit 1

  merge:
    name: merge slices + floor ratchet
    needs: [slices, coverage]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: contracts

    steps:
      - name: Every slice finished
        working-directory: .
        env:
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        run: |
          if [ "$COVERAGE_RESULT" != "success" ]; then
            echo "::error title=Coverage not measured::at least one slice did not finish ($COVERAGE_RESULT). A number over part of the tests is not the repo's number, so nothing is compared to the floor."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Download the slices' lcov
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: lcov-*
          path: contracts/slices

      # Merged by line: a line is hit if any slice hit it. See scripts/lib/lcov-merge.mjs.
      - name: Merge the slices
        env:
          EXPECTED: ${{ needs.slices.outputs.count }}
        run: |
          set -euo pipefail
          FOUND="$(ls slices/*/lcov.info | wc -l)"
          [ "$FOUND" = "$EXPECTED" ] || { echo "::error::expected $EXPECTED slice reports, found $FOUND"; exit 1; }
          node ../scripts/lib/lcov-merge.mjs lcov.info slices/*/lcov.info

      # Parse LCOV rather than the human summary: LF/LH records are a stable
      # format, the summary table's columns are not. Scoped to src/ - coverage
      # of test/ and script/ is not a number anyone should be ratcheting.
      - name: Compute line coverage over src/
        id: cov
        run: |
          set -euo pipefail
          test -s lcov.info || { echo "::error::forge coverage produced no lcov.info — nothing was measured"; exit 1; }
          python3 - <<'PY' | tee /tmp/cov.env
          found = hit = files = 0
          in_scope = False

          def scoped(path: str) -> bool:
              # OUR src/, never a dependency's. Vendored trees under lib/ have
              # their own src/ directories and would otherwise be averaged in -
              # which both inflates the number and makes the ratchet move when
              # a submodule bumps.
              p = "/" + path.replace("\\", "/")
              return "/src/" in p and "/lib/" not in p and "/node_modules/" not in p

          for line in open("lcov.info", encoding="utf-8", errors="replace"):
              line = line.strip()
              if line.startswith("SF:"):
                  in_scope = scoped(line[3:])
              elif in_scope and line.startswith("LF:"):
                  found += int(line[3:]); files += 1
              elif in_scope and line.startswith("LH:"):
                  hit += int(line[3:])
          assert files > 0, "no src/ files appear in lcov.info — the report is empty or the paths changed"
          assert found > 0, "src/ files report zero total lines — the report is not usable"
          pct = 100.0 * hit / found
          print(f"COV_FILES={files}")
          print(f"COV_LINES_FOUND={found}")
          print(f"COV_LINES_HIT={hit}")
          print(f"COV_PCT={pct:.2f}")
          PY
          cat /tmp/cov.env >> "$GITHUB_ENV"

      - name: Enforce the floor
        env:
          UPDATE_FLOOR: ${{ inputs.update_floor }}
          SLICE_COUNT: ${{ needs.slices.outputs.count }}
        run: |
          set -euo pipefail
          FLOOR_FILE=../.github/coverage-floor.json
          {
            echo "### Contracts coverage (src/)"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| slices | ${SLICE_COUNT} |"
            echo "| files | ${COV_FILES} |"
            echo "| lines hit | ${COV_LINES_HIT} / ${COV_LINES_FOUND} |"
            echo "| line coverage | **${COV_PCT}%** |"
            echo ""
            echo "Not in this number: \`src/TegridyTokenURIReader.sol\` (cannot be built under \`--ir-minimum\`)"
            echo "and the tests that assert optimized bytecode size."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$UPDATE_FLOOR" = "true" ]; then
            echo "Ratchet not enforced (update_floor requested). Commit this as .github/coverage-floor.json:"
            printf '{ "lines": %s }\n' "$COV_PCT" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ ! -f "$FLOOR_FILE" ]; then
            echo "::error title=Coverage floor not armed::.github/coverage-floor.json does not exist, so nothing constrains coverage and this job would only ever print a number. Commit the line below to arm the ratchet."
            printf '{ "lines": %s }\n' "$COV_PCT" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          FLOOR="$(python3 -c 'import json;print(json.load(open("../.github/coverage-floor.json"))["lines"])')"
          echo "measured ${COV_PCT}% vs floor ${FLOOR}%"
          echo "| floor | ${FLOOR}% |" >> "$GITHUB_STEP_SUMMARY"

          # A floor of 0 is the armed-but-unmeasured state: the file exists so
          # this job can complete, but nothing has ever measured this tree, so
          # the comparison below cannot fail and this run proves nothing. That
          # has to be visible on the run itself - a green check whose green
          # means "no opinion" is the shape this whole workflow was written to
          # replace. Warning, not failure: failing here would make the cron red
          # until an operator does the one thing a red cron discourages.
          if python3 -c 'import sys,json;sys.exit(0 if float(json.load(open("../.github/coverage-floor.json"))["lines"]) <= 0 else 1)'; then
            echo "::warning title=Coverage ratchet not armed::.github/coverage-floor.json has lines=0 — this run enforces nothing. Re-run this workflow with update_floor checked and commit the printed number to arm it."
            {
              echo ""
              echo "> **The ratchet is not armed.** \`lines\` is 0, so this run enforces nothing and its"
              echo "> green result is not evidence of coverage. Re-run with \`update_floor\` and commit"
              echo "> the printed number."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          python3 - "$COV_PCT" "$FLOOR" <<'PY'
          import sys
          got, floor = float(sys.argv[1]), float(sys.argv[2])
          if got + 1e-9 < floor:
              print(f"::error title=Coverage regressed::line coverage over contracts/src fell to {got:.2f}%, below the committed floor of {floor:.2f}%. Add tests, or lower the floor DELIBERATELY in the same PR that removes the coverage.")
              raise SystemExit(1)
          print(f"OK: {got:.2f}% >= {floor:.2f}%")
          PY

      - name: Upload merged lcov
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        if: ${{ !cancelled() }}
        with:
          name: contracts-lcov
          path: contracts/lcov.info
          retention-days: 30
          if-no-files-found: warn
