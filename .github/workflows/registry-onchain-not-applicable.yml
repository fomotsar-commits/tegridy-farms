name: Address Registry — chain read

# COMPANION WORKFLOW. See contracts-ci-not-applicable.yml for the full
# reasoning — same bug, same recipe, same rule about finish order.
#
# registry-onchain.yml is filtered by `paths: [frontend/scripts/addresses.json,
# …]`, so a PR that changes no address surface never produces
# "Address Registry — chain read / registry vs chain" and a required-status
# rule naming it would hang.
#
# NOTE the extra reason this one needs a companion: the real job reads mainnet
# over RPC. Making it unconditional instead of synthesising a pass would put a
# live network dependency in the merge path of every PR, which is a different
# way to hang the same merge.
#
# `name:` above and the job name below are the wire format for the check
# context. Renaming either silently unsolders this.

on:
  pull_request:
    branches: [main, mvp-launch]
    paths-ignore:
      - "frontend/scripts/addresses.json"
      - "frontend/scripts/verify-addresses.mjs"
      - "frontend/src/lib/constants.ts"
      - ".github/workflows/registry-onchain.yml"

permissions:
  contents: read

jobs:
  chain-read:
    name: registry vs chain
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: No address surface in this diff
        run: echo "registry-onchain.yml does not apply to this change set; reporting its required check as satisfied."
