version: 2

updates:
  # Frontend npm dependencies
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "frontend"
    ignore:
      # TypeScript 7.0 is the Go port. typescript-eslint refuses to load against
      # it outright — `npm run lint` dies with "typescript-eslint does not
      # support TS 7.0" (exit 2) before linting a single file, so this is not a
      # warning we can work around. Tracking: typescript-eslint#10940.
      # LIFT THIS as soon as typescript-eslint ships TS >=7 support. Minor and
      # patch TS updates still flow normally — only the major is held.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      # ── Groups are deliberately restricted to minor+patch ──────────────
      # A group with no `update-types` sweeps MAJORS in too, and a group is
      # all-or-nothing: one unmergeable major holds every safe bump in the
      # batch hostage. That is not hypothetical — it happened on 2026-07-30 to
      # all three grouped PRs at once:
      #   #149  wagmi 2->3 (major)      blocked viem minor + rainbowkit patch
      #   #151  typescript 5.9->7.0     blocked vite, plugin-react, react-hooks
      #         + eslint 9->10, @types/node 24->26 (three majors in one PR)
      #   #155  jsdom 29->30 + undici 7->8
      # Majors now arrive as their own single-package PRs, where the blast
      # radius is legible and the decision is deliberate. That matters most for
      # `wagmi`/`viem`: this app signs transactions, and a wallet-layer major
      # is a migration, not a dependency bump.
      web3-stack:
        update-types: ["minor", "patch"]
        patterns:
          - "viem"
          - "wagmi"
          - "@wagmi/*"
          - "@rainbow-me/*"
      react:
        update-types: ["minor", "patch"]
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
      tooling:
        update-types: ["minor", "patch"]
        patterns:
          - "@vitejs/*"
          - "vite"
          - "typescript"
          - "eslint*"
          - "@types/*"

  # Indexer npm dependencies
  # PAUSED 2026-07-30 (limit 5 -> 0). Not a judgement on the indexer; a bump
  # here is currently UNVERIFIABLE and therefore not reviewable:
  #   * no workflow touches indexer/ — `grep -rln indexer .github/workflows/`
  #     returns nothing, so there is no build, typecheck or test for it
  #   * ci.yml runs everything under `working-directory: frontend` (lines 24,
  #     81, 126), so indexer breakage cannot surface there incidentally either
  #   * nothing imports it — no `from '…indexer'` anywhere in frontend/src or
  #     frontend/api; the only in-app mentions are prose comments about Ponder
  # So if a bump broke the indexer, every gate would still be green. Four such
  # PRs (#92, #93, #118, #119) were closed on 2026-07-30 for exactly that reason.
  #
  # Set this back to 5 the moment EITHER is true: indexer/ gets a CI job, or the
  # frontend gains a real read path against it. Until then this only produces
  # PRs nobody can responsibly merge.
  - package-ecosystem: npm
    directory: "/indexer"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "indexer"

  # Root (if any lockfile lives at root)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  # GitHub Actions themselves (action versions drift too)
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - "dependencies"
      - "ci"
    ignore:
      # foundry-toolchain 1.9.x turns ALL NINE forge test slices red, plus the
      # `all-tests-pass` aggregator — i.e. it takes out the repo's only real
      # contracts gate. Held at 1.3.1 until someone does the migration properly.
      #
      # The failure is NOT the solmate remapping story recorded in #205. Measured
      # on that PR's own Contracts CI run (30721651775) on 2026-08-01:
      #   * `CreateContractSizeLimit` / "create initcode size limit"  -> 224 hits
      #   * "Unable to resolve imports"                               ->   1 hit (v4 slice only)
      # and the doubled-`src/src/` remapping error that #205 blames appears
      # 70 times in a GREEN 1.3.1 run (30724913602), so it is pre-existing and
      # benign. Eight of the nine slices COMPILE FINE under 1.9 and die at
      # RUNTIME on the size limit — e.g. r-series reports "0 tests passed,
      # 10 failed" with `[FAIL: EvmError: CreateContractSizeLimit] constructor()`.
      #
      # So fixing remappings turns one slice green and leaves eight red. The
      # untried lever is contracts/foundry.toml's `code_size_limit = 24576`,
      # which 1.9 appears to apply to the TEST harness and not just deployables.
      #
      # Dependabot re-opened this as #190 after it was closed once. LIFT this
      # ignore only together with a run where all nine slices are green.
      - dependency-name: "foundry-rs/foundry-toolchain"
