# GitLab CI. The gates live in .github/workflows/*.yml and nowhere else: each job below
# runs one of those files, unchanged, under act (scripts/ci/act-job.sh) on our own runner.
# Nothing here copies a command, path or hash out of a workflow, so a workflow edit
# changes both hosts at once. Design, runner and first run: docs/CI_ON_GITLAB.md.
# Guarded by frontend/src/test/gitlabCi.test.ts.

# Not run here (the test holds the reasons): codeql.yml (GitHub-only SARIF and licence),
# gitleaks.yml (replaced by the gitleaks job), release.yml (GitHub Releases API),
# solana-deploy-artifact.yml (manual mainnet builds), and the schedule-only
# arb-linkage-monitor.yml, revenue-watch.yml, synthetic-monitor.yml, supabase-backup.yml
# and contracts-coverage.yml (they move to the ops scheduler).

workflow:
  rules:
    # One pipeline per change: merge request pipelines, and pushes to the trunk.
    # A branch push makes no pipeline of its own, so no commit gets both.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      auto_cancel:
        on_new_commit: interruptible
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "mvp-launch"
      auto_cancel:
        on_new_commit: none

variables:
  # Full history: the scope jobs, the push path filter and gitleaks diff against older commits.
  GIT_DEPTH: "0"
  GIT_SUBMODULE_STRATEGY: none
  # act runs one workflow job at a time. Raise only after reading the doc (ports and memory).
  ACT_CONCURRENT_JOBS: "1"

default:
  # Only our runner. Instance runners stay off for this project.
  tags: [tegridy-runner]
  interruptible: true

stages: [check, workflows]

# Always runs, so every merge request has a pipeline ("Pipelines must succeed" blocks an
# MR that has none). It also proves the wrapper's verdict logic on this runner.
pipeline-exists:
  stage: check
  timeout: 10m
  script:
    - bash scripts/ci/act-job.sh --self-test

gitleaks:
  stage: check
  timeout: 20m
  script:
    - bash scripts/ci/gitleaks-range.sh

# Each workflow starts at once and stands alone, as on GitHub: a red gitleaks run does
# not hide the test results.
.act-workflow:
  stage: workflows
  needs: []
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - .act-out/

ci:
  extends: .act-workflow
  timeout: 2h
  script:
    - bash scripts/ci/act-job.sh ci.yml

contracts-ci:
  extends: .act-workflow
  timeout: 3h
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  script:
    - bash scripts/ci/act-job.sh contracts-ci.yml

slither:
  extends: .act-workflow
  timeout: 1h
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  script:
    - bash scripts/ci/act-job.sh slither.yml

solana-ci:
  extends: .act-workflow
  timeout: 3h
  script:
    - bash scripts/ci/act-job.sh solana-ci.yml

npm-advisories:
  extends: .act-workflow
  timeout: 30m
  script:
    - bash scripts/ci/act-job.sh npm-advisories.yml

# Reads mainnet over public RPCs. On GitHub it was never a required check, and its own
# header says a change must not be blocked by an RPC hiccup. It still shows red when red.
registry-onchain:
  extends: .act-workflow
  timeout: 30m
  allow_failure: true
  script:
    - bash scripts/ci/act-job.sh registry-onchain.yml
