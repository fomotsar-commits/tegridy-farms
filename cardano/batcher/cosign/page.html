<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Co-sign the pools deploy</title>
<link rel="stylesheet" href="/page.css">
</head>
<body>
<header>
  <h1>Co-sign the pools deploy</h1>
  <p id="network" class="network"></p>
  <p class="small">This page runs on this computer only. It shows what each transaction does, read from its own bytes, and asks your wallet to sign it. Your keys stay in your wallet.</p>
</header>
<main>
  <section>
    <h2>Transactions</h2>
    <ul id="steps"></ul>
  </section>
  <section id="tx" hidden>
    <h2 id="tx-title"></h2>
    <p class="small">Transaction id <code id="tx-id"></code></p>
    <div id="tx-body"></div>
    <h3>Who must sign</h3>
    <table id="needs"></table>
    <h3>Sign</h3>
    <p id="wallets"></p>
    <p id="wallet-holds" class="small"></p>
    <p id="result" role="status"></p>
  </section>
</main>
<script src="/page.js"></script>
</body>
</html>
