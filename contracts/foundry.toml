[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
optimizer = true
# mvp-launch: runs = 200 (the canonical OpenZeppelin / Solady / Solmate value).
# This is the correct runtime-gas optimum; it is NOT a size lever. EIP-170
# compliance for the heavy contracts is achieved by CONTRACT SPLITTING, not by
# dropping runs (dropping runs to 1 only saved ~1.2KB and never brought
# TegridyStaking under 24,576 — confirmed during the 2026-05-24 re-audit).
#
# MVP-path EIP-170 status (2026-05-30 re-split — the May 26-28 fix waves
# re-inflated all three of TegridyStaking / TegridyFactory / SwapFeeRouter past the
# 24,576-byte ceiling). Battle-tested approach: ZERO new custom marshalling code;
# only (1) DRY refactors that DELETE duplicated patterns, (2) verbatim Solady
# primitive swaps from billion-dollar protocols, (3) read-only sister contracts.
#
# TegridyStaking: 24,537 B (~39 B headroom — RAZOR-THIN, FROZEN for launch).
#   ANY further growth must extract more to a lib or sister; do NOT consume buffer.
#   - src/lib/StakingViewLib.sol: read-only views (votingPowerOf / aggregateActive
#     BoostBps / earned / earnedFromMem) + resolveJbac JBAC-revalidation helper
#     (2026-05-30 DRY split: was inline in 3 callsites). All `internal` so they
#     inline rather than paying the per-callsite delegatecall wrapper.
#   - src/lib/StakingRewardLib.sol: live reward-accounting cluster (May-24 C1).
#   - src/StakingMonitorView.sol: read-only SISTER contract exposing the heaviest
#     off-chain views (earned, getPosition, totalLocked, stakeCapUtilizationBps,
#     stakeCapHeadroom). Forta / Defender / dashboards / indexers point at the
#     sister address — zero off-chain breakage, zero protocol state.
#   - Verbatim Solady swaps: SafeTransferLib (was OZ SafeERC20), EnumerableSetLib
#     (was OZ EnumerableSet), SafeCastLib (was OZ SafeCast). All assembly-tight
#     drop-ins used in production by Aerodrome, Uniswap V4 hooks, many others.
# TegridyFactory: 12,133 B (~12,443 B headroom).
#   - src/lib/TegridyFactoryLib.sol: ERC-777 detection + CREATE2 pair deployment
#     (carries the ~11 KB type(TegridyPair).creationCode blob into the lib).
# SwapFeeRouter: 21,392 B (~3,184 B headroom).
#   - src/lib/SwapFeeRouterConvertLib.sol: TWAP-floor conversion cluster.
#
# TegridyRestaking: still ~31.3 KB — DEFERRED to Phase 7 (removed from the MVP
#   DeployMVP/VerifyMVP path). MUST be split + deployed + wired before restaking
#   opens; it is the only LIVE-on-mainnet candidate currently over EIP-170.
#
# If a future change pushes any LIVE-on-mainnet contract back over 24,576, the
# right answer is to split that contract (extract to a linked library), NOT to
# drop runs.
optimizer_runs = 200
# via_ir kept on: SwapFeeRouter still has paths deep enough to need IR scheduling.
via_ir = true
# NOTE: cancun is required by OpenZeppelin v5.6.1 (uses mcopy opcode).
# For L2 deployment (Arbitrum, Optimism), compile with cancun but verify L2 opcode support.
evm_version = "cancun"
# EIP-170 mainnet bytecode limit. Surfaced explicitly so deploy-size regressions
# fail at compile-time rather than at mainnet broadcast.
code_size_limit = 24576

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
    "@uniswap/v4-core/=lib/v4-core/",
    "@uniswap/v4-periphery/=lib/v4-periphery/",
    "solmate/=lib/solmate/src/",
    "solady/=lib/solady/src/",
]

[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api?chainid=1" }
sepolia = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api?chainid=11155111" }

[rpc_endpoints]
mainnet = "${ETH_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"
