[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
optimizer = true
# mvp-launch: runs = 200 (the canonical OpenZeppelin / Solady / Solmate value).
# This is the correct runtime-gas optimum; it is NOT a size lever. EIP-170
# compliance for the heavy contracts is achieved by CONTRACT SPLITTING, not by
# dropping runs (dropping runs to 1 only saved ~1.2KB and never brought
# TegridyStaking under 24,576 — confirmed during the 2026-05-24 re-audit).
#
# TegridyStaking: brought under EIP-170 (24,505 B at runs=200, ~71 B headroom)
#   by the C1 split — the read-only view/math cluster lives in
#   src/lib/StakingViewLib.sol and the live reward-accounting cluster
#   (_accumulateRewards / _getReward / kick / _settleRewardsOnTransfer /
#   _settleUnsettled / claimUnsettled* / _afterTokenTransfer) lives in
#   src/lib/StakingRewardLib.sol, both linked via delegatecall.
# TegridyRestaking: still ~29.5 KB — DEFERRED to Phase 7 (removed from the MVP
#   DeployMVP/VerifyMVP path). It MUST be split + deployed + wired before
#   restaking opens; it is the only remaining contract over EIP-170.
#
# If a future change pushes any LIVE-on-mainnet contract back over 24,576, the
# right answer is to split that contract (extract to a linked library), NOT to
# drop runs.
optimizer_runs = 200
# via_ir kept on: SwapFeeRouter still has paths deep enough to need IR scheduling.
via_ir = true
# NOTE: cancun is required by OpenZeppelin v5.6.1 (uses mcopy opcode).
# For L2 deployment (Arbitrum, Optimism), compile with cancun but verify L2 opcode support.
evm_version = "cancun"
# EIP-170 mainnet bytecode limit. Surfaced explicitly so deploy-size regressions
# fail at compile-time rather than at mainnet broadcast.
code_size_limit = 24576

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
    "@uniswap/v4-core/=lib/v4-core/",
    "@uniswap/v4-periphery/=lib/v4-periphery/",
    "solmate/=lib/solmate/src/",
    "solady/=lib/solady/src/",
]

[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api?chainid=1" }
sepolia = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api?chainid=11155111" }

[rpc_endpoints]
mainnet = "${ETH_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"
