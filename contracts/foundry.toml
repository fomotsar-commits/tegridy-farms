[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
optimizer = true
# mvp-launch: runs = 200 (the canonical OpenZeppelin / Solady / Solmate value).
# This is the correct runtime-gas optimum; it is NOT a size lever. EIP-170
# compliance for the heavy contracts is achieved by CONTRACT SPLITTING, not by
# dropping runs (dropping runs to 1 only saved ~1.2KB and never brought
# TegridyStaking under 24,576 — confirmed during the 2026-05-24 re-audit).
#
# MVP-path EIP-170 status (2026-05-30 re-split — the May 26-28 fix waves
# re-inflated all three of TegridyStaking / TegridyFactory / SwapFeeRouter past the
# 24,576-byte ceiling). Battle-tested approach: ZERO new custom marshalling code;
# only (1) DRY refactors that DELETE duplicated patterns, (2) verbatim Solady
# primitive swaps from billion-dollar protocols, (3) read-only sister contracts.
#
# TegridyStaking: 24,554 B (~22 B headroom — FROZEN for launch; re-measured
#   2026-08-19, was recorded here as 24,337 B / ~239 B). 2026-06-04: the
#   M-1/M-2/H-E security-fix batches had eroded the prior +39 B down to +7 B; moving
#   the two off-chain stakeCap monitoring views to the sister (below) reclaimed ~232 B.
#   ANY further growth must extract more to a lib or sister; do NOT consume buffer.
#   That buffer has since been consumed anyway: 22 B is less than one line of code,
#   and this contract is live + on the redeploy list. Extract BEFORE the next edit.
#   - src/lib/StakingViewLib.sol: read-only views (votingPowerOf / aggregateActive
#     BoostBps / earned / earnedFromMem) + resolveJbac JBAC-revalidation helper
#     (2026-05-30 DRY split: was inline in 3 callsites). All `internal` so they
#     inline rather than paying the per-callsite delegatecall wrapper.
#   - src/lib/StakingRewardLib.sol: live reward-accounting cluster (May-24 C1).
#   - src/StakingMonitorView.sol: read-only SISTER contract exposing the heaviest
#     off-chain views (earned, getPosition, totalLocked, stakeCapUtilizationBps,
#     stakeCapHeadroom). Forta / Defender / dashboards / indexers point at the
#     sister address — zero off-chain breakage, zero protocol state.
#   - Verbatim Solady swaps: SafeTransferLib (was OZ SafeERC20), EnumerableSetLib
#     (was OZ EnumerableSet), SafeCastLib (was OZ SafeCast). All assembly-tight
#     drop-ins used in production by Aerodrome, Uniswap V4 hooks, many others.
# TegridyFactory: 12,133 B (~12,443 B headroom).
#   - src/lib/TegridyFactoryLib.sol: ERC-777 detection + CREATE2 pair deployment
#     (carries the ~11 KB type(TegridyPair).creationCode blob into the lib).
# SwapFeeRouter: 21,531 B (~3,045 B headroom; re-measured 2026-08-19, was 21,392 B).
#   - src/lib/SwapFeeRouterConvertLib.sol: TWAP-floor conversion cluster.
#
# TegridyRestaking: 22,114 B (2026-08-19 admin split from 26,784 B — 2,462 B of
#   headroom). UNDER EIP-170 and deployable. This paragraph used to say the residual
#   ~2 KB needed a Phase-7 architectural reduction — feature removal, or relocating the
#   hot-path reward helpers into the admin lib at a delegatecall-gas cost. Neither was
#   done, because neither was the lever: the bytes were in SELECTOR SURFACE (dispatch
#   table + per-function ABI-decode prologues), not in the function bodies, which is why
#   the 2026-06-04 body-extraction pass FLOORED at ~70-780 B per lever.
#   - src/TegridyRestakingAdmin.sol (9,298 B): the timelocked owner-only admin surface,
#     moved off the host as a SISTER CONTRACT. Removing those selectors from the host's
#     dispatch is what closed the gap.
#   - src/lib/RestakingAdminLib.sol: DELETED in the same change. As a delegatecall lib it
#     still cost the host a wrapper + marshalling stub per body it held; the sister costs
#     the host nothing, so the lib had no remaining job.
#   - src/RestakingMonitorView.sol: read-only display views (sister), from the 2026-06-04
#     pass. Solady SafeTransferLib / SafeCastLib swaps also retained.
#   Deploy status is UNCHANGED: still absent from DeployMVP/VerifyMVP. That is now a
#   scope + external-re-audit decision, NOT "undeployable by construction" — do not read
#   the deferral as a size problem any more. contracts/test/Audit_RestakingEIP170Size.t.sol
#   pins the limit for the host and both sisters, independently of the CI allowlist.
#
# If a future change pushes any LIVE-on-mainnet contract back over 24,576, the
# right answer is to split that contract (extract to a linked library), NOT to
# drop runs.
optimizer_runs = 200
# via_ir kept on: SwapFeeRouter still has paths deep enough to need IR scheduling.
via_ir = true
# NOTE: cancun is required by OpenZeppelin v5.6.1 (uses mcopy opcode).
# For L2 deployment (Arbitrum, Optimism), compile with cancun but verify L2 opcode support.
evm_version = "cancun"
# EIP-170 mainnet bytecode limit. Surfaced explicitly so deploy-size regressions
# fail at compile-time rather than at mainnet broadcast.
code_size_limit = 24576

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/uniswap-hooks/=lib/uniswap-hooks/",
    "forge-std/=lib/forge-std/src/",
    "@uniswap/v4-core/=lib/v4-core/",
    "@uniswap/v4-periphery/=lib/v4-periphery/",
    "solmate/=lib/solmate/src/",
    "solady/=lib/solady/src/",
    # Context-scoped: inside the V4 libs, solmate is imported as `solmate/src/...`
    # (vs. our V2 convention `solmate/...`). Scoping the override leaves the V2 build
    # untouched. Needed for the V4 test harness (Deployers pulls in solmate mocks).
    "lib/v4-core/:solmate/=lib/solmate/",
    "lib/v4-periphery/:solmate/=lib/solmate/",
]

[lint]
# The forge linter does not honor the context-scoped solmate remapping above, so
# during build-lint it fails to RESOLVE v4-core's internal `solmate/src/...` imports
# (which the compiler resolves fine). That turned a green compile into "Lint failed".
# Disable lint-on-build to keep `forge build` exit-0; lint our own code on demand
# with `forge lint src/v4`. Compilation + tests are unaffected.
lint_on_build = false

[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api?chainid=1" }
sepolia = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api?chainid=11155111" }

[rpc_endpoints]
mainnet = "${ETH_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"
# OPS 2026-07-12: private-mempool send-paths so an admin/deployer broadcast
# (acceptOwnership, deepen-LP into the shallow pool, BootstrapTWAP) can't be
# sandwiched or front-run in the public mempool. Use ONLY for `--broadcast`
# (send); keep `mainnet` for reads/nonce. Public URLs, no key. Private txs may
# take a few blocks to land — expect slower receipt polling. See
# docs/SECURITY_TOOLING.md.
#   forge script script/Foo.s.sol --rpc-url flashbots --broadcast --slow
flashbots = "https://rpc.flashbots.net/fast"
mevblocker = "https://rpc.mevblocker.io/fullprivacy"

# ─── Opt-in formal-verification profile (SMTChecker) ───────────────────────
# solc's built-in model checker — a FREE formal layer, ZERO new dependency. It
# runs ONLY when explicitly selected, so the default build + CI are unaffected.
#   Run (in CI, or any machine where `forge build` completes — local hangs):
#     FOUNDRY_PROFILE=smtcheck forge build
# Scoped to the flagship fixed-supply token so the CHC engine stays bounded;
# widen `contracts` to SwapFeeRouter fee-math / TWAP once tuned. Inherits
# src/solc/via_ir/remappings from [profile.default].
[profile.smtcheck.model_checker]
engine = "chc"
targets = ["assert", "overflow", "underflow", "divByZero"]
timeout = 100000            # ms per solver query
show_unproved = true
contracts = { "src/Toweli.sol" = ["Toweli"] }
