[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
optimizer = true
# mvp-launch: runs = 200 (the canonical OpenZeppelin / Solady / Solmate value).
# This is the correct runtime-gas optimum; it is NOT a size lever. EIP-170
# compliance for the heavy contracts is achieved by CONTRACT SPLITTING, not by
# dropping runs (dropping runs to 1 only saved ~1.2KB and never brought
# TegridyStaking under 24,576 — confirmed during the 2026-05-24 re-audit).
#
# MVP-path EIP-170 status. ALL FIGURES BELOW MEASURED 2026-07-23 — re-measure with
# `forge build --skip test --skip script` then read deployedBytecode.object length
# from out/<Name>.sol/<Name>.json before trusting them. Battle-tested approach: ZERO
# new custom marshalling code; only (1) DRY refactors that DELETE duplicated patterns,
# (2) verbatim Solady primitive swaps from billion-dollar protocols, (3) read-only
# sister contracts, (4) dropping dead external selectors to `internal`.
#
# TegridyStaking: 23,996 B (580 B headroom).
#   HISTORY: the 2026-05-30 note here read "24,537 B / ~39 B headroom, FROZEN for
#   launch". That figure went stale — the contract had silently drifted to 24,569 B,
#   i.e. SEVEN bytes of headroom, and CI did not catch it because TegridyStaking sat
#   on the contracts-ci.yml size-budget allowlist, which warned instead of erroring.
#   The 2026-07-23 golf reclaimed 573 B and took it back under the 24,000 CI floor;
#   it is now OFF that allowlist and held by a hard gate. See the two-tier allowlist
#   note in .github/workflows/contracts-ci.yml.
#   - src/lib/StakingViewLib.sol: read-only views (votingPowerOf / aggregateActive
#     BoostBps / earned / earnedFromMem) + resolveJbac JBAC-revalidation helper
#     (2026-05-30 DRY split: was inline in 3 callsites). `resolveJbac` is `internal`
#     so it inlines rather than paying the per-callsite delegatecall wrapper —
#     RE-CONFIRMED 2026-07-23: flipping it to `public` COSTS +107 B (3 wrappers beat
#     3 inlined bodies only for cheaply-bodied functions). Do not re-try this.
#   - src/lib/StakingRewardLib.sol: live reward-accounting cluster (May-24 C1).
#   - src/StakingMonitorView.sol: read-only SISTER contract exposing the heaviest
#     off-chain views (earned, getPosition) plus, since 2026-07-23,
#     stakeCapUtilizationBps / stakeCapHeadroom and the five lock/boost bounds
#     (MIN/MAX_LOCK_DURATION, MIN/MAX_BOOST_BPS, JBAC_BONUS_BPS) that dropped to
#     `internal` on the host. Forta / Defender / dashboards / indexers point at the
#     sister address — zero off-chain breakage, zero protocol state.
#     NOTE: the sister's copies of those five bounds are hand-mirrored (the host's are
#     `internal`, so the compiler cannot link them). test/StakingMonitorViewConstants.t.sol
#     pins them to the host's live `calculateBoost` curve so drift fails the build.
#   - Verbatim Solady swaps: SafeTransferLib (was OZ SafeERC20), EnumerableSetLib
#     (was OZ EnumerableSet), SafeCastLib (was OZ SafeCast). All assembly-tight
#     drop-ins used in production by Aerodrome, Uniswap V4 hooks, many others.
#   WHAT DID NOT WORK (measured 2026-07-23 — do not repeat):
#     - Collapsing the near-identical stake() / stakeWithBoost() prefixes into one
#       shared `_openPosition` helper: +148 B. via_ir already merges those blocks,
#       so the explicit helper only ADDS branch + call overhead. Source-level DRY is
#       NOT bytecode DRY under via_ir.
# TegridyFactory: 12,133 B (12,443 B headroom).
#   - src/lib/TegridyFactoryLib.sol: ERC-777 detection + CREATE2 pair deployment
#     (carries the ~11 KB type(TegridyPair).creationCode blob into the lib).
# SwapFeeRouter: 21,531 B (3,045 B headroom).
#   - src/lib/SwapFeeRouterConvertLib.sol: TWAP-floor conversion cluster.
# VoteIncentives: 24,197 B (379 B headroom) — now the TIGHTEST deploy-path contract
#   in the repo, having inherited that title from TegridyStaking. Watch this one next;
#   the VoteIncentivesAdmin split is the planned fix.
#
# TegridyRestaking: 31,399 B — DEFERRED to Phase 7 (removed from the MVP
#   DeployMVP/VerifyMVP path). MUST be split + deployed + wired before restaking
#   opens; it is the only LIVE-on-mainnet candidate currently over EIP-170.
#
# If a future change pushes any LIVE-on-mainnet contract back over 24,576, the
# right answer is to split that contract (extract to a linked library), NOT to
# drop runs.
optimizer_runs = 200
# via_ir kept on: SwapFeeRouter still has paths deep enough to need IR scheduling.
via_ir = true
# NOTE: cancun is required by OpenZeppelin v5.6.1 (uses mcopy opcode).
# For L2 deployment (Arbitrum, Optimism), compile with cancun but verify L2 opcode support.
evm_version = "cancun"
# EIP-170 mainnet bytecode limit. Surfaced explicitly so deploy-size regressions
# fail at compile-time rather than at mainnet broadcast.
code_size_limit = 24576

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/uniswap-hooks/=lib/uniswap-hooks/",
    "forge-std/=lib/forge-std/src/",
    "@uniswap/v4-core/=lib/v4-core/",
    "@uniswap/v4-periphery/=lib/v4-periphery/",
    "solmate/=lib/solmate/src/",
    "solady/=lib/solady/src/",
    # Context-scoped: inside the V4 libs, solmate is imported as `solmate/src/...`
    # (vs. our V2 convention `solmate/...`). Scoping the override leaves the V2 build
    # untouched. Needed for the V4 test harness (Deployers pulls in solmate mocks).
    "lib/v4-core/:solmate/=lib/solmate/",
    "lib/v4-periphery/:solmate/=lib/solmate/",
]

[lint]
# The forge linter does not honor the context-scoped solmate remapping above, so
# during build-lint it fails to RESOLVE v4-core's internal `solmate/src/...` imports
# (which the compiler resolves fine). That turned a green compile into "Lint failed".
# Disable lint-on-build to keep `forge build` exit-0; lint our own code on demand
# with `forge lint src/v4`. Compilation + tests are unaffected.
lint_on_build = false

[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api?chainid=1" }
sepolia = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api?chainid=11155111" }

[rpc_endpoints]
mainnet = "${ETH_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"
