[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
optimizer = true
# mvp-launch: after the 15-contract MVP cut, runs restored to 200 — the canonical
# OpenZeppelin / Solady / Solmate value. Pre-cut the value was pinned to 1 to
# squeeze TegridyStaking under the EIP-170 24,576-byte limit. With Lending /
# NFTLending / Gauges / Vote / Drop / Launchpad moved to the next-wave branch,
# the remaining 15 MVP contracts have enough headroom that runs=200 is safe AND
# removes the runtime-gas tax users were paying on every call.
# If a future change pushes any MVP contract back over 24KB, the right answer
# is to split that contract, NOT to drop runs again.
optimizer_runs = 200
# via_ir kept on: SwapFeeRouter still has paths deep enough to need IR scheduling.
via_ir = true
# NOTE: cancun is required by OpenZeppelin v5.6.1 (uses mcopy opcode).
# For L2 deployment (Arbitrum, Optimism), compile with cancun but verify L2 opcode support.
evm_version = "cancun"
# EIP-170 mainnet bytecode limit. Surfaced explicitly so deploy-size regressions
# fail at compile-time rather than at mainnet broadcast.
code_size_limit = 24576

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/uniswap-hooks/=lib/uniswap-hooks/",
    "forge-std/=lib/forge-std/src/",
    "@uniswap/v4-core/=lib/v4-core/",
    "@uniswap/v4-periphery/=lib/v4-periphery/",
    "solmate/=lib/solmate/src/",
    "solady/=lib/solady/src/",
]

[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api?chainid=1" }
sepolia = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api?chainid=11155111" }

[rpc_endpoints]
mainnet = "${ETH_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"
