# Gitleaks configuration for Tegridy Farms.
#
# `useDefault = true` keeps the ENTIRE default gitleaks ruleset (all secret
# detectors stay active — this does NOT weaken the gate). We only add a narrow
# allowlist for KNOWN-PUBLIC on-chain constants that trip the `generic-api-key`
# high-entropy heuristic. An Ethereum address is public data by definition and is
# never a secret; a private key is 66 chars (0x + 64 hex), so exempting an exact
# 42-char (0x + 40 hex) address does not exempt any key.
[extend]
useDefault = true

[allowlist]
description = "Known-public on-chain constants (not secrets)"
# Match against the flagged finding.
regexTarget = "match"
#
# EVERY entry below is `(?i)`. This is load-bearing, and its absence is what
# broke the gate on 2026-07-30.
#
# Gitleaks regexes are case-sensitive (Go RE2). These addresses were written
# here in EIP-55 CHECKSUMMED form, but the same addresses appear ALL-LOWERCASE
# elsewhere in the repo — `cast`-friendly shell scripts in particular. So the
# allowlist silently did not apply to the lowercase copies:
#
#   .gitleaks.toml        0x9DC2675B2017687dD9768C63D15f0aD5194Fa3f5   allowlisted
#   rehome-ownership.sh   0x9dc2675b2017687dd9768c63d15f0ad5194fa3f5   NOT matched
#
# The gate had been green on every trunk push for weeks because the narrow
# per-push scan never reached those 2026-07-18 commits; a wider scan on
# 2026-07-30 did, and trunk went red on three findings that were public
# addresses all along. Always add `(?i)` — an address is the same address in any
# casing, and EIP-55 checksumming means both forms circulate freely.
#
# WIDENED 2026-07-30, deliberately, to close the CLASS rather than keep chasing
# individual addresses. This replaces three per-address entries.
#
# Four separate incidents were the same false positive — a 42-char Ethereum
# address tripping the `generic-api-key` entropy heuristic:
#   2026-07-12  aee9f96   TOWELI token       0x420698CF…78F9D
#   2026-07-22  062afc1   PremiumAccess      0x9DC2675B…Fa3f5  (checksummed copy)
#   2026-07-30  f48f3c0   PremiumAccess      0x9dc2675b…fa3f5  (lowercase copies in
#                         contracts/script/rehome-ownership.sh:61 and
#                         cancel-gated-pending.sh:51)
#   2026-07-30  e8471c2   tokenFactory       0x89c261c0…45292  (test fixture)
# Addresses are spreading, not shrinking — they live in contracts, scripts,
# tests, docs, constants and security.txt. A per-address list guarantees a
# fourth, fifth and sixth red trunk.
#
# WHY THIS IS SAFE, and it is the only reason it is acceptable to widen a
# secret scanner: an address is `0x` + EXACTLY 40 hex. A private key is `0x` +
# 64 hex. The trailing `\b` means the pattern cannot match the leading 40 hex of
# a longer hex run, so a key is NOT exempted. Verified against RE2 semantics
# before adopting:
#   0x<40 hex> lowercase / checksummed / mid-sentence  -> MATCH   (intended)
#   0x<64 hex>  (private key, either casing)           -> NO MATCH
#   0x<41 hex>                                         -> NO MATCH
#   sk_live_… / ghp_…                                  -> NO MATCH
#
# `useDefault = true` above is untouched: every default detector stays active.
# This narrows ONE heuristic's false-positive surface, it does not disable rules.
#
# ⚠ What this DOES cost, stated plainly: a genuine 20-byte-hex secret would now
# be exempt, and so are SHA-1 hashes. If a credential format like that ever
# enters this repo, this entry must be reconsidered.
#
# \ SOLANA, added 2026-09-03 \\\\\\\\\\\\\\\\\\\\\\\\@
#
# Same false positive, second chain. Seven findings on one PR, every one a public
# Solana mint or pool id sitting in a test fixture — the SOY and BOBO pump.fun
# mints and a sender pubkey, all three of which ALREADY live on trunk in
# lib/bungalows.ts, lib/bungalows.test.ts and hooks/usePoolTrades.test.ts. They
# had never been flagged only because a PR scan walks the PR's own commit range;
# re-stating a long-public address in a new file made the same constant "new".
#
# These are listed as EXACT ids, deliberately, and NOT as a base58 shape rule.
# A base58 class rule of the form {32,44} was written first and then withdrawn,
# because the length argument that justifies the 40-hex entry above does NOT
# carry over to base58. The reasoning that failed, recorded so it is not
# re-derived by the next person who sees seven public mints red a branch:
#
#   The claim was "a Solana public key is 32 bytes -> 32..44 base58 chars, a
#   secret key is 64 bytes -> 87..88, the ranges do not overlap, so the
#   exemption cannot reach a key." The premise is false. 87..88 chars is the
#   EXPANDED 64-byte keypair. The 32-byte Ed25519 SEED is by itself a complete,
#   sufficient private key — it is what solana-keygen recovers from and what
#   wallets export — and 32 bytes of base58 is 43..44 chars. That is exactly
#   the width of a public key. Length cannot separate a Solana secret from a
#   Solana pubkey, because on this curve they are the same number of bytes.
#
# Measured against gitleaks 8.24.3 by planting synthetic credentials and
# scanning with the shape rule present vs absent. Of six planted seeds the
# default ruleset flagged five; the shape rule flagged none. It suppressed:
#   32-byte Ed25519 seed in base58 (a usable private key)   every instance
#   SendGrid SG.<22>.<43>, tail segment base58-clean         ~1.6% of keys
#   AWS secret access key, 40 chars, base58-clean            ~2% of keys
#   any bare 32..44 base58 credential carrying no prefix
# The dot- and hyphen-delimited cases are the ones a prefix argument misses:
# underscore is a word character, so ghp_ and sk_live_ really are unreachable,
# but "." and "-" are not, so each segment of a multi-part token gets its own
# word boundary and becomes a candidate by itself. That is how a dedicated,
# high-confidence rule (sendgrid-api-token) ended up silenced by a shape rule
# aimed at an entropy heuristic: this allowlist is global and applies to EVERY
# rule, not only to the one that motivated it.
#
# So this stays a closed list of exact strings. Each was verified present on
# origin/mvp-launch before being added, and each is a public on-chain identifier
# the app already prints in its own UI. An exact string cannot hide a second
# value the way a shape can. The treadmill this costs — a future public id
# trips the heuristic and reds the branch until it is listed here — is the
# correct price, because the alternative measurably blinds the scanner to the
# one secret format a Solana repo is most likely to leak. The better fix sits
# upstream of this file: have the fixtures import these ids from
# lib/bungalows.ts rather than restating them, so entries get DELETED not added.
regexes = [
  '''(?i)\b0x[a-f0-9]{40}\b''',
  # BOBO mint (bungalows.ts:336), also inside its jup.ag swap URL
  '''\b4nV5gNwwP68zUDat26ySChREqVaQaLudfJBkSgEzpump\b''',
  # SOY mint (bungalows.ts:338)
  '''\b8zsZESzrGoYVi1dVH4QNWXJ2EfW4v287aEGNiDvQpump\b''',
  # RIZZ mint (bungalows.ts:346)
  '''\b5ad4puH6yDBoeCcrQfwV5s9bxvPnAeWDoYDj3uLyBS8k\b''',
  # BOBO / SOL pool id (bungalows.ts:336)
  '''\b31ZmTzEufRDBGKsJ7NicCkEKxtPQgAEMQvdbCuUfE6GX\b''',
  # sender pubkey in the pool-trades fixture (usePoolTrades.test.ts:22)
  '''\bDJFP3qJroFzcvZj3YowPmrNu6WoMo6njVB3dywTewua5\b''',
]
