  # commit 2de8a915). Flagged by `generic-api-key` as `token_address: '…'`.
  '''\b7hmVkPXmVagxoptAEpx4jBzZVHwGLdFj6c1y42qxpump\b''',
  # \ JUNGLETS, added 2026-09-24 \\\\\\\\\\\\\\\\\\\\\\\\@
  #
  # Ten public Solana ids from a Junglets listings answer that earlier commits of
