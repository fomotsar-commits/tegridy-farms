[toolchain]
anchor_version = "1.0.2"
solana_version = "3.1.10"

[workspace]
members = ["programs/amm"]

[features]
resolution = true
skip-lint = false

[programs.localnet]
# memetics.finance: the placeholder id in lib.rs, until the deploy pack makes the real one.
raydium_clmm = "RangePoo1PLACEHo1DERnotDep1oyed111111111111"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[test]
startup_wait = 10000

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/*.test.ts"

[test.validator]
url = "https://api.mainnet-beta.solana.com"

# metadata program address
[[test.validator.clone]]
address = "metaqbxxUerdq28cj1RbAWkYQm3ybzjb6a8bt518x1s"

# memetics.finance: upstream also cloned Raydium's two AMM configs here. A config of this
# copy is made by its own admin, so they are gone.
