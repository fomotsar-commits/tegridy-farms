[workspace]
resolver = "2"
members = ["programs/*"]
# memetics.finance: Raydium's uint fork, at the commit upstream's lock named, so the build
# fetches nothing from Raydium. Not a member: its own dev-dependencies stay out of the lock.
exclude = ["vendor"]

[workspace.metadata.cli]
solana = "3.1.10"

[profile.test]
opt-level = 0

[profile.release]
lto = "fat"
codegen-units = 1
overflow-checks = true

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
