[toolchain]
anchor_version = "0.32.1"
solana_version = "2.3.0"

[workspace]
# Anchor resolves `anchor build -p <name>` against THIS list, not against
# [programs.Localnet] — listing a program only in the latter yields
# "not part of the workspace".
members = ["programs/cp-swap", "programs/tegridy-launch", "programs/bayla-ladder"]

[features]
seeds = false
skip-lint = false

# TEGRIDY FORK: fork program id (matches declare_id / keys/tegridy-amm-program.json).
# NOTE for whoever adapts the test suite: the create_pool_fee_reveiver is now a WSOL
# token account (27AC7Yww… under --features devnet), NOT the upstream DNXge… clone
# below — the create-pool tests must set up a WSOL account at that address instead.
[programs.Localnet]
raydium_cp_swap = "3ZvZXEBr21Kz7JeWFCeKv8Hyy8AzHqCSXNjif8QHPM9y"
# Our own bonding curve. Placeholder id — replaced with a dedicated keypair
# before any real deploy, same as the cp-swap fork's.
tegridy_launch = "CpFnacrACftonjeQ4hJBkja3PkrwvFSRFzBEk9oKhzED"
# Lock-ladder staking with the 25% early exit — the Solana port of LighthouseLadder.sol.
# Placeholder id, same convention as the two above; a dedicated keypair replaces it
# before any real deploy.
bayla_ladder = "GKwgTQtVyPGxspxvciDAStY4Jq7rB1STuVvXic7EG6E4"


[registry]
url = "https://github.com/fomotsar-commits/tegridy-farms"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn install && yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/*.test.ts"

[test]
startup_wait = 10000

[test.validator]
url = "https://api.mainnet-beta.solana.com"

[[test.validator.clone]]
address = "DNXgeM9EiiaAbaWvwjHj9fQQLAX5ZsfHyvmYUNRAdNC8" # pool fee receiver

[[test.validator.clone]]
address = "D4FPEruKEHrG5TenZ2mpDGEfu1iUvTiqBxvpU8HLBvC2" # index 0 AMM Config account
