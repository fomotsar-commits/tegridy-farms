[package]
name = "tegridy-launch"
version = "0.1.0"
description = "Tegridy launch bonding curve — graduates into Tegridy CP-AMM"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "tegridy_launch"

[features]
no-entrypoint = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
devnet = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
# Pinned to the same versions the cp-swap fork uses — the graduation instruction
# CPIs into it, so a mismatch here would be an ABI mismatch there.
anchor-lang = { version = "0.32.1", features = ["init-if-needed", "event-cpi"] }
anchor-spl = { version = "0.32.1", features = ["memo", "metadata"] }

# No dev-dependencies on purpose. `curve.rs` is dependency-free so its tests run
# under a bare `rustc --test`, with no cargo, no build scripts, and no validator
# — which is what lets the math be verified on a box where the SBF toolchain and
# cargo build scripts are both blocked. Do not add a test crate here without a
# reason that survives that constraint.

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = true
