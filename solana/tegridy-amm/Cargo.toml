[workspace]
resolver = "2"
members = ["programs/*", "client"]

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
# Solana programs cannot unwind — the runtime aborts on panic regardless. Without
# this, rustc still emits landing pads and unwind tables, and that dead machinery
# counts against SBF's hard 4 KB per-function stack frame.
#
# It is load-bearing here, not hygiene: `U512::overflowing_pow` (generated by
# `construct_uint!` in the vendored Raydium CLMM math, and called by nothing) came in
# at 4,280 bytes against the 4,096 limit — over by 184. Both upstream raydium-clmm
# and cp-swap carry `panic = "abort"` in their own profiles; ours did not, and
# Cargo IGNORES profiles on non-root workspace members, so cp-swap's was inert and
# this root profile was the only one that ever applied.
panic = "abort"
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
